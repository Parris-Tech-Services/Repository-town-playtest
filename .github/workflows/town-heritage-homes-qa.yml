name: Publish isolated heritage homes visitor QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/town-heritage-homes-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: town-heritage-homes-qa-20261025
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact merged Repository Town commit
        uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: e9fc9e4b30ec5bfd6351ac96cb4152705d722c5c
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json
      - name: Generate and validate public visitor build
        working-directory: source/repository-town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node tests/heritage-homes.mjs
          npm run build
          npm run check:privacy
          node tests/heritage-public-release.mjs
          node tools/verify-release.mjs dist/public
          node -e "const r=require('./dist/public/release.json');if(r.sourceCommit!=='e9fc9e4b30ec5bfd6351ac96cb4152705d722c5c')throw Error('Wrong source commit')"
      - name: Checkout Pages site without replacing homepage
        uses: actions/checkout@v4
        with:
          repository: Parris-Tech-Services/Repository-town-playtest
          ref: main
          path: site
          persist-credentials: true
      - name: Publish exact verified build to isolated address
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum site/index.html | cut -d' ' -f1)
          dest=site/qa/heritage-homes-20261025
          mkdir -p "$dest"
          rsync -a --delete source/repository-town/dist/public/ "$dest/"
          printf 'Visitor heritage homes build QA, not a general-release or exact reconstruction certificate.\nSource: joshualparris/JoshMemory\nCommit: e9fc9e4b30ec5bfd6351ac96cb4152705d722c5c\nFull-town economy test is separately red on baseline main.\n' > "$dest/QA_BUILD.txt"
          test "$(sha256sum site/index.html | cut -d' ' -f1)" = "$before"
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/heritage-homes-20261025
          if ! git diff --cached --quiet; then
            git commit -m "qa(town): verified heritage houses visitor build [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Visitor QA link
        run: echo 'https://parris-tech-services.github.io/Repository-town-playtest/qa/heritage-homes-20261025/'
