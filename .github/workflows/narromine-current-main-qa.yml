name: Narromine current-source live QA preview (isolated)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/narromine-current-main-qa.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narromine-current-source-qa
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact reviewed JoshMemory main revision
        uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: afb89a40cdacdc65cbf4398b451b52592f579dc0
          path: source
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json
      - name: Install and run full privacy, integration and release gates
        working-directory: source/repository-town
        run: |
          npm ci --no-audit --no-fund
          npm run build:release
          node tools/verify-release.mjs dist/public
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const manifest=JSON.parse(fs.readFileSync('dist/public/release.json'));
          const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(manifest.sourceCommit!==actual || actual!=='afb89a40cdacdc65cbf4398b451b52592f579dc0') throw Error('Source revision mismatch');
          if(!/^[0-9a-f]{64}$/.test(manifest.contentHash)) throw Error('Invalid build fingerprint');
          for(const p of ['world/narromine-nw-dandaloo-block.js','world/narromine-mainstreet-physio.js',
            'world/narromine-roof-lettering.js','world/narromine-coles.js',
            'world/narromine-postal-character.js','world/narromine-nsw-evidence.js']) {
            // Only require known runtime assets; NSW evidence may be data-only.
            if(p.endsWith('narromine-nsw-evidence.js')) continue;
            if(!fs.existsSync('dist/public/'+p)) throw Error('Missing Narromine asset: '+p);
          }
          console.log('Source and content fingerprint verified:',actual,manifest.contentHash);
          NODE
      - name: Playtest live game in desktop and Android-sized Chromium
        working-directory: source/repository-town
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node tests/narromine-postal-resident.mjs
          # The Post Office's real-game browser test expects port 8091.
          # Start the exact already-built release and verify server readiness.
          node tools/serve.mjs dist/public 8091 >/tmp/narromine-rt068-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8091/release.json >/dev/null
          node tests/narromine-post-office-browser.mjs
          node tests/narromine-nw-dandaloo-browser.mjs --url http://127.0.0.1:8091/
          node tests/narromine-mainstreet-physio-browser.mjs --url http://127.0.0.1:8091/
      - name: Preserve independent screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narromine-current-main-desktop-mobile
          path: |
            source/repository-town/test-results/narromine-nw-dandaloo/
            source/repository-town/test-results/narromine-physio/
            source/repository-town/test-results/narromine-post-office/
          retention-days: 14
          if-no-files-found: warn
      - name: Checkout existing QA Pages site (keep root and other previews)
        uses: actions/checkout@v4
        with:
          repository: Parris-Tech-Services/Repository-town-playtest
          ref: main
          path: site
          persist-credentials: true
      - name: Publish only versioned Narromine QA folder after all tests
        shell: bash
        run: |
          set -euo pipefail
          target="site/qa/narromine-rt068-20261104"
          mkdir -p "$target"
          rsync -a --delete source/repository-town/dist/public/ "$target/"
          test -f site/index.html
          grep -q 'Download saved progress' site/index.html
          sha="$(git -C source rev-parse HEAD)"
          hash="$(node -p "require('./source/repository-town/dist/public/release.json').contentHash")"
          printf 'Source: joshualparris/JoshMemory\nCommit: %s\nContentHash: %s\nGates: full release + privacy + desktop/Android browser tests\nPreview only: different origin => separate local saved games\n' "$sha" "$hash" > "$target/QA_BUILD.txt"
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add qa/narromine-rt068-20261104
          if git -C site diff --cached --quiet; then
            echo 'Identical source verified, no publish needed'
          else
            git -C site commit -m "qa(narromine): independent verified preview for $sha [skip ci]"
            git -C site push origin HEAD:main
          fi
      - name: Published QA URL
        run: echo 'https://parris-tech-services.github.io/Repository-town-playtest/qa/narromine-rt068-20261104/'
