name: YNRM flight isolated QA release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/narromine-flight-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: 3eb6733ab5b0a91c2cc1832843559579637b6ca3
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json
      - name: Release, privacy and integrity gates
        working-directory: source/repository-town
        run: |
          npm ci --no-audit --no-fund
          npm run build:release
          node tools/verify-release.mjs dist/public
          node -e "const r=require('./dist/public/release.json');if(r.sourceCommit!=='3eb6733ab5b0a91c2cc1832843559579637b6ca3')throw Error('Wrong source SHA');console.log(r.sourceCommit,r.contentHash)"
      - name: Desktop and touch flight through landing and exit
        working-directory: source/repository-town
        run: |
          npx playwright install --with-deps chromium
          node tests/narromine-flight-browser.mjs
      - uses: actions/checkout@v4
        with:
          path: site
          ref: main
      - name: Preserve existing site and publish isolated generated folder
        run: |
          set -euo pipefail
          target=site/qa/narromine-flight-20261105
          mkdir -p "$target"
          rsync -a --delete source/repository-town/dist/public/ "$target/"
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add qa/narromine-flight-20261105
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "qa: publish tested YNRM flight 3eb6733ab5b0a91c2cc1832843559579637b6ca3 [skip ci]"
            git -C site pull --no-rebase origin main
            git -C site push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify hosted SHA and repeat desktop and phone acceptance
        working-directory: source/repository-town
        env:
          TOWN_URL: https://parris-tech-services.github.io/Repository-town-playtest/qa/narromine-flight-20261105/
          FLIGHT_SCREENSHOT_DIR: test-results/narromine-flight-live
        run: |
          node --input-type=module -e "const r=await fetch(process.env.TOWN_URL+'release.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()});if(r.sourceCommit!=='3eb6733ab5b0a91c2cc1832843559579637b6ca3')throw Error('Live SHA mismatch');console.log(JSON.stringify(r))"
          node tests/narromine-flight-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narromine-flight-qa-evidence
          path: |
            source/repository-town/test-results/narromine-flight/
            source/repository-town/test-results/narromine-flight-live/
          retention-days: 14
