name: Publish isolated RTPUB-002/024 pub envelope QA build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/town-pub-envelope-002-024.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: town-pub-envelope-002-024
  cancel-in-progress: false
jobs:
  pub-safety-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact reconciled pub source (no credentials)
        uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: 49984e3780f1ad3a70e7106df8e342b9dcc08b95
          path: source
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json
      - name: Focused measured facade/roof checks, utility and privacy acceptance (QA only)
        working-directory: source/repository-town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/pub-envelope-002-024.mjs tests/pub-2026-audit.mjs tests/pub-history.mjs
          node tests/pub-utilities.mjs
          node tests/shop-interiors.mjs
          npm run build
          npm run check:privacy
          node tools/verify-release.mjs dist/public
          node -e "const r=require('./dist/public/release.json'); if(r.sourceCommit!=='49984e3780f1ad3a70e7106df8e342b9dcc08b95') throw Error('Wrong game source SHA');"
          test -f dist/public/world/pub-envelope.js
          test -f dist/public/world/pub-history.js
          test -f dist/public/world/pub-utilities.js
          test -f dist/public/world/electrical-pilot.js
      - name: Test pub gameplay on desktop and Android viewport
        working-directory: source/repository-town
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node tools/serve.mjs dist/public 8091 > /tmp/pub-safety-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/pub-utilities-browser.mjs
      - name: Upload QA browser evidence even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-envelope-desktop-android
          path: source/repository-town/audit/pub-utilities/
      - name: Checkout existing Pages QA handover without changing homepage
        uses: actions/checkout@v4
        with:
          repository: Parris-Tech-Services/Repository-town-playtest
          ref: main
          path: site
          persist-credentials: true
      - name: Publish pinned build in isolated directory
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum site/index.html | cut -d' ' -f1)
          target=site/qa/pub-envelope-002-024
          mkdir -p "$target"
          rsync -a --delete source/repository-town/dist/public/ "$target/"
          actual=$(git -C source rev-parse HEAD)
          test "$actual" = '49984e3780f1ad3a70e7106df8e342b9dcc08b95'
          printf 'Source: joshualparris/JoshMemory\nCommit: %s\nStatus: isolated geometry/browser QA, NOT production or certified NCC compliance; full town safety gate separately red\n' "$actual" > "$target/QA_BUILD.txt"
          test -f "$target/release.json"
          test "$(sha256sum site/index.html | cut -d' ' -f1)" = "$before"
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/pub-envelope-002-024
          if ! git diff --cached --quiet; then
            git commit -m "qa(town): publish verified single-storey pub geometry preview $actual [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Report QA URL
        run: echo 'https://parris-tech-services.github.io/Repository-town-playtest/qa/pub-envelope-002-024/'
