<script>
  // The game, its sources and the save are filled in by tools/pack_games.mjs.
  window.GAME = {"title":"Carl: Python Crawler","main":"crawler.py","module":null,"path":[],"sources":{"crawler.py":"from src.game import Game\n\n\ndef main():\n    game = Game()\n    game.run()\n\n\nif __name__ == \"__main__\":\n    main()\n","src/__init__.py":"\n","src/announcements.py":"class AnnouncementManager:\n    def __init__(self, templates):\n        self.templates = templates\n        self.history = []\n\n    def emit(self, event_id, **values):\n        template = self.templates.get(event_id)\n        if not template:\n            return \"\"\n\n        text = template[\"text\"].format(**values)\n        line = f\"SYSTEM: {text}\"\n        self.history.append(line)\n        return line\n","src/data_loader.py":"import json\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nDATA_DIR = ROOT / \"data\"\n\n\ndef load_json(name):\n    with (DATA_DIR / name).open(\"r\", encoding=\"utf-8\") as handle:\n        return json.load(handle)\n\n\ndef load_map(name):\n    with (DATA_DIR / name).open(\"r\", encoding=\"utf-8\") as handle:\n        return [line.rstrip(\"\\n\") for line in handle if line.rstrip(\"\\n\")]\n","src/data_repository.py":"from dataclasses import dataclass\n\nfrom src.data_loader import load_json, load_map\nfrom src.engine.validation import DataValidator\n\n\n@dataclass\nclass GameData:\n    characters: dict\n    items: dict\n    dialogue: dict\n    announcements: dict\n    quests: list\n    recipes: dict\n    objects: dict\n    hazards: dict\n    map_rows: list[str]\n\n\nclass DataRepository:\n    def __init__(self, validator=None):\n        self.validator = validator or DataValidator()\n\n    def load(self):\n        data = GameData(\n            characters=load_json(\"characters.json\"),\n            items=load_json(\"items.json\"),\n            dialogue=load_json(\"dialogue.json\"),\n            announcements=load_json(\"announcements.json\"),\n            quests=load_json(\"quests.json\"),\n            recipes=load_json(\"recipes.json\"),\n            objects=load_json(\"objects.json\"),\n            hazards=load_json(\"hazards.json\"),\n            map_rows=load_map(\"tutorial_guild_map.txt\"),\n        )\n        self.validator.validate_all(data.__dict__)\n        return data\n","src/engine/__init__.py":"\n","src/engine/actions.py":"from src.save_system import load_game, save_game\nfrom src.engine.combat import CombatSystem\n\n\nMOVES = {\n    \"w\": (0, -1),\n    \"s\": (0, 1),\n    \"a\": (-1, 0),\n    \"d\": (1, 0),\n}\n\n\nclass ActionProcessor:\n    def __init__(self, state):\n        self.state = state\n        self.combat = CombatSystem(state)\n\n    def handle(self, action):\n        action = action.strip().lower()\n        if action in MOVES:\n            return self._move(action)\n        if action == \"t\":\n            return self._talk()\n        if action == \"o\":\n            return self._open()\n        if action == \"i\":\n            return self._inventory()\n        if action == \"c\":\n            return self._craft()\n        if action == \"x\":\n            return self._attack()\n        if action == \"u\":\n            return self._use_item()\n        if action == \"e\":\n            return self._equip()\n        if action == \"p\":\n            return self._pickup()\n        if action == \"b\":\n            return self._buy()\n        if action in {\"f\", \"h\", \"r\"}:\n            return self._companion_mode(action)\n        if action == \"k\":\n            restored = self.state.restore_checkpoint()\n            if restored:\n                self.state.events.push(\"checkpoint_loaded\", \"Checkpoint restored.\")\n            return False\n        if action == \"v\":\n            path = save_game(self.state.world, self.state.quests, self.state)\n            self.state.make_checkpoint()\n            self.state.events.push(\"game_saved\", f\"Game saved: {path.name}\")\n            return False\n        if action == \"l\":\n            loaded = load_game(self.state.world, self.state.quests, self.state)\n            message = \"Game loaded.\" if loaded else \"No save file exists yet.\"\n            self.state.events.push(\"game_loaded\", message, loaded=loaded)\n            return False\n        if action == \"q\":\n            message = self.state.announcements.emit(\"quit\")\n            self.state.events.push(\"quit\", message)\n            return True\n\n        self.state.events.push(\"invalid_action\", \"Invalid command. Use W/A/S/D, T, O, I, C, X, U, E, P, B, F/H/R, V, L, K, or Q.\")\n        return False\n\n    def _move(self, action):\n        dx, dy = MOVES[action]\n        moved = self.state.world.move_entity(\"carl\", dx, dy)\n        if not moved:\n            message = self.state.announcements.emit(\"bump\")\n            self.state.events.push(\"movement_blocked\", message, actor=\"carl\")\n            self.state.quests.record_event(\"movement_blocked\")\n            return False\n\n        self.state.world.follow_entity(\"donut\", \"carl\")\n        completed_messages = self.state.quests.record_event(\"player_moved\")\n        self.state.events.push(\"player_moved\", actor=\"carl\", dx=dx, dy=dy)\n        for msg in completed_messages:\n            self.state.events.push(\"quest_completed\", msg)\n\n        hazard = self.state.world.hazard_at(self.state.world.carl.x, self.state.world.carl.y)\n        if hazard:\n            self._apply_hazard(hazard)\n\n        if self.state.world.near(\"mordecai\"):\n            self.state.events.push(\"near_npc\", \"Mordecai is close enough to talk. Press T.\", npc=\"mordecai\")\n        else:\n            self.state.events.push(\"companion_banter\", self.state.escalating_donut_complaint())\n        return False\n\n    def _talk(self):\n        npc = self.state.world.near_entity(entity_type=\"npc\")\n        if not npc:\n            self.state.events.push(\"talk_failed\", \"There is nobody close enough to talk to.\")\n            return False\n\n        lines = self.state.dialogue[npc.entity_id]\n        index = self.state.dialogue_index.get(npc.entity_id, 0)\n        message = lines[index][\"text\"]\n        self.state.dialogue_index[npc.entity_id] = min(index + 1, len(lines) - 1)\n        self.state.events.push(\"dialogue\", message, speaker=npc.entity_id)\n        if npc.entity_id == \"mordecai\" and index >= 1:\n            completed_messages = self.state.quests.record_event(\"spoke_to_mordecai\")\n            for msg in completed_messages:\n                self.state.events.push(\"quest_completed\", msg)\n        return False\n\n    def _open(self):\n        obj = self.state.world.near_object(object_type=\"chest\")\n        if not obj:\n            self.state.events.push(\"open_failed\", \"Nothing nearby opens. The desk definitely does not count.\")\n            return False\n        if obj.state.get(\"opened\"):\n            self.state.events.push(\"open_failed\", \"The tutorial chest is already open. Donut is still disappointed by its presentation.\")\n            return False\n\n        obj.state[\"opened\"] = True\n        obj.blocks_movement = False\n        obj.symbol = \".\"\n        for item_id in obj.state.get(\"contains\", []):\n            self.state.world.carl.inventory.append(item_id)\n        message = self.state.announcements.emit(\"chest_opened\")\n        self.state.events.push(\"object_opened\", message, object_id=obj.object_id)\n        completed_messages = self.state.quests.record_event(\"opened_tutorial_chest\")\n        for msg in completed_messages:\n            self.state.events.push(\"quest_completed\", msg)\n        return False\n\n    def _inventory(self):\n        lines = self.state.inventory_lines(\"carl\")\n        completed_messages = self.state.quests.record_event(\"inspected_inventory\")\n        self.state.events.push(\"inventory_viewed\", \"\\n\".join(lines) if lines else \"Inventory empty.\")\n        for msg in completed_messages:\n            self.state.events.push(\"quest_completed\", msg)\n        return False\n\n    def _craft(self):\n        recipe = self.state.find_available_recipe(\"carl\")\n        if not recipe:\n            self.state.events.push(\"craft_failed\", \"Carl needs something unstable before he can make something worse.\")\n            return False\n        actor = self.state.world.carl\n        for ingredient in recipe[\"ingredients\"]:\n            actor.inventory.remove(ingredient)\n        actor.inventory.append(recipe[\"result\"])\n        message = self.state.announcements.emit(recipe.get(\"announcement\", \"crafted_explosive\"))\n        self.state.events.push(\"item_crafted\", message, recipe_id=recipe[\"id\"], item_id=recipe[\"result\"])\n        completed_messages = self.state.quests.record_event(\"crafted_first_explosive\")\n        for msg in completed_messages:\n            self.state.events.push(\"quest_completed\", msg)\n        return False\n\n    def _attack(self):\n        target = self.combat.nearest_enemy(\"carl\", distance=1)\n        if not target:\n            self.state.events.push(\"attack_failed\", \"Carl swings at the concept of danger. Nothing happens.\")\n            return False\n        message = self.combat.attack(\"carl\", target.entity_id)\n        if message:\n            self.state.events.push(\"combat_result\", message)\n        self.state.viewer.change(1, \"basic violence\", target=\"carl\")\n        return False\n\n    def _use_item(self):\n        actor = self.state.world.carl\n        explosive = next((item_id for item_id in actor.inventory if \"explosive\" in self.state.items[item_id].get(\"tags\", [])), None)\n        if not explosive:\n            self.state.events.push(\"use_failed\", \"Carl has nothing explosively useful ready.\")\n            return False\n        target = self.combat.nearest_enemy(\"carl\", distance=3)\n        if not target:\n            self.state.events.push(\"use_failed\", \"No enemy is close enough to make this a responsible bad idea.\")\n            return False\n        message = self.combat.attack(\"carl\", target.entity_id, item_id=explosive)\n        if message:\n            self.state.events.push(\"combat_result\", message)\n        self.state.viewer.change(6, \"explosive problem solving\", target=\"carl\")\n        return False\n\n    def _equip(self):\n        message = self.state.equip_first_available(\"carl\")\n        self.state.events.push(\"equipment_changed\", message)\n        return False\n\n    def _pickup(self):\n        obj = self.state.world.near_object(object_type=\"pickup\", distance=0)\n        if not obj:\n            self.state.events.push(\"pickup_failed\", \"There is nothing here to pick up.\")\n            return False\n        item_id = obj.state.get(\"item_id\")\n        if not item_id:\n            self.state.events.push(\"pickup_failed\", \"That pickup is suspiciously empty.\")\n            return False\n        self.state.world.carl.inventory.append(item_id)\n        obj.state[\"picked_up\"] = True\n        obj.symbol = \".\"\n        obj.x = -1\n        obj.y = -1\n        completed_messages = self.state.quests.record_event(\"picked_up_item\")\n        self.state.events.push(\"item_picked_up\", f\"Picked up {self.state.items[item_id]['name']}.\", item_id=item_id)\n        for msg in completed_messages:\n            self.state.events.push(\"quest_completed\", msg)\n        return False\n\n    def _buy(self):\n        shop = self.state.world.near_object(object_type=\"shop\")\n        if not shop:\n            self.state.events.push(\"shop_failed\", \"No shop is close enough to overcharge you.\")\n            return False\n        if not shop.shop_inventory:\n            self.state.events.push(\"shop_failed\", \"The shop has nothing useful, which feels personal.\")\n            return False\n        item_id = shop.shop_inventory[0]\n        self.state.world.carl.inventory.append(item_id)\n        self.state.events.push(\"shop_purchase\", f\"Bought {self.state.items[item_id]['name']} from {shop.name}.\")\n        return False\n\n    def _companion_mode(self, action):\n        modes = {\"f\": \"follow\", \"h\": \"hide\", \"r\": \"retreat\"}\n        mode = modes[action]\n        self.state.world.donut.state[\"mode\"] = mode\n        self.state.events.push(\"companion_mode\", f\"Donut mode set to {mode}.\", mode=mode)\n        return False\n\n    def _apply_hazard(self, hazard):\n        carl = self.state.world.carl\n        if hazard.effect == \"trap\":\n            damage = max(1, hazard.severity - carl.resources.armor)\n            carl.resources.health = max(0, carl.resources.health - damage)\n            self.state.events.push(\"hazard_triggered\", f\"Trap triggered: Carl takes {damage} damage.\", hazard=hazard.hazard_id)\n            completed_messages = self.state.quests.record_event(\"triggered_hazard\")\n            for msg in completed_messages:\n                self.state.events.push(\"quest_completed\", msg)\n        elif hazard.effect == \"rough\":\n            carl.resources.stamina = max(0, carl.resources.stamina - 1)\n            self.state.events.push(\"hazard_triggered\", \"Rough terrain costs Carl 1 stamina.\", hazard=hazard.hazard_id)\n            completed_messages = self.state.quests.record_event(\"triggered_hazard\")\n            for msg in completed_messages:\n                self.state.events.push(\"quest_completed\", msg)\n        else:\n            self.state.events.push(\"hazard_triggered\", \"Donut: Carl, I do not like that tile.\", hazard=hazard.hazard_id)\n            completed_messages = self.state.quests.record_event(\"triggered_hazard\")\n            for msg in completed_messages:\n                self.state.events.push(\"quest_completed\", msg)\n","src/engine/combat.py":"class CombatSystem:\n    def __init__(self, state):\n        self.state = state\n\n    def attack(self, attacker_id, target_id, item_id=None):\n        attacker = self.state.world.entities[attacker_id]\n        target = self.state.world.entities[target_id]\n        if target.resources.health \u003c= 0:\n            return f\"{target.name} is already down.\"\n\n        weapon = self.state.items.get(item_id, {}) if item_id else {}\n        accuracy = weapon.get(\"accuracy\", 80) + attacker.stats.get(\"dexterity\", 0) * 2\n        roll = self.state.next_roll(100)\n        if roll > accuracy:\n            return f\"{attacker.name} misses {target.name}.\"\n\n        base_damage = weapon.get(\"damage\", 1 + attacker.stats.get(\"strength\", 1) // 2)\n        if item_id and \"consumable\" in weapon.get(\"tags\", []):\n            self.state.consume_item(attacker_id, item_id)\n        damage = max(0, base_damage - target.resources.armor)\n        target.resources.health = max(0, target.resources.health - damage)\n\n        self.state.events.push(\n            \"combat_hit\",\n            f\"{attacker.name} hits {target.name} for {damage} damage.\",\n            attacker=attacker_id,\n            target=target_id,\n            damage=damage,\n        )\n        if target.resources.health \u003c= 0:\n            self.state.events.push(\"entity_defeated\", f\"{target.name} is defeated.\", target=target_id)\n            completed_messages = self.state.quests.record_event(\"defeated_enemy\")\n            for msg in completed_messages:\n                self.state.events.push(\"quest_completed\", msg)\n            self.state.viewer.change(5, \"creative violence remains a marketable asset\")\n        return \"\"\n\n    def nearest_enemy(self, origin_id=\"carl\", distance=1):\n        origin = self.state.world.entities[origin_id]\n        living = [\n            enemy\n            for enemy in self.state.world.entities_by_type(\"monster\")\n            if enemy.resources.health > 0\n            and abs(origin.x - enemy.x) \u003c= distance\n            and abs(origin.y - enemy.y) \u003c= distance\n        ]\n        return living[0] if living else None\n\n    def enemy_turns(self):\n        for enemy in self.state.world.entities_by_type(\"monster\"):\n            if enemy.resources.health \u003c= 0:\n                continue\n            target = self._enemy_target(enemy)\n            if not target:\n                continue\n            damage = max(0, 2 - target.resources.armor)\n            target.resources.health = max(0, target.resources.health - damage)\n            self.state.events.push(\n                \"enemy_attack\",\n                f\"{enemy.name} claws {target.name} for {damage} damage.\",\n                attacker=enemy.entity_id,\n                target=target.entity_id,\n                damage=damage,\n            )\n            if target.resources.health \u003c= 0:\n                self.state.events.push(\"party_member_down\", f\"{target.name} goes down.\", target=target.entity_id)\n\n    def donut_support(self):\n        donut = self.state.world.donut\n        if donut.resources.health \u003c= 0:\n            return\n        enemy = self.nearest_enemy(\"donut\", distance=2)\n        if not enemy:\n            return\n        if donut.state.get(\"mode\") == \"hide\":\n            self.state.events.push(\"companion_action\", \"Donut stays hidden and complains silently, which is frankly impressive.\")\n            return\n        damage = 1\n        enemy.resources.health = max(0, enemy.resources.health - damage)\n        self.state.events.push(\"companion_action\", f\"Donut swipes at {enemy.name} for {damage} damage.\", target=enemy.entity_id)\n        if enemy.resources.health \u003c= 0:\n            self.state.events.push(\"entity_defeated\", f\"{enemy.name} is defeated.\", target=enemy.entity_id)\n            completed_messages = self.state.quests.record_event(\"defeated_enemy\")\n            for msg in completed_messages:\n                self.state.events.push(\"quest_completed\", msg)\n            self.state.viewer.change(8, \"Donut did something adorable and violent\")\n\n    def _enemy_target(self, enemy):\n        targets = [self.state.world.carl, self.state.world.donut]\n        adjacent = [\n            target\n            for target in targets\n            if target.resources.health > 0\n            and abs(enemy.x - target.x) \u003c= 1\n            and abs(enemy.y - target.y) \u003c= 1\n        ]\n        if not adjacent:\n            return None\n        return min(adjacent, key=lambda entity: entity.resources.health)\n","src/engine/events.py":"from dataclasses import dataclass, field\nfrom typing import Any\n\n\n@dataclass\nclass GameEvent:\n    event_type: str\n    message: str = \"\"\n    data: dict[str, Any] = field(default_factory=dict)\n\n\nclass EventQueue:\n    def __init__(self):\n        self._events: list[GameEvent] = []\n\n    def push(self, event_type, message=\"\", **data):\n        event = GameEvent(event_type=event_type, message=message, data=data)\n        self._events.append(event)\n        return event\n\n    def drain(self):\n        events = self._events\n        self._events = []\n        return events\n\n    def peek_all(self):\n        return list(self._events)\n","src/engine/turns.py":"class TurnManager:\n    def __init__(self, state, action_processor):\n        self.state = state\n        self.action_processor = action_processor\n        self.turn_number = 0\n        self.quit_requested = False\n\n    def take_turn(self, action):\n        self.turn_number += 1\n        self.state.events.push(\"turn_started\", turn=self.turn_number)\n        self.quit_requested = self.action_processor.handle(action)\n        self.update_companions()\n        self.update_enemies()\n        self.update_environment()\n        self.state.events.push(\"turn_finished\", turn=self.turn_number)\n        return self.quit_requested\n\n    def update_companions(self):\n        donut = self.state.world.entities.get(\"donut\")\n        if not donut:\n            return\n        if donut.state.get(\"mode\") == \"follow\":\n            self.state.events.push(\"companion_updated\", companion=\"donut\", mode=\"follow\")\n        self.action_processor.combat.donut_support()\n\n    def update_enemies(self):\n        self.action_processor.combat.enemy_turns()\n        for enemy in self.state.world.entities_by_type(\"monster\"):\n            if enemy.resources.health > 0:\n                self.state.events.push(\"enemy_updated\", enemy=enemy.entity_id)\n\n    def update_environment(self):\n        self.state.floor_timer -= 1\n        if self.state.floor_timer in {30, 10, 5}:\n            self.state.events.push(\"timer_warning\", f\"System timer warning: {self.state.floor_timer} turns remain.\")\n        if self.state.floor_timer \u003c= 0:\n            self.state.events.push(\"floor_collapsed\", \"The floor timer hit zero. This run is over.\")\n            self.quit_requested = True\n        if self.state.viewer.sponsor_ready():\n            self.state.events.push(\"sponsor_ready\", self.state.announcements.emit(\"sponsor_ready\"))\n            self.state.viewer.popularity = 0\n","src/engine/validation.py":"class DataValidationError(ValueError):\n    pass\n\n\nclass DataValidator:\n    REQUIRED_CHARACTER_FIELDS = {\n        \"name\": str,\n        \"symbol\": str,\n        \"position\": dict,\n        \"level\": int,\n        \"role\": str,\n        \"entity_type\": str,\n        \"stats\": dict,\n    }\n    REQUIRED_ITEM_FIELDS = {\n        \"name\": str,\n        \"slot\": str,\n        \"tags\": list,\n        \"description\": str,\n    }\n    REQUIRED_ANNOUNCEMENT_FIELDS = {\"text\": str}\n    REQUIRED_QUEST_FIELDS = {\n        \"id\": str,\n        \"title\": str,\n        \"description\": str,\n        \"objectives\": list,\n    }\n    REQUIRED_RECIPE_FIELDS = {\n        \"id\": str,\n        \"ingredients\": list,\n        \"result\": str,\n    }\n    REQUIRED_OBJECT_FIELDS = {\n        \"id\": str,\n        \"name\": str,\n        \"symbol\": str,\n        \"position\": dict,\n        \"object_type\": str,\n        \"blocks_movement\": bool,\n    }\n    REQUIRED_HAZARD_FIELDS = {\n        \"id\": str,\n        \"name\": str,\n        \"symbol\": str,\n        \"position\": dict,\n        \"effect\": str,\n    }\n\n    def validate_all(self, data):\n        self.validate_characters(data[\"characters\"])\n        self.validate_items(data[\"items\"])\n        self.validate_announcements(data[\"announcements\"])\n        self.validate_dialogue(data[\"dialogue\"])\n        self.validate_quests(data[\"quests\"])\n        self.validate_recipes(data[\"recipes\"], data[\"items\"])\n        self.validate_objects(data[\"objects\"])\n        self.validate_hazards(data[\"hazards\"])\n        self.validate_map(data[\"map_rows\"])\n\n    def validate_characters(self, characters):\n        for entity_id, character in characters.items():\n            self._require(character, self.REQUIRED_CHARACTER_FIELDS, f\"characters.{entity_id}\")\n            self._require_position(character[\"position\"], f\"characters.{entity_id}.position\")\n            self._require_resource_block(character, f\"characters.{entity_id}\")\n\n    def validate_items(self, items):\n        for item_id, item in items.items():\n            self._require(item, self.REQUIRED_ITEM_FIELDS, f\"items.{item_id}\")\n\n    def validate_announcements(self, announcements):\n        for announcement_id, announcement in announcements.items():\n            self._require(announcement, self.REQUIRED_ANNOUNCEMENT_FIELDS, f\"announcements.{announcement_id}\")\n\n    def validate_dialogue(self, dialogue):\n        for speaker_id, lines in dialogue.items():\n            if not isinstance(lines, list) or not lines:\n                raise DataValidationError(f\"dialogue.{speaker_id} must be a non-empty list\")\n            for index, line in enumerate(lines):\n                self._require(line, {\"text\": str}, f\"dialogue.{speaker_id}[{index}]\")\n\n    def validate_quests(self, quests):\n        ids = set()\n        for index, quest in enumerate(quests):\n            self._require(quest, self.REQUIRED_QUEST_FIELDS, f\"quests[{index}]\")\n            if quest[\"id\"] in ids:\n                raise DataValidationError(f\"Duplicate quest id: {quest['id']}\")\n            ids.add(quest[\"id\"])\n            for obj_index, objective in enumerate(quest[\"objectives\"]):\n                self._require(\n                    objective,\n                    {\"id\": str, \"description\": str, \"target\": int, \"event_type\": str},\n                    f\"quests[{index}].objectives[{obj_index}]\",\n                )\n\n    def validate_recipes(self, recipes, items):\n        for recipe_id, recipe in recipes.items():\n            self._require(recipe, self.REQUIRED_RECIPE_FIELDS, f\"recipes.{recipe_id}\")\n            for item_id in recipe[\"ingredients\"] + [recipe[\"result\"]]:\n                if item_id not in items:\n                    raise DataValidationError(f\"recipes.{recipe_id} references unknown item: {item_id}\")\n\n    def validate_objects(self, objects):\n        for object_id, obj in objects.items():\n            self._require(obj, self.REQUIRED_OBJECT_FIELDS, f\"objects.{object_id}\")\n            self._require_position(obj[\"position\"], f\"objects.{object_id}.position\")\n\n    def validate_hazards(self, hazards):\n        for hazard_id, hazard in hazards.items():\n            self._require(hazard, self.REQUIRED_HAZARD_FIELDS, f\"hazards.{hazard_id}\")\n            self._require_position(hazard[\"position\"], f\"hazards.{hazard_id}.position\")\n\n    def validate_map(self, map_rows):\n        if not map_rows:\n            raise DataValidationError(\"Map cannot be empty\")\n        width = len(map_rows[0])\n        for index, row in enumerate(map_rows):\n            if len(row) != width:\n                raise DataValidationError(f\"Map row {index} has inconsistent width\")\n\n    def _require(self, data, schema, path):\n        for field, expected_type in schema.items():\n            if field not in data:\n                raise DataValidationError(f\"{path} missing required field: {field}\")\n            if not isinstance(data[field], expected_type):\n                raise DataValidationError(\n                    f\"{path}.{field} must be {expected_type.__name__}, got {type(data[field]).__name__}\"\n                )\n\n    def _require_position(self, position, path):\n        self._require(position, {\"x\": int, \"y\": int}, path)\n\n    def _require_resource_block(self, character, path):\n        resources = character.get(\"resources\")\n        if not isinstance(resources, dict):\n            raise DataValidationError(f\"{path}.resources must be an object\")\n        self._require(resources, {\"health\": int, \"max_health\": int, \"stamina\": int, \"max_stamina\": int, \"armor\": int}, f\"{path}.resources\")\n","src/entity.py":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Resources:\n    health: int\n    max_health: int\n    stamina: int\n    max_stamina: int\n    armor: int\n\n    @classmethod\n    def from_data(cls, data):\n        return cls(\n            health=data[\"health\"],\n            max_health=data[\"max_health\"],\n            stamina=data[\"stamina\"],\n            max_stamina=data[\"max_stamina\"],\n            armor=data[\"armor\"],\n        )\n\n\n@dataclass\nclass Entity:\n    entity_id: str\n    name: str\n    symbol: str\n    x: int\n    y: int\n    level: int\n    role: str\n    entity_type: str\n    resources: Resources\n    tags: list[str] = field(default_factory=list)\n    stats: dict[str, int] = field(default_factory=dict)\n    inventory: list[str] = field(default_factory=list)\n    equipment: dict[str, str] = field(default_factory=dict)\n    debuffs: list[str] = field(default_factory=list)\n    buffs: list[str] = field(default_factory=list)\n    status_effects: list[str] = field(default_factory=list)\n    state: dict = field(default_factory=dict)\n\n    @classmethod\n    def from_data(cls, entity_id, data):\n        return cls(\n            entity_id=entity_id,\n            name=data[\"name\"],\n            symbol=data[\"symbol\"],\n            x=data[\"position\"][\"x\"],\n            y=data[\"position\"][\"y\"],\n            level=data[\"level\"],\n            role=data[\"role\"],\n            entity_type=data[\"entity_type\"],\n            resources=Resources.from_data(data[\"resources\"]),\n            tags=data.get(\"tags\", []),\n            stats=data.get(\"stats\", {}),\n            inventory=data.get(\"inventory\", []),\n            equipment=data.get(\"equipment\", {}),\n            debuffs=data.get(\"debuffs\", []),\n            buffs=data.get(\"buffs\", []),\n            status_effects=data.get(\"status_effects\", []),\n            state=data.get(\"state\", {}),\n        )\n\n\n@dataclass\nclass WorldObject:\n    object_id: str\n    name: str\n    symbol: str\n    x: int\n    y: int\n    object_type: str\n    blocks_movement: bool\n    state: dict = field(default_factory=dict)\n    shop_inventory: list[str] = field(default_factory=list)\n\n    @classmethod\n    def from_data(cls, object_id, data):\n        return cls(\n            object_id=object_id,\n            name=data[\"name\"],\n            symbol=data[\"symbol\"],\n            x=data[\"position\"][\"x\"],\n            y=data[\"position\"][\"y\"],\n            object_type=data[\"object_type\"],\n            blocks_movement=data[\"blocks_movement\"],\n            state=data.get(\"state\", {}),\n            shop_inventory=data.get(\"shop_inventory\", []),\n        )\n\n\n@dataclass\nclass Hazard:\n    hazard_id: str\n    name: str\n    symbol: str\n    x: int\n    y: int\n    effect: str\n    severity: int = 0\n    tags: list[str] = field(default_factory=list)\n\n    @classmethod\n    def from_data(cls, hazard_id, data):\n        return cls(\n            hazard_id=hazard_id,\n            name=data[\"name\"],\n            symbol=data[\"symbol\"],\n            x=data[\"position\"][\"x\"],\n            y=data[\"position\"][\"y\"],\n            effect=data[\"effect\"],\n            severity=data.get(\"severity\", 0),\n            tags=data.get(\"tags\", []),\n        )\n","src/game.py":"from src.announcements import AnnouncementManager\nfrom src.data_repository import DataRepository\nfrom src.engine.actions import ActionProcessor\nfrom src.engine.events import EventQueue\nfrom src.engine.turns import TurnManager\nfrom src.game_state import GameState\nfrom src.quests import QuestLog\nfrom src.ui.terminal import TerminalUI\nfrom src.world import GameWorld\n\n\nclass Game:\n    def __init__(self, data_repository=None, ui=None):\n        self.data = (data_repository or DataRepository()).load()\n        self.events = EventQueue()\n        self.world = GameWorld(\n            self.data.map_rows,\n            self.data.characters,\n            objects=self.data.objects,\n            hazards=self.data.hazards,\n        )\n        self.announcements = AnnouncementManager(self.data.announcements)\n        self.quests = QuestLog(self.data.quests)\n        self.state = GameState(\n            data=self.data,\n            world=self.world,\n            announcements=self.announcements,\n            quests=self.quests,\n            events=self.events,\n        )\n        self.action_processor = ActionProcessor(self.state)\n        self.turns = TurnManager(self.state, self.action_processor)\n        self.ui = ui or TerminalUI()\n        self.last_message = self.announcements.emit(\"welcome\", crawler=self.world.carl.name)\n\n    def run(self):\n        while True:\n            self.display()\n            action = input(\"\\nAction: \")\n            quit_requested = self.handle_action(action)\n            if quit_requested:\n                self.display()\n                break\n\n    def display(self):\n        self.ui.render(self.state, self.last_message)\n\n    def handle_action(self, action):\n        quit_requested = self.turns.take_turn(action)\n        self.last_message = self.collect_messages()\n        return quit_requested\n\n    def collect_messages(self):\n        messages = []\n        drained = self.events.drain()\n        # store last drained events for UI use\n        self.state.last_events = drained\n        for event in drained:\n            if event.message:\n                messages.append(event.message)\n        return \"\\n\".join(messages)\n\n    # Compatibility wrappers for existing tests and quick scripts.\n    def talk(self):\n        self.handle_action(\"t\")\n\n    def open_nearby(self):\n        self.handle_action(\"o\")\n\n    def show_inventory(self):\n        self.handle_action(\"i\")\n\n    def craft(self):\n        self.handle_action(\"c\")\n\n    def escalating_donut_complaint(self):\n        return self.state.escalating_donut_complaint()\n","src/game_state.py":"from src.viewer import ViewerState\nimport copy\n\n\nclass GameState:\n    def __init__(self, data, world, announcements, quests, events):\n        self.data = data\n        self.world = world\n        self.items = data.items\n        self.dialogue = data.dialogue\n        self.announcements = announcements\n        self.quests = quests\n        self.events = events\n        self.dialogue_index = {\"mordecai\": 0}\n        self.floor_timer = 100\n        self.viewer = ViewerState()\n        self.checkpoint = None\n        self.rolls = []\n\n    def next_roll(self, sides):\n        if self.rolls:\n            return self.rolls.pop(0)\n        return 50 if sides >= 50 else 1\n\n    def inventory_lines(self, entity_id):\n        entity = self.world.entities[entity_id]\n        counts = {}\n        for item_id in entity.inventory:\n            counts[item_id] = counts.get(item_id, 0) + 1\n        lines = []\n        for item_id, count in counts.items():\n            item = self.items[item_id]\n            bits = []\n            if \"armor\" in item:\n                bits.append(f\"armor {item['armor']}\")\n            if \"durability\" in item:\n                bits.append(f\"durability {item['durability']}\")\n            if \"crafting_power\" in item:\n                bits.append(f\"crafting power {item['crafting_power']}\")\n            if \"damage\" in item:\n                bits.append(f\"damage {item['damage']}\")\n            if item_id in entity.equipment.values():\n                bits.append(\"equipped\")\n            qty = f\" x{count}\" if count > 1 else \"\"\n            lines.append(f\"{item['name']}{qty}: {', '.join(bits) or 'utility item'}\")\n        return lines\n\n    def consume_item(self, entity_id, item_id):\n        inventory = self.world.entities[entity_id].inventory\n        if item_id in inventory:\n            inventory.remove(item_id)\n            return True\n        return False\n\n    def make_checkpoint(self):\n        self.checkpoint = {\n            \"entities\": copy.deepcopy(self.world.entities),\n            \"objects\": copy.deepcopy(self.world.objects),\n            \"quests\": copy.deepcopy(self.quests.quests),\n            \"floor_timer\": self.floor_timer,\n            \"viewer\": copy.deepcopy(self.viewer),\n        }\n\n    def restore_checkpoint(self):\n        if not self.checkpoint:\n            self.events.push(\"checkpoint_missing\", \"No checkpoint exists yet.\")\n            return False\n        self.world.entities = copy.deepcopy(self.checkpoint[\"entities\"])\n        self.world.objects = copy.deepcopy(self.checkpoint[\"objects\"])\n        self.quests.quests = copy.deepcopy(self.checkpoint[\"quests\"])\n        self.floor_timer = self.checkpoint[\"floor_timer\"]\n        self.viewer = copy.deepcopy(self.checkpoint[\"viewer\"])\n        return True\n\n    def find_available_recipe(self, entity_id):\n        inventory = self.world.entities[entity_id].inventory\n        inventory_counts = {item_id: inventory.count(item_id) for item_id in set(inventory)}\n        for recipe in self.data.recipes.values():\n            if all(inventory_counts.get(item_id, 0) >= recipe[\"ingredients\"].count(item_id) for item_id in set(recipe[\"ingredients\"])):\n                return recipe\n        return None\n\n    def equip_first_available(self, entity_id):\n        entity = self.world.entities[entity_id]\n        equipped_items = set(entity.equipment.values())\n        for item_id in entity.inventory:\n            if item_id in equipped_items:\n                continue\n            item = self.items[item_id]\n            slot = item.get(\"slot\")\n            if slot in {\"torso\", \"legs\", \"weapon\"}:\n                previous = entity.equipment.get(slot)\n                entity.equipment[slot] = item_id\n                self.recalculate_armor(entity_id)\n                return f\"Equipped {item['name']}.\"\n        return \"No equippable item available.\"\n\n    def recalculate_armor(self, entity_id):\n        entity = self.world.entities[entity_id]\n        armor = 0\n        for item_id in entity.equipment.values():\n            armor += self.items.get(item_id, {}).get(\"armor\", 0)\n        entity.resources.armor = armor\n\n    def escalating_donut_complaint(self):\n        steps = [\n            \"Donut: Carl, this floor is unspeakably filthy.\",\n            \"Donut: I can feel the grime between my toes. This is a hate crime against grooming.\",\n            \"Donut: My fans must never see me like this. Walk softer.\",\n        ]\n        index = min(self.dialogue_index[\"mordecai\"], len(steps) - 1)\n        return steps[index]\n","src/project_plan.py":"\"\"\"Project scope and roadmap definitions for Dungeon Crawler Carl.\"\"\"\n\nPROJECT_PATH = \"fan/internal prototype\"\n\nCANON_REFERENCE_POLICY = {\n    \"allowed\": [\n        \"high-level book themes\",\n        \"game systems inspired by the books\",\n        \"character roles and relationships\",\n        \"dungeon structure and floor rules\",\n        \"viewer/sponsor pressure mechanics\",\n    ],\n    \"replaced\": [\n        \"exact book dialogue and prose\",\n        \"copyrighted names, titles, and branding unless licensed\",\n        \"protected plot text and dialogue beats\",\n        \"official audiobook performance or quotations\",\n        \"any trademarked or branded elements\",\n    ],\n}\n\nTARGET_RELEASE = {\n    \"name\": \"vertical slice\",\n    \"scope\": [\n        \"opening survival and registration sequence\",\n        \"Floor 1 tutorial guild segment\",\n        \"Floor 2 escalation and training floor\",\n        \"early hub transformation or first major transition\",\n    ],\n    \"success_criteria\": [\n        \"player can move, interact, and navigate a first floor\",\n        \"companion behavior and proximity dialogue are present\",\n        \"basic quest flow completes through tutorial objectives\",\n        \"inventory, opening actions, and simple item feedback work\",\n        \"system announcements and show-style flavor are active\",\n        \"the first playable build feels like a coherent dungeon crawl\",\n    ],\n}\n\nROADMAP_PHASES = [\n    {\n        \"phase\": \"Phase 1\",\n        \"goal\": \"Systems prototype\",\n        \"description\": \"Validate core mechanics in a data-driven Python prototype; keep text and map rendering simple.\"\n    },\n    {\n        \"phase\": \"Phase 2\",\n        \"goal\": \"Polished 2D release\",\n        \"description\": \"Move to a visual tile-based interface, improve UX, add more floors, and polish content.\"\n    },\n    {\n        \"phase\": \"Phase 3\",\n        \"goal\": \"Expanded content or 3D conversion\",\n        \"description\": \"Add larger dungeon scope, advanced companion systems, and consider a 3D or more cinematic presentation.\"\n    }\n]\n\nPLATFORM_ENGINE_DECISION = {\n    \"platform\": \"PC-first\",\n    \"prototype_engine\": \"Python text prototype for fast iteration\",\n    \"target_engine\": \"Godot for 2D/top-down tile-based release\",\n    \"alternative_engine\": \"Unity if the team chooses a commercial asset pipeline or stronger cross-platform support\",\n    \"rationale\": [\n        \"PC-first keeps development focused and avoids early console overhead\",\n        \"Python prototype lets the team lock down rules before committing to art/engine work\",\n        \"Godot is a strong fit for 2D grid/isometric tactics and rapid iteration\",\n        \"Unity is viable later for larger scope, but it adds overhead earlier\",\n    ],\n}\n\n\ndef get_project_plan():\n    return {\n        \"project_path\": PROJECT_PATH,\n        \"canon_reference_policy\": CANON_REFERENCE_POLICY,\n        \"target_release\": TARGET_RELEASE,\n        \"roadmap_phases\": ROADMAP_PHASES,\n        \"platform_engine_decision\": PLATFORM_ENGINE_DECISION,\n    }\n","src/quests.py":"class QuestLog:\n    def __init__(self, quest_data):\n        self.quests = {\n            quest[\"id\"]: {\n                **quest,\n                \"completed\": False,\n                \"objectives\": [\n                    {\n                        **objective,\n                        \"current\": 0,\n                        \"completed\": False,\n                    }\n                    for objective in quest.get(\"objectives\", [])\n                ],\n            }\n            for quest in quest_data\n        }\n\n    def complete(self, quest_id):\n        quest = self.quests.get(quest_id)\n        if not quest or quest[\"completed\"]:\n            return \"\"\n        quest[\"completed\"] = True\n        for objective in quest[\"objectives\"]:\n            objective[\"completed\"] = True\n            objective[\"current\"] = objective[\"target\"]\n        return f\"Quest complete: {quest['title']}\"\n\n    def record_event(self, event_type, amount=1):\n        completed = []\n        for quest_id, quest in self.quests.items():\n            if quest[\"completed\"]:\n                continue\n            for objective in quest[\"objectives\"]:\n                if objective[\"completed\"] or objective[\"event_type\"] != event_type:\n                    continue\n                objective[\"current\"] = min(objective[\"target\"], objective[\"current\"] + amount)\n                if objective[\"current\"] >= objective[\"target\"]:\n                    objective[\"completed\"] = True\n            if quest[\"objectives\"] and all(objective[\"completed\"] for objective in quest[\"objectives\"]):\n                quest[\"completed\"] = True\n                completed.append(f\"Quest complete: {quest['title']}\")\n        return completed\n\n    def active_lines(self):\n        lines = []\n        for quest in self.quests.values():\n            marker = \"done\" if quest[\"completed\"] else \"open\"\n            objective_text = \", \".join(\n                f\"{objective['current']}/{objective['target']}\" for objective in quest[\"objectives\"]\n            )\n            suffix = f\" ({objective_text})\" if objective_text else \"\"\n            lines.append(f\"[{marker}] {quest['title']} - {quest['description']}{suffix}\")\n        return lines\n","src/save_system.py":"import json\nfrom pathlib import Path\n\n\nSAVE_PATH = Path(__file__).resolve().parents[1] / \"savegame.json\"\n\n\ndef save_game(world, quest_log, state=None):\n    data = {\n        \"entities\": {\n            entity_id: {\n                \"x\": entity.x,\n                \"y\": entity.y,\n                \"inventory\": entity.inventory,\n                \"equipment\": entity.equipment,\n                \"debuffs\": entity.debuffs,\n                \"buffs\": entity.buffs,\n                \"status_effects\": entity.status_effects,\n                \"level\": entity.level,\n                \"resources\": entity.resources.__dict__,\n                \"state\": entity.state,\n            }\n            for entity_id, entity in world.entities.items()\n        },\n        \"objects\": {\n            object_id: {\n                \"state\": obj.state,\n                \"symbol\": obj.symbol,\n                \"blocks_movement\": obj.blocks_movement,\n            }\n            for object_id, obj in world.objects.items()\n        },\n        \"quests\": {\n            quest_id: {\n                \"completed\": quest[\"completed\"],\n                \"objectives\": [\n                    {\n                        \"id\": objective[\"id\"],\n                        \"current\": objective[\"current\"],\n                        \"completed\": objective[\"completed\"],\n                    }\n                    for objective in quest[\"objectives\"]\n                ],\n            }\n            for quest_id, quest in quest_log.quests.items()\n        },\n        \"floor_timer\": state.floor_timer if state else None,\n        \"viewer\": state.viewer.__dict__ if state else None,\n    }\n    with SAVE_PATH.open(\"w\", encoding=\"utf-8\") as handle:\n        json.dump(data, handle, indent=2)\n    return SAVE_PATH\n\n\ndef load_game(world, quest_log, state=None):\n    if not SAVE_PATH.exists():\n        return False\n    with SAVE_PATH.open(\"r\", encoding=\"utf-8\") as handle:\n        data = json.load(handle)\n\n    for entity_id, values in data.get(\"entities\", {}).items():\n        entity = world.entities.get(entity_id)\n        if not entity:\n            continue\n        entity.x = values[\"x\"]\n        entity.y = values[\"y\"]\n        entity.inventory = values.get(\"inventory\", entity.inventory)\n        entity.equipment = values.get(\"equipment\", entity.equipment)\n        entity.debuffs = values.get(\"debuffs\", entity.debuffs)\n        entity.buffs = values.get(\"buffs\", entity.buffs)\n        entity.status_effects = values.get(\"status_effects\", entity.status_effects)\n        entity.level = values.get(\"level\", entity.level)\n        for resource_name, resource_value in values.get(\"resources\", {}).items():\n            if hasattr(entity.resources, resource_name):\n                setattr(entity.resources, resource_name, resource_value)\n        entity.state = values.get(\"state\", entity.state)\n\n    for object_id, values in data.get(\"objects\", {}).items():\n        obj = world.objects.get(object_id)\n        if not obj:\n            continue\n        obj.state = values.get(\"state\", obj.state)\n        obj.symbol = values.get(\"symbol\", obj.symbol)\n        obj.blocks_movement = values.get(\"blocks_movement\", obj.blocks_movement)\n    for quest_id, values in data.get(\"quests\", {}).items():\n        if quest_id in quest_log.quests:\n            quest_log.quests[quest_id][\"completed\"] = values.get(\"completed\", False)\n            by_id = {objective[\"id\"]: objective for objective in quest_log.quests[quest_id][\"objectives\"]}\n            for saved_objective in values.get(\"objectives\", []):\n                objective = by_id.get(saved_objective[\"id\"])\n                if objective:\n                    objective[\"current\"] = saved_objective.get(\"current\", objective[\"current\"])\n                    objective[\"completed\"] = saved_objective.get(\"completed\", objective[\"completed\"])\n    if state:\n        if data.get(\"floor_timer\") is not None:\n            state.floor_timer = data[\"floor_timer\"]\n        if data.get(\"viewer\"):\n            for key, value in data[\"viewer\"].items():\n                if hasattr(state.viewer, key):\n                    setattr(state.viewer, key, value)\n    return True\n","src/ui/__init__.py":"\n","src/ui/terminal.py":"import os\n\n\nclass TerminalUI:\n    CONTROLS = \"Controls: W/A/S/D move | X attack | U use | T talk | O open | I inventory | C craft | E equip | P pickup | B buy | F/H/R Donut | V/L/K save/load/checkpoint | Q quit\"\n\n    def clear(self):\n        os.system(\"cls\" if os.name == \"nt\" else \"clear\")\n\n    def render(self, state, last_message=\"\"):\n        self.clear()\n        print(\"=== DUNGEON CRAWLER CARL: TUTORIAL GUILD ===\")\n        print(self.CONTROLS + \"\\n\")\n        print(state.world.render())\n        print(\"\\n\" + \"=\" * 62)\n        self.print_status(state)\n        print(\"=\" * 62)\n        # Show any overlay-style events (inventory, transition, game over)\n        last_events = getattr(state, 'last_events', []) or []\n        for ev in last_events:\n            if ev.event_type == 'inventory_viewed':\n                print('\\n=== INVENTORY ===')\n                print(ev.message)\n                print('=== END INVENTORY ===\\n')\n            if ev.event_type == 'transition':\n                print(f\"\\n=== TRANSITION ===\\n{ev.message}\\n=== END TRANSITION ===\\n\")\n            if ev.event_type == 'game_over':\n                print(f\"\\n*** GAME OVER ***\\n{ev.message}\\n\")\n\n        if last_message:\n            print(last_message)\n\n    def print_status(self, state):\n        carl = state.world.carl\n        donut = state.world.donut\n        jacket = state.items[carl.inventory[0]][\"name\"] if carl.inventory else \"None\"\n        pants = '[NO PANTS]' if 'no_pants' in getattr(carl, 'debuffs', []) else ''\n        print(\n            f\"Carl | Level {carl.level} | HP {carl.resources.health}/{carl.resources.max_health} \"\n            f\"| Armor {carl.resources.armor} | Gear: {jacket} | Debuffs: {', '.join(carl.debuffs)} {pants}\"\n        )\n        print(\n            f\"Donut | Level {donut.level} | HP {donut.resources.health}/{donut.resources.max_health} \"\n            f\"| Title: Grand Champion | Mode: {donut.state.get('mode', 'follow')}\"\n        )\n        print(f\"Timer: {state.floor_timer} turns\")\n        print(\n            f\"Viewer pressure: party {state.viewer.popularity} | Carl {state.viewer.carl_popularity} \"\n            f\"| Donut {state.viewer.donut_popularity}\"\n        )\n        enemies = [enemy for enemy in state.world.entities_by_type(\"monster\") if enemy.resources.health > 0]\n        if enemies:\n            print(\"Enemies: \" + \" | \".join(f\"{enemy.name} HP {enemy.resources.health}/{enemy.resources.max_health}\" for enemy in enemies))\n        statuses = []\n        if carl.buffs:\n            statuses.append(\"Buffs: \" + \", \".join(carl.buffs))\n        if carl.status_effects:\n            statuses.append(\"Statuses: \" + \", \".join(carl.status_effects))\n        if statuses:\n            print(\" | \".join(statuses))\n        print(\"Quests: \" + \" | \".join(state.quests.active_lines()))\n","src/viewer.py":"class ViewerState:\n    def __init__(self):\n        self.popularity = 0\n        self.carl_popularity = 0\n        self.donut_popularity = 4\n        self.timeline = []\n        self.poll_active = False\n\n    def change(self, amount, reason, target=\"party\"):\n        self.popularity = max(0, self.popularity + amount)\n        if target == \"donut\":\n            self.donut_popularity = max(0, self.donut_popularity + amount)\n        elif target == \"carl\":\n            self.carl_popularity = max(0, self.carl_popularity + amount)\n        self.timeline.append(f\"{amount:+} popularity: {reason}\")\n\n    def sponsor_ready(self):\n        return self.popularity >= 10\n","src/world.py":"from src.entity import Entity, Hazard, WorldObject\n\n\nBLOCKED_TILES = {\"#\", \"=\"}\nTERRAIN_EFFECTS = {\n    \"~\": \"filth\",\n    \"!\": \"trap\",\n    \"^\": \"rough\",\n}\n\n\nclass GameWorld:\n    def __init__(self, map_rows, characters, objects=None, hazards=None):\n        self.grid = [list(row) for row in map_rows]\n        self.height = len(self.grid)\n        self.width = len(self.grid[0])\n        self.entities = {\n            entity_id: Entity.from_data(entity_id, data)\n            for entity_id, data in characters.items()\n        }\n        self.objects = {\n            object_id: WorldObject.from_data(object_id, data)\n            for object_id, data in (objects or {}).items()\n        }\n        self.hazards = {\n            hazard_id: Hazard.from_data(hazard_id, data)\n            for hazard_id, data in (hazards or {}).items()\n        }\n\n    @property\n    def carl(self):\n        return self.entities[\"carl\"]\n\n    @property\n    def donut(self):\n        return self.entities[\"donut\"]\n\n    @property\n    def mordecai(self):\n        return self.entities[\"mordecai\"]\n\n    def tile_at(self, x, y):\n        if y \u003c 0 or y >= self.height or x \u003c 0 or x >= self.width:\n            return \"#\"\n        return self.grid[y][x]\n\n    def is_blocked(self, x, y, ignore_entities=None):\n        ignore_entities = set(ignore_entities or [])\n        if self.tile_at(x, y) in BLOCKED_TILES:\n            return True\n        if any(obj.x == x and obj.y == y and obj.blocks_movement for obj in self.objects.values()):\n            return True\n        return any(\n            entity.x == x\n            and entity.y == y\n            and entity.entity_id not in ignore_entities\n            and entity.resources.health > 0\n            for entity in self.entities.values()\n        )\n\n    def move_entity(self, entity_id, dx, dy):\n        entity = self.entities[entity_id]\n        new_x = entity.x + dx\n        new_y = entity.y + dy\n        if self.is_blocked(new_x, new_y, ignore_entities={entity_id}):\n            return False\n\n        entity.state[\"previous_position\"] = {\"x\": entity.x, \"y\": entity.y}\n        entity.x = new_x\n        entity.y = new_y\n        return True\n\n    def move_carl(self, dx, dy):\n        old_x, old_y = self.carl.x, self.carl.y\n        moved = self.move_entity(\"carl\", dx, dy)\n        if moved:\n            self.donut.x = old_x\n            self.donut.y = old_y\n        return moved\n\n    def follow_entity(self, follower_id, leader_id):\n        follower = self.entities[follower_id]\n        leader = self.entities[leader_id]\n        previous = leader.state.get(\"previous_position\")\n        if not previous:\n            return False\n        if self.is_blocked(previous[\"x\"], previous[\"y\"], ignore_entities={follower_id, leader_id}):\n            return self.step_toward(follower_id, leader.x, leader.y)\n        follower.x = previous[\"x\"]\n        follower.y = previous[\"y\"]\n        return True\n\n    def step_toward(self, entity_id, target_x, target_y):\n        entity = self.entities[entity_id]\n        options = []\n        if target_x != entity.x:\n            options.append((1 if target_x > entity.x else -1, 0))\n        if target_y != entity.y:\n            options.append((0, 1 if target_y > entity.y else -1))\n        options.extend([(0, -1), (1, 0), (0, 1), (-1, 0)])\n        for dx, dy in options:\n            new_x = entity.x + dx\n            new_y = entity.y + dy\n            if not self.is_blocked(new_x, new_y, ignore_entities={entity_id}):\n                entity.state[\"previous_position\"] = {\"x\": entity.x, \"y\": entity.y}\n                entity.x = new_x\n                entity.y = new_y\n                return True\n        return False\n\n    def near(self, entity_id, distance=1):\n        entity = self.entities[entity_id]\n        return abs(self.carl.x - entity.x) \u003c= distance and abs(self.carl.y - entity.y) \u003c= distance\n\n    def near_entity(self, entity_type=None, distance=1):\n        for entity in self.entities.values():\n            if entity.entity_id == \"carl\" or entity.resources.health \u003c= 0:\n                continue\n            if entity_type and entity.entity_type != entity_type:\n                continue\n            if abs(self.carl.x - entity.x) \u003c= distance and abs(self.carl.y - entity.y) \u003c= distance:\n                return entity\n        return None\n\n    def near_tile(self, tile, distance=1):\n        for y in range(max(0, self.carl.y - distance), min(self.height, self.carl.y + distance + 1)):\n            for x in range(max(0, self.carl.x - distance), min(self.width, self.carl.x + distance + 1)):\n                if self.grid[y][x] == tile:\n                    return x, y\n        return None\n\n    def near_object(self, object_type=None, distance=1):\n        for obj in self.objects.values():\n            if object_type and obj.object_type != object_type:\n                continue\n            if abs(self.carl.x - obj.x) \u003c= distance and abs(self.carl.y - obj.y) \u003c= distance:\n                return obj\n        return None\n\n    def object_at(self, x, y):\n        for obj in self.objects.values():\n            if obj.x == x and obj.y == y:\n                return obj\n        return None\n\n    def hazard_at(self, x, y):\n        for hazard in self.hazards.values():\n            if hazard.x == x and hazard.y == y:\n                return hazard\n        return None\n\n    def terrain_effect_at(self, x, y):\n        hazard = self.hazard_at(x, y)\n        if hazard:\n            return hazard.effect\n        return TERRAIN_EFFECTS.get(self.tile_at(x, y))\n\n    def living_enemies_near(self, entity_id, distance=1):\n        origin = self.entities[entity_id]\n        return [\n            enemy\n            for enemy in self.entities_by_type(\"monster\")\n            if enemy.resources.health > 0\n            and abs(origin.x - enemy.x) \u003c= distance\n            and abs(origin.y - enemy.y) \u003c= distance\n        ]\n\n    def entities_by_type(self, entity_type):\n        return [entity for entity in self.entities.values() if entity.entity_type == entity_type]\n\n    def replace_tile(self, x, y, tile):\n        self.grid[y][x] = tile\n\n    def render(self):\n        rows = []\n        for y in range(self.height):\n            chars = []\n            for x in range(self.width):\n                symbol = self.grid[y][x]\n                hazard = self.hazard_at(x, y)\n                if hazard:\n                    symbol = hazard.symbol\n                obj = self.object_at(x, y)\n                if obj:\n                    symbol = obj.symbol\n                for entity in self.entities.values():\n                    if entity.x == x and entity.y == y:\n                        symbol = entity.symbol\n                        break\n                chars.append(symbol)\n            rows.append(\" \".join(chars))\n        return \"\\n\".join(rows)\n"},"data":{"data/announcements.json":"{\n  \"welcome\": {\n    \"text\": \"Welcome, {crawler}. You have been registered while aggressively failing to wear complete clothing.\"\n  },\n  \"bump\": {\n    \"text\": \"Achievement progress: Wall Inspector. Reward pending, because even the wall is unimpressed.\"\n  },\n  \"quit\": {\n    \"text\": \"Run ended. The viewers have filed a complaint about the lack of screaming.\"\n  },\n  \"chest_opened\": {\n    \"text\": \"Loot event registered. Try not to treat this as proof you are good at decisions.\"\n  },\n  \"crafted_explosive\": {\n    \"text\": \"Crafting update: crude explosive assembled. The viewers have upgraded you from doomed to interesting.\"\n  },\n  \"sponsor_ready\": {\n    \"text\": \"Sponsor interest detected. Somewhere, someone with too much money enjoyed that.\"\n  },\n  \"floor_start\": {\n    \"text\": \"Floor event started. Try to look survivable.\"\n  },\n  \"dawn_bell\": {\n    \"text\": \"Dawn bell simulation complete. It is not morning. It is branding.\"\n  },\n  \"viewer_poll\": {\n    \"text\": \"Viewer poll opened: Will the crawler die stupidly or creatively?\"\n  }\n}\n","data/characters.json":"{\n  \"carl\": {\n    \"name\": \"Carl\",\n    \"symbol\": \"C\",\n    \"position\": { \"x\": 3, \"y\": 9 },\n    \"level\": 1,\n    \"role\": \"player\",\n    \"entity_type\": \"player\",\n    \"tags\": [\"crawler\", \"human\", \"classless\", \"improviser\"],\n    \"resources\": {\n      \"health\": 12,\n      \"max_health\": 12,\n      \"stamina\": 8,\n      \"max_stamina\": 8,\n      \"armor\": 1\n    },\n    \"stats\": {\n      \"strength\": 5,\n      \"dexterity\": 4,\n      \"constitution\": 6,\n      \"charisma\": 3,\n      \"explosives\": 1\n    },\n    \"inventory\": [\"leather_jacket\"],\n    \"equipment\": {\n      \"torso\": \"leather_jacket\"\n    },\n    \"debuffs\": [\"no_pants\"],\n    \"buffs\": [],\n    \"status_effects\": [],\n    \"state\": {}\n  },\n  \"donut\": {\n    \"name\": \"Princess Donut\",\n    \"symbol\": \"D\",\n    \"position\": { \"x\": 1, \"y\": 9 },\n    \"level\": 0,\n    \"role\": \"companion\",\n    \"entity_type\": \"companion\",\n    \"tags\": [\"civilian\", \"persian\", \"grand_champion\", \"cat\"],\n    \"resources\": {\n      \"health\": 5,\n      \"max_health\": 5,\n      \"stamina\": 10,\n      \"max_stamina\": 10,\n      \"armor\": 0\n    },\n    \"stats\": {\n      \"strength\": 1,\n      \"dexterity\": 7,\n      \"constitution\": 2,\n      \"charisma\": 9,\n      \"fame\": 4\n    },\n    \"inventory\": [],\n    \"equipment\": {},\n    \"debuffs\": [\"civilian\"],\n    \"buffs\": [\"viewer_appeal\"],\n    \"status_effects\": [],\n    \"state\": {\n      \"mode\": \"follow\"\n    }\n  },\n  \"mordecai\": {\n    \"name\": \"Mordecai\",\n    \"symbol\": \"M\",\n    \"position\": { \"x\": 6, \"y\": 4 },\n    \"level\": 1,\n    \"role\": \"guide\",\n    \"entity_type\": \"npc\",\n    \"tags\": [\"manager\", \"chupacabra_form\", \"stressed\"],\n    \"resources\": {\n      \"health\": 20,\n      \"max_health\": 20,\n      \"stamina\": 10,\n      \"max_stamina\": 10,\n      \"armor\": 0\n    },\n    \"stats\": {\n      \"stress\": 6,\n      \"patience\": 2,\n      \"knowledge\": 10\n    },\n    \"inventory\": [],\n    \"equipment\": {},\n    \"debuffs\": [],\n    \"buffs\": [],\n    \"status_effects\": [],\n    \"state\": {\n      \"dialogue_stress\": 6\n    }\n  },\n  \"bopca_clerk\": {\n    \"name\": \"Bopca Clerk\",\n    \"symbol\": \"B\",\n    \"position\": { \"x\": 9, \"y\": 6 },\n    \"level\": 1,\n    \"role\": \"shopkeeper\",\n    \"entity_type\": \"npc\",\n    \"tags\": [\"shopkeeper\", \"saferoom_economy\", \"placeholder\"],\n    \"resources\": {\n      \"health\": 10,\n      \"max_health\": 10,\n      \"stamina\": 6,\n      \"max_stamina\": 6,\n      \"armor\": 0\n    },\n    \"stats\": {\n      \"charisma\": 5,\n      \"patience\": 1\n    },\n    \"inventory\": [],\n    \"equipment\": {},\n <script type="text/python">
import sys, builtins, json, random, time, types
from browser import window

GAME = json.loads(window.JSON.stringify(window.GAME))
SOURCES = dict(GAME['sources'])
DATA = dict(GAME.get('data') or {})
import io

def data_key(path):
    p = str(path).replace('\\', '/')
    while p.startswith('./'):
        p = p[2:]
    if p in DATA:
        return p
    for k in DATA:
        if k.endswith('/' + p) or p.endswith('/' + k):
            return k
    return None

class SavedFile(io.StringIO):
    def __init__(self, key, text=''):
        super().__init__(text)
        self.key = key
    def close(self):
        DATA[self.key] = self.getvalue()
        super().close()
    def __exit__(self, *a):
        self.close()

_real_open = builtins.open
def town_open(path, mode='r', *a, **k):
    # Game data files are packed into the page; writes (saves) live for this session.
    key = data_key(path)
    if 'w' in mode or 'a' in mode:
        return SavedFile(key or str(path), DATA.get(key, '') if 'a' in mode else '')
    if key is None:
        raise FileNotFoundError(2, 'No such file', str(path))
    return io.StringIO(DATA[key])

class Out:
    def __init__(self, cls=''):
        self.cls = cls
    def write(self, s):
        window.townEmit(s, self.cls)
        return len(s)
    def flush(self):
        pass

class NeedInput(BaseException):
    pass

def module_name(path):
    p = path[:-3] if path.endswith('.py') else path
    for root in GAME['path']:
        if p.startswith(root + '/'):
            p = p[len(root) + 1:]
    p = p.replace('/', '.')
    return p[:-9] if p.endswith('.__init__') else p

OVERRIDES = {}

class TownPath:
    # Small pathlib stand-in: game files live in the page, not on a disk.
    def __init__(self, *parts):
        p = '/'.join(str(x) for x in parts if str(x) != '')
        bits = []
        for b in p.split('/'):
            if b in ('', '.'):
                continue
            if b == '..' and bits:
                bits.pop()
            else:
                bits.append(b)
        self.p = '/'.join(bits) or '.'
    def __truediv__(self, other):
        return TownPath(self.p, other)
    def __str__(self):
        return self.p
    __fspath__ = __str__
    def __repr__(self):
        return 'Path(%r)' % self.p
    def __eq__(self, other):
        return str(self) == str(other)
    def __hash__(self):
        return hash(self.p)
    def resolve(self, *a, **k):
        return self
    absolute = expanduser = resolve
    @property
    def parent(self):
        return TownPath(self.p.rpartition('/')[0] if '/' in self.p else '.')
    @property
    def parents(self):
        out, cur = [], self
        while str(cur) != '.':
            cur = cur.parent
            out.append(cur)
        return out
    @property
    def name(self):
        return self.p.rpartition('/')[2]
    @property
    def suffix(self):
        n = self.name
        return n[n.rfind('.'):] if '.' in n else ''
    @property
    def stem(self):
        n = self.name
        return n[:n.rfind('.')] if '.' in n else n
    def exists(self):
        return data_key(self.p) is not None or any(k.startswith(self.p + '/') for k in DATA)
    is_file = exists
    def is_dir(self):
        return any(k.startswith(self.p + '/') for k in DATA)
    def mkdir(self, *a, **k):
        pass
    def unlink(self, *a, **k):
        DATA.pop(data_key(self.p) or '', None)
    def open(self, mode='r', *a, **k):
        return town_open(self.p, mode)
    def read_text(self, *a, **k):
        f = town_open(self.p)
        return f.read()
    def write_text(self, text, *a, **k):
        DATA[data_key(self.p) or self.p] = text
        return len(text)
    def glob(self, pattern):
        suffix = pattern.replace('*', '')
        return [TownPath(k) for k in DATA if k.startswith(self.p + '/') and k.endswith(suffix)]
    def iterdir(self):
        return [TownPath(self.p, k[len(self.p) + 1:].split('/')[0]) for k in DATA if k.startswith(self.p + '/')]

_pathlib = types.ModuleType('pathlib')
_pathlib.Path = _pathlib.PurePath = _pathlib.PosixPath = _pathlib.WindowsPath = TownPath
sys.modules['pathlib'] = _pathlib

def load_modules():
    # Executes the game's own modules into sys.modules; a module whose import fails
    # because a sibling has not loaded yet is retried after the others.
    pending = [f for f in SOURCES if f != GAME['main']]
    for f in pending:
        name = module_name(f)
        for part in range(1, name.count('.') + 1):
            pkg = '.'.join(name.split('.')[:part])
            if pkg not in sys.modules:
                m = types.ModuleType(pkg); m.__path__ = []; m.__package__ = pkg; sys.modules[pkg] = m
    for _ in range(len(pending) + 1):
        if not pending:
            return
        left = []
        for f in pending:
            name = module_name(f)
            is_pkg = f.endswith('__init__.py')
            m = types.ModuleType(name)
            m.__file__ = f
            m.__package__ = name if is_pkg else name.rpartition('.')[0]
            if is_pkg:
                m.__path__ = []
            sys.modules[name] = m
            m.__dict__.update(OVERRIDES)
            try:
                exec(compile(SOURCES[f], f, 'exec'), m.__dict__)
                parent, _, child = name.rpartition('.')
                if parent in sys.modules:
                    setattr(sys.modules[parent], child, m)
            except (ImportError, NameError, AttributeError):
                del sys.modules[name]
                left.append(f)
        if len(left) == len(pending):
            return
        pending = left

def run_game():
    inputs = json.loads(window.townInputs)
    random.seed(int(window.townSeed))
    out = Out()
    sys.stdout = out
    sys.stderr = Out('err')
    queue = list(inputs)
    def fake_input(prompt=''):
        if prompt:
            out.write(str(prompt))
        if not queue:
            raise NeedInput()
        v = queue.pop(0)
        window.townEmit(v + '\n', 'you')
        return v
    # Brython resolves builtins internally, so the game's globals get the replacements.
    builtins.input = fake_input
    builtins.open = town_open
    OVERRIDES.update({'input': fake_input, 'open': town_open})
    time.sleep = lambda s=0: None
    try:
        import os, os.path
        os.system = lambda *a, **k: 0
        os.path.exists = lambda p: data_key(p) is not None
        os.path.isfile = os.path.exists
        os.makedirs = lambda *a, **k: None
        os.remove = lambda p: DATA.pop(data_key(p) or '', None)
    except Exception:
        pass
    for name in list(sys.modules):
        if name in [module_name(f) for f in SOURCES]:
            del sys.modules[name]
    try:
        load_modules()
        g = {'__name__': '__main__', '__file__': GAME['main'], **OVERRIDES}
        exec(compile(SOURCES[GAME['main']], GAME['main'], 'exec'), g)
        window.townState('ended')
    except NeedInput:
        window.townState('input')
    except SystemExit:
        window.townState('ended')
    except Exception as e:
        import traceback
        sys.stderr.write('\n' + traceback.format_exc())
        window.townState('ended')

window.run_game = run_game
window.townReady()
