eted\"):\n        game.say(\"You haven't accepted this quest.\")\n        return True\n\n    # Count fish from Part 3 mats AND from inventory (if your fishing adds an item)\n    mats_fish = game._p3[\"mats\"].get(\"fish\", 0) if getattr(game, \"_p3\", None) else 0\n    inv_fish_keys = [k for k, it in game.player.inv.items()\n                     if k == \"fish\" or it.name.lower() in (\"fish\", \"fresh fish\", \"small fish\")]\n\n    total = mats_fish + len(inv_fish_keys)\n    if total \u003c 2:\n        game.say(\"You haven’t caught enough fish yet.\")\n        return True\n\n    # Consume 2 fish: prefer mats first, then inventory\n    need = 2\n    if getattr(game, \"_p3\", None) and mats_fish > 0:\n        take = min(need, mats_fish)\n        _p7_take_mat(game, \"fish\", take)\n        need -= take\n    while need > 0 and inv_fish_keys:\n        game.player.remove_item(inv_fish_keys.pop())\n        need -= 1\n\n    # Reward (uses Part 6 helper; quest already defines reward {\"gold\":5,\"xp\":1})\n    _p6_apply_reward(game, q.get(\"reward\", {\"gold\": 5, \"xp\": 1}))\n    q[\"state\"] = \"turned_in\"\n    game.say(\"You hand over the fish. The Trader pays in clinking coin.\")\n    return True\n\n#def _p7_cmd_fish(game, args) -> bool:\n#    \"\"\"Wrapper for fishing at Moonlit Lake.\"\"\"\n #   _p7_fish(game)\n#    return True\n\n# ---------- Fishing ----------\n# ---------- Fishing ----------\ndef _p7_cmd_fish(game, args):\n    # Must be at Moonlit Lake\n    if not game or game.room().id != \"wilds_lake\":\n        game.say(\"You can only fish at the Moonlit Lake.\")\n        return True\n\n    import random\n    roll = random.random()\n\n    if roll \u003c 0.20:\n        game.say(\"Nothing bites.\")\n        return True\n    elif roll \u003c 0.95:\n        # Prefer stackable materials (Part 3)\n        if getattr(game, \"_p3\", None) is not None:\n            mats = game._p3.setdefault(\"mats\", {})\n            mats[\"fish\"] = mats.get(\"fish\", 0) + 1\n tem] [npc], new quests: angler_aid, mine_matters, hermit_glow\")\n        return prev(cmd, args, game) if prev else False\n\n\n\n    # NEW: Turn in our quests (coexists with Part 6 turnin)\n    if cmd == \"turnin\":\n        if _p7_cmd_turnin(game, args):\n            return True\n        return prev(cmd, args, game) if prev else False\n\n\n    # Fall through to previous parts\n    return prev(cmd, args, game) if prev else False\n\n# Register this part's handler as the new dispatcher\next_handle_command = p7_ext_handle_command\n\n\n# ===========================\n# SINGLE RUNNER (place at end of file)\n# ===========================\nif __name__ == \"__main__\":\n    try:\n        Game().run()\n    except NameError:\n        # Fallback mini shell if Part 1 isn't present\n        while True:\n            try:\n                line = input(\"> \").strip()\n            except EOFError:\n                break\n            if line in (\"quit\", \"exit\", \"q\"):\n                break\n            parts = line.split()\n            if not parts:\n                continue\n            cmd, args = parts[0].lower(), parts[1:]\n            handled = False\n            if \"ext_handle_command\" in globals():\n                try:\n                    handled = ext_handle_command(cmd, args, None)\n                except Exception as e:\n                    print(f\"[Extension error ignored] {e}\")\n            if not handled:\n                print(\"Base game not loaded. Paste Part 1 to play.\")\n"},"data":{}};
  // input() cannot block in a browser, so each command replays the game from the start

  const KEY = 'town-python:' + GAME.title;

  if (!save || !Array.isArray(save.inputs)) save = { seed: Math.floor(Math.random() * 1e9), inputs: [] };

    screen.scrollTop = screen.scrollHeight;

<script type="text/python">
import sys, builtins, json, random, time, types
from browser import window

GAME = json.loads(window.JSON.stringify(window.GAME))
SOURCES = dict(GAME['sources'])
DATA = dict(GAME.get('data') or {})
import io

def data_key(path):
    p = str(path).replace('\\', '/')
    while p.startswith('./'):
        p = p[2:]
    if p in DATA:
        return p
    for k in DATA:
        if k.endswith('/' + p) or p.endswith('/' + k):
            return k
    return None

class SavedFile(io.StringIO):
    def __init__(self, key, text=''):
        super().__init__(text)
        self.key = key
    def close(self):
        DATA[self.key] = self.getvalue()
        super().close()
    def __exit__(self, *a):
        self.close()

_real_open = builtins.open
def town_open(path, mode='r', *a, **k):
    # Game data files are packed into the page; writes (saves) live for this session.
    key = data_key(path)
    if 'w' in mode or 'a' in mode:
        return SavedFile(key or str(path), DATA.get(key, '') if 'a' in mode else '')
    if key is None:
        raise FileNotFoundError(2, 'No such file', str(path))
    return io.StringIO(DATA[key])

class Out:
    def __init__(self, cls=''):
        self.cls = cls
    def write(self, s):
        window.townEmit(s, self.cls)
        return len(s)
    def flush(self):
        pass

class NeedInput(BaseException):
    pass

def module_name(path):
    p = path[:-3] if path.endswith('.py') else path
    for root in GAME['path']:
        if p.startswith(root + '/'):
            p = p[len(root) + 1:]
    p = p.replace('/', '.')
    return p[:-9] if p.endswith('.__init__') else p

OVERRIDES = {}

class TownPath:
    # Small pathlib stand-in: game files live in the page, not on a disk.
    def __init__(self, *parts):
        p = '/'.join(str(x) for x in parts if str(x) != '')
        bits = []
        for b in p.split('/'):
            if b in ('', '.'):
                continue
            if b == '..' and bits:
                bits.pop()
            else:
                bits.append(b)
        self.p = '/'.join(bits) or '.'
    def __truediv__(self, other):
        return TownPath(self.p, other)
    def __str__(self):
        return self.p
    __fspath__ = __str__
    def __repr__(self):
        return 'Path(%r)' % self.p
    def __eq__(self, other):
        return str(self) == str(other)
    def __hash__(self):
        return hash(self.p)
    def resolve(self, *a, **k):
        return self
    absolute = expanduser = resolve
    @property
    def parent(self):
        return TownPath(self.p.rpartition('/')[0] if '/' in self.p else '.')
    @property
    def parents(self):
        out, cur = [], self
        while str(cur) != '.':
            cur = cur.parent
            out.append(cur)
        return out
    @property
    def name(self):
        return self.p.rpartition('/')[2]
    @property
    def suffix(self):
        n = self.name
        return n[n.rfind('.'):] if '.' in n else ''
    @property
    def stem(self):
        n = self.name
        return n[:n.rfind('.')] if '.' in n else n
    def exists(self):
        return data_key(self.p) is not None or any(k.startswith(self.p + '/') for k in DATA)
    is_file = exists
    def is_dir(self):
        return any(k.startswith(self.p + '/') for k in DATA)
    def mkdir(self, *a, **k):
        pass
    def unlink(self, *a, **k):
        DATA.pop(data_key(self.p) or '', None)
    def open(self, mode='r', *a, **k):
        return town_open(self.p, mode)
    def read_text(self, *a, **k):
        f = town_open(self.p)
        return f.read()
    def write_text(self, text, *a, **k):
        DATA[data_key(self.p) or self.p] = text
        return len(text)
    def glob(self, pattern):
        suffix = pattern.replace('*', '')
        return [TownPath(k) for k in DATA if k.startswith(self.p + '/') and k.endswith(suffix)]
    def iterdir(self):
        return [TownPath(self.p, k[len(self.p) + 1:].split('/')[0]) for k in DATA if k.startswith(self.p + '/')]

_pathlib = types.ModuleType('pathlib')
_pathlib.Path = _pathlib.PurePath = _pathlib.PosixPath = _pathlib.WindowsPath = TownPath
sys.modules['pathlib'] = _pathlib

def load_modules():
    # Executes the game's own modules into sys.modules; a module whose import fails
    # because a sibling has not loaded yet is retried after the others.
    pending = [f for f in SOURCES if f != GAME['main']]
    for f in pending:
        name = module_name(f)
        for part in range(1, name.count('.') + 1):
            pkg = '.'.join(name.split('.')[:part])
            if pkg not in sys.modules:
                m = types.ModuleType(pkg); m.__path__ = []; m.__package__ = pkg; sys.modules[pkg] = m
    for _ in range(len(pending) + 1):
        if not pending:
            return
        left = []
        for f in pending:
            name = module_name(f)
            is_pkg = f.endswith('__init__.py')
            m = types.ModuleType(name)
            m.__file__ = f
            m.__package__ = name if is_pkg else name.rpartition('.')[0]
            if is_pkg:
                m.__path__ = []
            sys.modules[name] = m
            m.__dict__.update(OVERRIDES)
            try:
                exec(compile(SOURCES[f], f, 'exec'), m.__dict__)
                parent, _, child = name.rpartition('.')
                if parent in sys.modules:
                    setattr(sys.modules[parent], child, m)
            except (ImportError, NameError, AttributeError):
                del sys.modules[name]
                left.append(f)
        if len(left) == len(pending):
            return
        pending = left

def run_game():
    inputs = json.loads(window.townInputs)
    random.seed(int(window.townSeed))
    out = Out()
    sys.stdout = out
    sys.stderr = Out('err')
    queue = list(inputs)
    def fake_input(prompt=''):
        if prompt:
            out.write(str(prompt))
        if not queue:
            raise NeedInput()
        v = queue.pop(0)
        window.townEmit(v + '\n', 'you')
        return v
    # Brython resolves builtins internally, so the game's globals get the replacements.
    builtins.input = fake_input
    builtins.open = town_open
    OVERRIDES.update({'input': fake_input, 'open': town_open})
    time.sleep = lambda s=0: None
    try:
        import os, os.path
        os.system = lambda *a, **k: 0
        os.path.exists = lambda p: data_key(p) is not None
        os.path.isfile = os.path.exists
        os.makedirs = lambda *a, **k: None
        os.remove = lambda p: DATA.pop(data_key(p) or '', None)
    except Exception:
        pass
    for name in list(sys.modules):
        if name in [module_name(f) for f in SOURCES]:
            del sys.modules[name]
    try:
        load_modules()
        g = {'__name__': '__main__', '__file__': GAME['main'], **OVERRIDES}
        exec(compile(SOURCES[GAME['main']], GAME['main'], 'exec'), g)
        window.townState('ended')
    except NeedInput:
        window.townState('input')
    except SystemExit:
        window.townState('ended')
    except Exception as e:
        import traceback
        sys.stderr.write('\n' + traceback.format_exc())
        window.townState('ended')

window.run_game = run_game
window.townReady()
