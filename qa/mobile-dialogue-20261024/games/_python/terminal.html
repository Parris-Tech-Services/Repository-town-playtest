<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python game</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f0c; color: #b8f5c0; font: 15px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #111a14; border-bottom: 1px solid #234; }
  header h1 { font-size: 15px; margin: 0; flex: 1; color: #e7ffe9; }
  button { font: inherit; background: #1d3324; color: #dfffe3; border: 1px solid #3c6b49; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #screen { flex: 1; overflow: auto; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #screen .you { color: #ffe08a; }
  #screen .err { color: #ff9c9c; }
  form { display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: #111a14; border-top: 1px solid #234; }
  input { flex: 1; font: inherit; background: #050805; color: #e7ffe9; border: 1px solid #3c6b49; border-radius: 8px; padding: 8px 10px; min-width: 0; }
  #status { color: #8fb79a; font-size: 12px; }
</style>
</head>
<body>
<header><h1 id="title">Python game</h1><span id="status">Loading Python…</span><button id="restart" type="button">New game</button></header>
<div id="screen" role="log" aria-live="polite"></div>
<form id="form"><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a command and press Enter" aria-label="Command"><button>Enter</button></form>
<script>
  // The game, its sources and the save are filled in by tools/pack_games.mjs.
  window.GAME = /*GAME*/null;
  // input() cannot block in a browser, so each command replays the game from the start
  // with the same random seed and every earlier answer. That also makes saving free.
  const KEY = 'town-python:' + GAME.title;
  let save; try { save = JSON.parse(localStorage.getItem(KEY)); } catch { save = null; }
  if (!save || !Array.isArray(save.inputs)) save = { seed: Math.floor(Math.random() * 1e9), inputs: [] };
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch {} };
  document.getElementById('title').textContent = GAME.title;
  document.title = GAME.title;
  const screen = document.getElementById('screen');
  let buffer = [];
  window.townEmit = (s, cls) => buffer.push([String(s), cls || '']);
  window.townState = (s) => { window.townEnded = s; };
  function render() {
    screen.textContent = '';
    for (const [t, c] of buffer) { if (c) { const span = document.createElement('span'); span.className = c; span.textContent = t; screen.append(span); } else screen.append(t); }
    screen.scrollTop = screen.scrollHeight;
  }
  function play() {
    buffer = []; window.townEnded = null;
    window.townInputs = JSON.stringify(save.inputs); window.townSeed = save.seed;
    const t0 = performance.now();
    try { window.run_game(); } catch (e) { buffer.push(['\n[' + (e.message || e) + ']\n', 'err']); }
    render();
    const ended = window.townEnded === 'ended';
    document.getElementById('status').textContent = ended ? 'Game over — press New game' : `${save.inputs.length} moves · saved`;
    document.getElementById('cmd').disabled = ended;
    if (!ended) document.getElementById('cmd').focus({ preventScroll: true });
    console.debug('replay', Math.round(performance.now() - t0), 'ms');
  }
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const box = document.getElementById('cmd');
    save.inputs.push(box.value); box.value = ''; store(); play();
  });
  document.getElementById('restart').onclick = () => { save = { seed: Math.floor(Math.random() * 1e9), inputs: [] }; store(); play(); };
  window.townReady = () => { play(); };
</script>
<script src="RUNTIME/brython.min.js"></script>
<script src="RUNTIME/brython_stdlib.js"></script>
<script type="text/python">
import sys, builtins, json, random, time, types
from browser import window

GAME = json.loads(window.JSON.stringify(window.GAME))
SOURCES = dict(GAME['sources'])
DATA = dict(GAME.get('data') or {})
import io

def data_key(path):
    p = str(path).replace('\\', '/')
    while p.startswith('./'):
        p = p[2:]
    if p in DATA:
        return p
    for k in DATA:
        if k.endswith('/' + p) or p.endswith('/' + k):
            return k
    return None

class SavedFile(io.StringIO):
    def __init__(self, key, text=''):
        super().__init__(text)
        self.key = key
    def close(self):
        DATA[self.key] = self.getvalue()
        super().close()
    def __exit__(self, *a):
        self.close()

_real_open = builtins.open
def town_open(path, mode='r', *a, **k):
    # Game data files are packed into the page; writes (saves) live for this session.
    key = data_key(path)
    if 'w' in mode or 'a' in mode:
        return SavedFile(key or str(path), DATA.get(key, '') if 'a' in mode else '')
    if key is None:
        raise FileNotFoundError(2, 'No such file', str(path))
    return io.StringIO(DATA[key])

class Out:
    def __init__(self, cls=''):
        self.cls = cls
    def write(self, s):
        window.townEmit(s, self.cls)
        return len(s)
    def flush(self):
        pass

class NeedInput(BaseException):
    pass

def module_name(path):
    p = path[:-3] if path.endswith('.py') else path
    for root in GAME['path']:
        if p.startswith(root + '/'):
            p = p[len(root) + 1:]
    p = p.replace('/', '.')
    return p[:-9] if p.endswith('.__init__') else p

OVERRIDES = {}

class TownPath:
    # Small pathlib stand-in: game files live in the page, not on a disk.
    def __init__(self, *parts):
        p = '/'.join(str(x) for x in parts if str(x) != '')
        bits = []
        for b in p.split('/'):
            if b in ('', '.'):
                continue
            if b == '..' and bits:
                bits.pop()
            else:
                bits.append(b)
        self.p = '/'.join(bits) or '.'
    def __truediv__(self, other):
        return TownPath(self.p, other)
    def __str__(self):
        return self.p
    __fspath__ = __str__
    def __repr__(self):
        return 'Path(%r)' % self.p
    def __eq__(self, other):
        return str(self) == str(other)
    def __hash__(self):
        return hash(self.p)
    def resolve(self, *a, **k):
        return self
    @classmethod
    def home(cls):
        return cls('home')
    @classmethod
    def cwd(cls):
        return cls('.')
    absolute = expanduser = resolve
    @property
    def parent(self):
        return TownPath(self.p.rpartition('/')[0] if '/' in self.p else '.')
    @property
    def parents(self):
        out, cur = [], self
        while str(cur) != '.':
            cur = cur.parent
            out.append(cur)
        return out
    @property
    def name(self):
        return self.p.rpartition('/')[2]
    @property
    def suffix(self):
        n = self.name
        return n[n.rfind('.'):] if '.' in n else ''
    @property
    def stem(self):
        n = self.name
        return n[:n.rfind('.')] if '.' in n else n
    def exists(self):
        return data_key(self.p) is not None or any(k.startswith(self.p + '/') for k in DATA)
    is_file = exists
    def is_dir(self):
        return any(k.startswith(self.p + '/') for k in DATA)
    def mkdir(self, *a, **k):
        pass
    def unlink(self, *a, **k):
        DATA.pop(data_key(self.p) or '', None)
    def open(self, mode='r', *a, **k):
        return town_open(self.p, mode)
    def read_text(self, *a, **k):
        f = town_open(self.p)
        return f.read()
    def write_text(self, text, *a, **k):
        DATA[data_key(self.p) or self.p] = text
        return len(text)
    def glob(self, pattern):
        suffix = pattern.replace('*', '')
        return [TownPath(k) for k in DATA if k.startswith(self.p + '/') and k.endswith(suffix)]
    def iterdir(self):
        return [TownPath(self.p, k[len(self.p) + 1:].split('/')[0]) for k in DATA if k.startswith(self.p + '/')]

_pathlib = types.ModuleType('pathlib')
_pathlib.Path = _pathlib.PurePath = _pathlib.PosixPath = _pathlib.WindowsPath = TownPath
sys.modules['pathlib'] = _pathlib

def load_modules():
    # Executes the game's own modules into sys.modules; a module whose import fails
    # because a sibling has not loaded yet is retried after the others.
    pending = [f for f in SOURCES if f != GAME['main']]
    for f in pending:
        name = module_name(f)
        for part in range(1, name.count('.') + 1):
            pkg = '.'.join(name.split('.')[:part])
            if pkg not in sys.modules:
                m = types.ModuleType(pkg); m.__path__ = []; m.__package__ = pkg; sys.modules[pkg] = m
    for _ in range(len(pending) + 1):
        if not pending:
            return
        left = []
        for f in pending:
            name = module_name(f)
            is_pkg = f.endswith('__init__.py')
            m = types.ModuleType(name)
            m.__file__ = f
            m.__package__ = name if is_pkg else name.rpartition('.')[0]
            if is_pkg:
                m.__path__ = []
            sys.modules[name] = m
            m.__dict__.update(OVERRIDES)
            try:
                exec(compile(SOURCES[f], f, 'exec'), m.__dict__)
                parent, _, child = name.rpartition('.')
                if parent in sys.modules:
                    setattr(sys.modules[parent], child, m)
            except (ImportError, NameError, AttributeError):
                del sys.modules[name]
                left.append(f)
        if len(left) == len(pending):
            return
        pending = left

def run_game():
    inputs = json.loads(window.townInputs)
    random.seed(int(window.townSeed))
    out = Out()
    sys.stdout = out
    sys.stderr = Out('err')
    queue = list(inputs)
    def fake_input(prompt=''):
        if prompt:
            out.write(str(prompt))
        if not queue:
            raise NeedInput()
        v = queue.pop(0)
        window.townEmit(v + '\n', 'you')
        return v
    # Brython resolves builtins internally, so the game's globals get the replacements.
    builtins.input = fake_input
    builtins.open = town_open
    OVERRIDES.update({'input': fake_input, 'open': town_open})
    time.sleep = lambda s=0: None
    try:
        import os, os.path
        os.system = lambda *a, **k: 0
        os.path.exists = lambda p: data_key(p) is not None
        os.path.isfile = os.path.exists
        os.makedirs = lambda *a, **k: None
        os.remove = lambda p: DATA.pop(data_key(p) or '', None)
    except Exception:
        pass
    for name in list(sys.modules):
        if name in [module_name(f) for f in SOURCES]:
            del sys.modules[name]
    try:
        load_modules()
        g = {'__name__': '__main__', '__file__': GAME['main'], **OVERRIDES}
        exec(compile(SOURCES[GAME['main']], GAME['main'], 'exec'), g)
        window.townState('ended')
    except NeedInput:
        window.townState('input')
    except SystemExit:
        window.townState('ended')
    except Exception as e:
        import traceback
        sys.stderr.write('\n' + traceback.format_exc())
        window.townState('ended')

window.run_game = run_game
window.townReady()
</script>
<script>brython({ debug: 1 });</script>
</body>
</html>
