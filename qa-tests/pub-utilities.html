<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merged Branch pub playtest</title>
<style>html,body{margin:0;height:100%;background:#122337;color:#fff;font:16px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:10px;background:#d5ad63;border:0;border-radius:8px;cursor:pointer}iframe{width:100%;height:calc(100% - 115px);border:0}p{margin:0;font-size:14px}a{color:#9ad8ff}</style>
<header><button id="start" disabled>Enter pub at lunchtime</button><span id="status">Waiting for the verified pub build…</span><p>This QA page advances the game to lunchtime and enters the pub. Use a private/incognito window to keep this test separate from older saves on this QA hostname. Click the game to move with WASD; press E near kitchen, toilet or meters.</p></header>
<iframe id="game" title="Repository Town pub playtest" allow="autoplay; fullscreen; gamepad"></iframe>
<script>
const url='../qa/pub-utilities-20261025/',game=document.getElementById('game'),start=document.getElementById('start'),status=document.getElementById('status');
let loaded=false;
async function ready(){try{const r=await fetch(url+'release.json',{cache:'no-store'});if(!r.ok)throw Error('not ready');const m=await r.json();if(m.sourceCommit!=='b7d623c88a16e19032e72860d9b5dd288b9e4201')throw Error('wrong release');if(!loaded){game.src=url;loaded=true;}const t=game.contentWindow.__town;if(!t||!game.contentDocument.getElementById('loading')?.hidden)throw Error('loading');start.disabled=false;status.textContent='Verified build ready · choose Enter pub.';}catch{setTimeout(ready,3000);}}
start.onclick=async()=>{start.disabled=true;status.textContent='Advancing real town routines to lunchtime…';try{const t=game.contentWindow.__town;t.meetGuide();t.life.setTime(600);for(let i=0;i<6;i++){t.life.run(30);await new Promise(r=>setTimeout(r,0));}if(!t.enterShop('pub'))throw Error('Pub staff have not arrived; try again.');status.textContent='Inside The Merged Branch · click the game, then explore.';game.contentWindow.focus();}catch(e){status.textContent=e.message;}start.disabled=false;};ready();
</script></html>
