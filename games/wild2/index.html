<body>
<div id="game-container">
  <h1>DOVAHKIIN</h1>
  <div class="subtitle">— The Last Dragonborn — An Elder Scrolls Text Adventure —</div>
  <div id="stats-bar">
    <div class="stat"><span class="stat-label">Race:</span><span class="stat-race" id="s-race">—</span></div>
    <div class="stat"><span class="stat-label">HP:</span><span class="stat-hp" id="s-hp">100</span></div>
    <div class="stat"><span class="stat-label">Stamina:</span><span class="stat-stam" id="s-stam">100</span></div>
    <div class="stat"><span class="stat-label">Shouts:</span><span class="stat-shouts" id="s-shouts">0</span></div>
  </div>
  <div id="chapter-label">Prologue</div>
  <div id="story-box"></div>
  <div id="choices"></div>
  <button id="play-again" onclick="startGame()">▶ Play Again</button>
</div>

<script>
const state = { hp: 100, stamina: 100, shouts: 0, race: '', chapter: 1, flags: {} };

const raceBonus = {
  Nord:   { hp: 20,  stamina: 0,   shouts: 1, desc: 'Battle-hardened sons and daughters of Skyrim — frost resistant, proud, and born for war.' },
  Dunmer: { hp: 0,   stamina: 10,  shouts: 0, desc: 'Dark Elves of Morrowind — cunning, fire-resistant, and deeply distrusted by the Nords around you.' },
  Khajiit:{ hp: 0,   stamina: 20,  shouts: 0, desc: "Cat-folk of Elsweyr — nimble, sharp-eyed, and treated like criminals at every city gate." },
};

function updateStats() {
  document.getElementById('s-race').textContent = state.race || '—';
  document.getElementById('s-hp').textContent = Math.max(0, state.hp);
  document.getElementById('s-stam').textContent = Math.max(0, state.stamina);
  document.getElementById('s-shouts').textContent = state.shouts;
  document.getElementById('chapter-label').textContent = chapterName(state.chapter);
}

function chapterName(n) {
  return ['Prologue','Act I','Act II','Act III','Act IV','Act V','Act VI'][n] || 'Act ' + n;
}

let twTimer = null;
function typeText(text, callback) {
  const box = document.getElementById('story-box');
  box.innerHTML = '';
  if (twTimer) clearTimeout(twTimer);
  let i = 0;
  function step() {
    if (i < text.length) {
      if (text[i] === '<') {
        const end = text.indexOf('>', i);
        i = end + 1;
        box.innerHTML = text.substring(0, i);
        twTimer = setTimeout(step, 0);
      } else {
        i++;
        box.innerHTML = text.substring(0, i);
        twTimer = setTimeout(step, 17);
      }
    } else if (callback) callback();
  }
  step();
}

function showChoices(choices) {
  const div = document.getElementById('choices');
  div.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.label;
    btn.onclick = () => {
      div.querySelectorAll('button').forEach(b => b.disabled = true);
      if (c.effect) c.effect();
      setTimeout(() => goTo(c.next), 320);
    };
    div.appendChild(btn);
  });
}

function goTo(id) {
  const scene = scenes[id];
  if (!scene) return;
  state.chapter = scene.chapter || state.chapter;
  updateStats();
  document.getElementById('play-again').style.display = 'none';
  document.getElementById('choices').innerHTML = '';
  const text = typeof scene.text === 'function' ? scene.text() : scene.text;
  if (text && text.indexOf('ENDING:') > -1) recordEnding(id);
  typeText(text, () => {
    const choices = typeof scene.choices === 'function' ? scene.choices() : scene.choices;
    if (choices && choices.length) {
      showChoices(choices);
    } else {
      document.getElementById('play-again').style.display = 'block';
    }
  });
}

const scenes = {
  race_select: {
    chapter: 0,
    text: `<span class="em">The executioner's block at Helgen. Your hands are bound. The year is 4E 201.</span>

A cart rattles through a mountain pass. Around you: a Stormcloak soldier singing under his breath, the Imperial Captain studying a list of names, and a Nord prisoner watching you with a curious frown.

<span class="em">"Hey. You. What are you in for?"</span>

You don't remember. The last thing you recall is walking south from — somewhere. The cold feels familiar, wherever you're from.

Who are you?`,
    choices: [
      {
        label: '🛡  Nord — "Skyrim is my home. These chains are an insult."',
        next: 'helgen',
        effect: () => { state.race = 'Nord'; state.hp += 20; state.shouts += 1; state.flags.raceBonus = 'hp'; }
      },
      {
        label: '🔥  Dunmer — "I have walked darker roads than this execution."',
        next: 'helgen',
        effect: () => { state.race = 'Dunmer'; state.stamina += 10; state.flags.raceBonus = 'stam'; }
      },
      {
        label: '🐾  Khajiit — "This one has escaped worse, yes? Perhaps."',
        next: 'helgen',
        effect: () => { state.race = 'Khajiit'; state.stamina += 20; state.flags.raceBonus = 'agility'; }
      },
    ]
  },

  helgen: {
    chapter: 1,
    text() {
      const raceLines = {
        Nord: `The Captain crosses your name off the list with a grunt. <span class="em">"Nord. Probably a Stormcloak sympathiser. Execute with the rest."</span>`,
        Dunmer: `The Captain eyes your ash-grey skin. <span class="em">"Dark Elf. No record of you. Doesn't matter. You were in the wrong place."</span>`,
        Khajiit: `The Captain wrinkles her nose. <span class="em">"Khajiit. We don't need a reason."</span> She marks your name with a slash.`,
      };
      return `${raceLines[state.race] || ''}

The block is cold stone. The headsman raises his axe.

Then the sky <span class="dragon">SCREAMS</span>.

A shape like a mountain with wings drops from the clouds and lands on the keep's tower with a sound that collapses the tower entirely. Its roar is not sound — it is <span class="em">language</span>, ancient and absolute, and something in your chest answers it without your permission.

<span class="dragon">YOL — fire pours from the dragon's throat in a sheet of orange ruin.</span>

Chaos. The headsman is gone. Your bindings burn through. A Stormcloak — Ralof — hauls you upright.

<span class="em">"Move! Through the keep — NOW!"</span>

${state.race === 'Nord' ? 'Your Nord blood surges. You have never felt more alive.' : state.race === 'Dunmer' ? 'You move with Dunmer composure — controlled terror, the best kind.' : 'Khajiit reflexes take over before your mind catches up.'}

HP: ${state.hp} | Stamina: ${state.stamina}`;
    },
    choices: [
      { label: '⚔  Follow Ralof through the Imperial Keep — fight your way out', next: 'keep_fight' },
      { label: '🏃  Break away alone — use the chaos to slip out a side passage', next: 'keep_stealth' },
    ]
  },

  keep_fight: {
    chapter: 1,
    text: `The keep is a war between Imperial soldiers and the dragon's fire. Ralof hands you a woodcutter's axe taken from a dead guard. It is not a fine weapon. It does not need to be.

You carve through two Imperials in the smoke-filled corridor — not with skill, but with desperation, which in a pinch works just as well. Ralof roars beside you.

Then the dragon's claw punches through the ceiling above. <span class="dragon">Stone, fire, two soldiers — all gone.</span> The beast's eye fills the gap, pupil contracting as it fixes on you.

It does not breathe fire. It <span class="em">waits</span>.

Then it speaks, low and earthshaking: <span class="shout">"DOVAHKIIN."</span>

You don't know the word. But your bones do.

HP -15 | Stamina -10`,
    choices: [
      { label: '🗣  Shout back — something rises in your throat unbidden', next: 'first_shout', effect: () => { state.hp -= 15; state.stamina -= 10; } },
      { label: '🏃  Flee — whatever that word means, survive first', next: 'bleak_falls', effect: () => { state.hp -= 15; state.stamina -= 10; } },
    ]
  },

  keep_stealth: {
    chapter: 1,
    text: `You find a servants' passage — low-ceilinged, smoke-filled, and blessedly empty. Your ${state.race === 'Khajiit' ? 'Khajiit eyes pierce the dark like torchlight' : 'eyes adjust slowly'} to the gloom.

You navigate by feel and luck, past a wine cellar, past a collapsed torture room, past a door that opens — impossibly — onto a courtyard where the dragon has just landed.

Its head swings toward you like a compass needle finding north.

It does not attack. It tilts its head. That enormous, ancient, unblinking eye studies you the way you might study a word you half-recognise in a foreign language.

<span class="em">"Dovahkiin,"</span> it says, and the stone under your feet cracks from the resonance.

Then it launches into the sky and is gone.

Stamina +10 (adrenaline reserves)`,
    choices: [
      { label: '🗺  Follow Ralof to Riverwood — regroup and recover', next: 'bleak_falls', effect: () => { state.stamina += 10; } },
      { label: '🗣  Chase the dragon — something in you demands to understand that word', next: 'first_shout', effect: () => { state.stamina += 10; } },
    ]
  },

  first_shout: {
    chapter: 2,
    text: `You chase the word the dragon left in your chest.

In the ruins near Helgen, you find an old Word Wall — Atmoran carvings worn smooth by centuries of wind. As you approach, the runes glow a deep cold blue. They are not being illuminated. They are being <span class="em">read</span> by something in you.

The word enters your mind complete: <span class="shout">FUS — Force.</span>

You open your mouth and speak it, and the air ahead of you bends like glass, strikes an old pine tree, and folds it in half.

Silence. Then Ralof, from behind you, very quietly: <span class="em">"By Talos."</span>

A Greybeard's messenger hawk lands on a nearby rock. Its leg carries a single line of script: <span class="em">"DOVAHKIIN. HIGH HROTHGAR AWAITS."</span>

Shouts Known: +1 (FUS — Unrelenting Force, first Word)`,
    choices: [
      { label: '🏔  Climb the 7,000 Steps to High Hrothgar immediately', next: 'high_hrothgar', effect: () => { state.shouts += 1; } },
      { label: '⚔  Go to Bleak Falls Barrow first — the Jarl of Whiterun needs a Dragonstone', next: 'bleak_falls', effect: () => { state.shouts += 1; } },
    ]
  },

  bleak_falls: {
    chapter: 2,
    text: `Bleak Falls Barrow crouches on a cliff above the tundra like a bad memory. The Nords buried their dead here for a thousand years, and the dead — as is their habit in Skyrim — did not stay buried.

Draugr fill the corridors: ancient soldiers animated by whatever necromantic grudge keeps them from rest. They move slowly. They hit like siege engines.

You find the Dragonstone deep in the barrow, past a master-locked gate and a spider the size of a pony. The stone is carved with a map of dragon burial sites — places where Alduin buried his lieutenants to raise them in a later age. This age.

On the way out, you pass another Word Wall. This one hums a different note: <span class="shout">RO — Balance.</span>

The second word of Unrelenting Force. With both words together, the shout knocks a Draugr Deathlord clean through a stone wall.

HP -20 | Shouts +1`,
    choices: [
      { label: '🏔  Bring the Dragonstone to Whiterun, then climb to High Hrothgar', next: 'high_hrothgar', effect: () => { state.hp -= 20; state.shouts += 1; } },
      { label: '🐉  A dragon attacks Whiterun — fight it now, Greybeards later', next: 'whiterun_dragon', effect: () => { state.hp -= 20; state.shouts += 1; } },
    ]
  },

  high_hrothgar: {
    chapter: 3,
    text: `Seven thousand steps. The Greybeards measure devotion in altitude.

The Throat of the World pierces the cloud layer at four thousand steps. At six thousand, the wind is a living thing trying to push you off the mountain. At the top: a monastery of grey stone, four old men, and a silence so profound it has texture.

Master Arngeir speaks. The other three Greybeards do not speak — when they last spoke, they levelled a small town.

<span class="em">"You are Dragonborn. Not the first. Likely not the last. But you are here, and Alduin is not yet risen to his full strength. There is a shout — DRAGONREND — that can force a dragon to land. We did not create it. The ancient heroes of the Merethic Era did, at great cost."</span>

He teaches you a third Word: <span class="shout">DAH — Push.</span>

FUS RO DAH. The complete shout. The air becomes a weapon.

<span class="em">"To learn DRAGONREND, you must read the Elder Scroll at the summit of this mountain — and survive what you see in it."</span>

Shouts +1`,
    choices: [
      { label: '📜  Seek the Elder Scroll — risk madness to gain DRAGONREND', next: 'elder_scroll', effect: () => { state.shouts += 1; } },
      { label: '🦇  Seek the vampire lord Harkon instead — power without wisdom', next: 'ending_vampire', effect: () => { state.shouts += 1; } },
      { label: '🐺  Join the Companions at Whiterun — earn werewolf strength for the fight', next: 'companions', effect: () => { state.shouts += 1; } },
    ]
  },

  whiterun_dragon: {
    chapter: 3,
    text: `<span class="dragon">Mirmulnir</span> — an ancient dragon, scales the colour of dried blood — circles the Western Watchtower while Whiterun's guards die below.

You stand in the open field with a bow borrowed from a dying Companion. Mirmulnir swoops. You roll. His fire chars the earth where you stood. The Companions fight with reckless courage. The guards fight with disciplined desperation.

When Mirmulnir finally crashes to earth, wings broken by a dozen arrows, you approach. The dragon looks at you with one ember-orange eye.

<span class="em">"Dovahkiin,"</span> it rasps. <span class="em">"You cannot stop him. He has eaten centuries. You have eaten — what? Twenty years?"</span>

You drive your blade into its skull.

The dragon's soul tears free of its body like heat from cooling stone — and floods into you. Every guard present falls to their knees.

<span class="em">"DRAGONBORN!"</span> they shout, one voice.

You absorb the soul and with it: <span class="shout">YOL — Fire.</span>

Shouts +1 | HP -25`,
    choices: [
      { label: '🏔  Climb to High Hrothgar — answer the Greybeards\' summons', next: 'high_hrothgar', effect: () => { state.hp -= 25; state.shouts += 1; } },
    ]
  },

  companions: {
    chapter: 4,
    text: `The Companions of Whiterun are Nord warrior-poets who drink mead and compose battlefield sagas with equal seriousness. Kodlak Whitemane, their Harbinger, receives you in Jorrvaskr's mead hall.

// ─── SAVED PROGRESS (localStorage) ────────────────────────────────────────────
const SAVE_KEY = 'wild2_endings';
const TOTAL_ENDINGS = 3;

function loadEndings() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }
  catch (e) { return []; }
}

function recordEnding(id) {
  const found = loadEndings();
  if (!found.includes(id)) {
    found.push(id);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(found)); } catch (e) {}
  }
  renderProgress();
}

function renderProgress() {
  let el = document.getElementById('progress-bar');
  if (!el) {
    el = document.createElement('div');
    el.id = 'progress-bar';
    el.style.cssText = 'font-size:0.72rem;color:#4a2000;letter-spacing:0.1em;text-align:center;margin-top:14px;';
    document.getElementById('game-container').appendChild(el);
  }
  el.textContent = 'ENDINGS DISCOVERED: ' + loadEndings().length + ' / ' + TOTAL_ENDINGS + ' (saved on this device)';
}

function startGame() {
  state.hp = 100; state.stamina = 100; state.shouts = 0; state.race = ''; state.chapter = 1; state.flags = {};
  document.getElementById('play-again').style.display = 'none';
  updateStats();
  renderProgress();
  goTo('race_select');
}

startGame();
