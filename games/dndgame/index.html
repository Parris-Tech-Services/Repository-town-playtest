c/svg>\n","package-lock.json":"{\n  \"name\": \"dndgame\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\n      \"name\": \"dndgame\",\n      \"version\": \"1.0.0\",\n      \"license\": \"ISC\",\n      \"devDependencies\": {\n        \"@playwright/test\": \"^1.59.1\"\n      }\n    },\n    \"node_modules/@playwright/test\": {\n      \"version\": \"1.59.1\",\n      \"resolved\": \"https://registry.npmjs.org/@playwright/test/-/test-1.59.1.tgz\",\n      \"integrity\": \"sha512-PG6q63nQg5c9rIi4/Z5lR5IVF7yU5MqmKaPOe0HSc0O2cX1fPi96sUQu5j7eo4gKCkB2AnNGoWt7y4/Xx3Kcqg==\",\n      \"dev\": true,\n      \"license\": \"Apache-2.0\",\n      \"dependencies\": {\n        \"playwright\": \"1.59.1\"\n      },\n      \"bin\": {\n        \"playwright\": \"cli.js\"\n      },\n      \"engines\": {\n        \"node\": \">=18\"\n      }\n    },\n    \"node_modules/fsevents\": {\n      \"version\": \"2.3.2\",\n      \"resolved\": \"https://registry.npmjs.org/fsevents/-/fsevents-2.3.2.tgz\",\n      \"integrity\": \"sha512-xiqMQR4xAeHTuB9uWm+fFRcIOgKBMiOBP+eXiyT7jsgVCq1bkVygt00oASowB7EdtpOHaaPgKt812P9ab+DDKA==\",\n      \"dev\": true,\n      \"hasInstallScript\": true,\n      \"license\": \"MIT\",\n      \"optional\": true,\n      \"os\": [\n        \"darwin\"\n      ],\n      \"engines\": {\n        \"node\": \"^8.16.0 || ^10.6.0 || >=11.0.0\"\n      }\n    },\n    \"node_modules/playwright\": {\n      \"version\": \"1.59.1\",\n      \"resolved\": \"https://registry.npmjs.org/playwright/-/playwright-1.59.1.tgz\",\n      \"integrity\": \"sha512-C8oWjPR3F81yljW9o5OxcWzfh6avkVwDD2VYdwIGqTkl+OGFISgypqzfu7dOe4QNLL2aqcWBmI3PMtLIK233lw==\",\n      \"dev\": true,\n      \"license\": \"Apache-2.0\",\n      \"dependencies\": {\n        \"playwright-core\": \"1.59.1\"\n      },\n      \"bin\": {\n        \"playwright\": \"cli.js\"\n      },\n      \"engines\": {\n        \"node\": \">=18\"\n      },\n      \"optionalDependencies\": {\n        \"fsevents\": \"2.3.2\"\n      }\n    },\n    \"node_modules/playwright-core\": {\n      \"version\": \"1.59.1\",\n      \"resolved\": \"https://registry.npmjs.org/playwright-core/-/playwright-core-1.59.1.tgz\",\n      \"integrity\": \"sha512-HBV/RJg81z5BiiZ9yPzIiClYV/QMsDCKUyogwH9p3MCP6IYjUFu/MActgYAvK0oWyV9NlwM3GLBjADyWgydVyg==\",\n      \"dev\": true,\n      \"license\": \"Apache-2.0\",\n      \"bin\": {\n        \"playwright-core\": \"cli.js\"\n      },\n      \"engines\": {\n        \"node\": \">=18\"\n      }\n    }\n  }\n}\n","package.json":"{\n  \"name\": \"dndgame\",\n  \"version\": \"1.0.0\",\n  \"description\": \"A modular browser RPG rebuilt from a truncated legacy snapshot.\",\n  \"main\": \"playwright.config.js\",\n  \"directories\": {\n    \"test\": \"tests\"\n  },\n  \"scripts\": {\n    \"test\": \"npx playwright test\",\n    \"test:e2e\": \"npx playwright test tests/smoke.spec.js\",\n    \"test:e2e:headed\": \"npx playwright test tests/smoke.spec.js --headed\"\n  },\n  \"keywords\": [],\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"type\": \"commonjs\",\n  \"devDependencies\": {\n    \"@playwright/test\": \"^1.59.1\"\n  }\n}\n","progress.md":"Original prompt: Improve every deployable app on this computer, verify it, and publish it.\n\n## 2026-06-09\n\n- Added fullscreen controls and documented the existing keyboard shortcuts.\n- Added concise runtime state inspection and deterministic refresh hooks.\n- Added Playwright coverage for the state hook and corrected the README test-harness status.\n- Full Playwright suite passed after correcting the state-hook location assertion.\n- Browser character-creation screenshot passed without console errors.\n","src/data/classes.js":"﻿export const CLASSES = [\n  {\n    id: \"fighter\",\n    name: \"Fighter\",\n    description: \"Weapons specialist built for sustained frontline combat.\",\n    hitDie: 10,\n    armorClassBase: 16,\n    weaponDamage: \"1d8+3\",\n    primaryAbility: \"str\",\n    spellcaster: false,\n    startingSpells: []\n  },\n  {\n    id: \"rogue\",\n    name: \"Rogue\",\n    description: \"Precise striker that relies on agility and timing.\",\n    hitDie: 8,\n    armorClassBase: 15,\n    weaponDamage: \"1d6+4\",\n    primaryAbility: \"dex\",\n    spellcaster: false,\n    startingSpells: []\n  },\n  {\n    id: \"cleric\",\n    name: \"Cleric\",\n    description: \"Holy battlemage with healing and radiant power.\",\n    hitDie: 8,\n    armorClassBase: 15,\n    weaponDamage: \"1d6+2\",\n    primaryAbility: \"wis\",\n    spellcaster: true,\n    maxSpellSlots: 2,\n    startingSpells: [\"sacred_flame\", \"healing_word\", \"guiding_bolt\"]\n  },\n  {\n    id: \"wizard\",\n    name: \"Wizard\",\n    description: \"Arcane scholar with strong utility and burst damage.\",\n    hitDie: 6,\n    armorClassBase: 13,\n    weaponDamage: \"1d4+1\",\n    primaryAbility: \"int\",\n    spellcaster: true,\n    maxSpellSlots: 3,\n    startingSpells: [\"fire_bolt\", \"magic_missile\", \"shield\"]\n  },\n  {\n    id: \"ranger\",\n    name: \"Ranger\",\n    description: \"Hunter and scout skilled in ranged pressure.\",\n    hitDie: 10,\n    armorClassBase: 15,\n    weaponDamage: \"1d8+2\",\n    primaryAbility: \"dex\",\n    spellcaster: true,\n    maxSpellSlots: 2,\n    startingSpells: [\"hunters_mark\", \"cure_wounds\"]\n  },\n  {\n    id: \"warlock\",\n    name: \"Warlock\",\n    description: \"Pact-bound caster with reliable eldritch offense.\",\n    hitDie: 8,\n    armorClassBase: 14,\n    weaponDamage: \"1d6+2\",\n    primaryAbility: \"cha\",\n    spellcaster: true,\n    maxSpellSlots: 2,\n    startingSpells: [\"eldritch_blast\", \"hex\", \"armor_of_agathys\"]\n  }\n];\n\nexport const BACKGROUNDS = [\n  { id: \"soldier\", name: \"Soldier\", description: \"Veteran of border skirmishes and siege lines.\" },\n  { id: \"acolyte\", name: \"Acolyte\", description: \"Temple-trained pilgrim of lore and ritual.\" },\n  { id: \"criminal\", name: \"Criminal\", description: \"Streetwise operator with undercity contacts.\" },\n  { id: \"sage\", name: \"Sage\", description: \"Researcher devoted to forgotten records.\" },\n  { id: \"outlander\", name: \"Outlander\", description: \"Wilderness survivor from frontier lands.\" },\n  { id: \"noble\", name: \"Noble\", description: \"Court-bred voice with political leverage.\" }\n];\n","src/data/exploration.js":"export const SCENE_ART = {\n  city: {\n    image: \"./assets/scenes/city-gates.svg\",\n    title: \"City Stone and Oath-Bells\",\n    caption: \"Banner-shadowed streets where duty and fear move side by side.\"\n  },\n  market: {\n    image: \"./assets/scenes/market-canopy.svg\",\n    title: \"Lantern Canopies and Bargain Fires\",\n    caption: \"Warm canvas glow, spice smoke, and a hundred voices trading half-truths.\"\n  },\n  docks: {\n    image: \"./assets/scenes/docks-tide.svg\",\n    title: \"Salt Timber and Tidal Creak\",\n    caption: \"Wet rope, dark water, and the feeling that someone is always listening.\"\n  },\n  ruins: {\n    image: \"./assets/scenes/ruins-moon.svg\",\n    title: \"Broken Estates Under Moonlight\",\n    caption: \"Cracked stone, ivy, and old wealth rotting into shadows.\"\n  },\n  graves: {\n    image: \"./assets/scenes/graveyard-fog.svg\",\n    title: \"Fog Among the Dead\",\n    caption: \"Cold markers, dim lanterns, and the hush before something stirs.\"\n  },\n  rift: {\n    image: \"./assets/scenes/hotenow-rift.svg\",\n    title: \"Ashlight Over the Rift\",\n    caption: \"Heat shimmer, molten seams, and a sky that looks ready to split.\"\n  }\n};\n\nexport const GLOBAL_AMBIENT_ACTIONS = [\n  {\n    id: \"smell_around\",\n    label: \"Smell Around\",\n    ability: \"wis\",\n    dc: 10,\n    success: ({ ambience }) => `You slow your breathing and separate the layers in the air: ${ambience.scent}.`,\n    failure: ({ ambience }) => `The air is too muddled to read cleanly. All you catch is a blur of ${ambience.scent}.`\n  },\n  {\n    id: \"listen_closely\",\n    label: \"Listen Closely\",\n    ability: \"wis\",\n    dc: 11,\n    success: ({ ambience }) => `When you hold still, the place resolves into sharper lines: ${ambience.sound}.`,\n    failure: ({ ambience }) => `The noise never quite settles. You only catch flashes of ${ambience.sound}.`\n  },\n  {\n    id: \"perception_sweep\",\n    label: \"Make A Perception Check\",\n    ability: \"wis\",\n    dc: 12,\n    success: ({ ambience }) => `Your eyes snag on what most people miss: ${ambience.detail}.`,\n    failure: ({ ambience }) => `You scan the area carefully, but nothing separates itself from the ordinary press of ${ambience.atmosphere}.`\n  },\n  {\n    id: \"investigate_area\",\n    label: \"Investigate The Area\",\n    ability: \"int\",\n    dc: 12,\n    success: ({ ambience }) => `You follow marks, disturbed dust, and little inconsistencies until the scene starts to speak: ${ambience.investigation}.`,\n    failure: () => \"You crouch, trace a few signs, and come away with fragments but no firm answer.\"\n  },\n  {\n    id: \"sit_and_watch\",\n    label: \"Sit And Watch\",\n    daily: true,\n    use: ({ ambience }) => ambience.rest,\n    repeat: () => \"You have already taken a quiet moment to steady yourself today.\"\n  },\n  {\n    id: \"drink_water\",\n    label: \"Drink Some Water\",\n    daily: true,\n    use: ({ ambience }) => ambience.water,\n    repeat: () => \"Your throat is already clear and your waterskin has had its share for the day.\"\n  },\n  {\n    id: \"write_journal\",\n    label: \"Write In Journal\",\n    use: ({ ambience }) => ambience.journal\n  },\n  {\n    id: \"offer_prayer\",\n    label: \"Offer A Quiet Prayer\",\n    daily: true,\n    use: ({ ambience }) => ambience.prayer,\n    repeat: () => \"You have already spent time in quiet reflection today.\"\n  }\n];\n\nexport const LOCATION_AMBIENCE = {\n  protector_enclave: {\n    sceneId: \"city\",\n    atmosphere: \"order held together by tired discipline\",\n    scent: \"cold iron, lamp oil, fresh-cut parchment, and fountain spray\",\n    sound: \"measured boots, clipped commands, and distant bronze bells\",\n    detail: \"chalk marks near a watch post and a courier route scratched into damp stone\",\n    investigation: \"a fresh civic seal that references ashfall patrols and rationed temple supplies\",\n    tags: [\"watchful steel\", \"marble fountain\", \"sealed orders\"],\n    rest: \"You sit on the lip of a marble fountain and let the square move around you until your pulse eases.\",\n    water: \"You drink from the lion-headed fountain. The water is cold enough to bite and clears your head immediately.\",\n    journal: \"You write that Protector's Enclave looks calm from a distance, but every guard rotation says otherwise.\",\n    prayer: \"Under the high banners, you lower your head for a quiet moment and let the noise thin out behind your thoughts.\",\n    perceptionReward: {\n      gold: 4,\n      text: \"Tucked beside the fountain base, you spot a dropped civic voucher worth 4 gold.\"\n    },\n    investigationReward: {\n      itemId: \"moonleaf\",\n      qty: 1,\n      text: \"Inside a cracked courier tube, you find a wrapped pinch of moonleaf that never reached its healer.\"\n    },\n    specialActions: [\n      {\n        id: \"read_proclamations\",\n        label: \"Read The Proclamations\",\n        ability: \"int\",\n        dc: 11,\n        success: () => \"Layered beneath the tax notices is a new decree about strange ash settling east of the city.\",\n        failure: () => \"Rain and wax have turned the proclamations into a patchwork of smudged names and half-lines.\"\n      },\n      {\n        id: \"watch_guard_rotation\",\n        label: \"Watch The Guard Rotation\",\n        ability: \"wis\",\n        dc: 12,\n        success: () => \"One watch captain passes a coded token to another. Serra is not the only one expecting trouble.\",\n        failure: () => \"The handoff looks routine until it is over, and by then the moment is gone.\"\n      }\n    ]\n  },\n  market_square: {\n    sceneId: \"market\",\n    atmosphere: \"warm commerce stretched over hard scarcity\",\n    scent: \"pepper broth, soot, wet wool, and sharp green herbs\",\n    sound: \"hawkers calling prices, pans hissing, and wagons rattling over stone\",\n    detail: \"a stall with false-bottom drawers and a scrap of shipping wax impressed with a broken sigil\",\n    investigation: \"a trade ledger with several entries quietly redirected toward Dockward after sundown\",\n    tags: [\"spice smoke\", \"canvas glow\", \"hidden ledgers\"],\n    rest: \"You claim a stool near a cooking fire and watch the market's rhythm settle into something almost comforting.\",\n    water: \"You rinse road dust away with cool water from a clay pitcher beside a smith's stall.\",\n    journal: \"You note how the market sounds cheerful until you listen to what people stop saying when guards pass.\",\n    prayer: \"You close your eyes amid the market clatter and offer a quiet word for steady hands and clear judgment.\",\n    perceptionReward: {\n      gold: 5,\n      text: \"A purse slipped beneath a spice rack does not belong to anyone nearby. Inside are 5 gold pieces.\"\n    },\n    investigationReward: {\n      itemId: \"iron_ore\",\n      qty: 1,\n      text: \"Under a stack of broken pans, you uncover a clean piece of trade-grade iron ore.\"\n    },\n    specialActions: [\n      {\n        id: \"haggle_for_rumors\",\n        label: \"Haggle For Rumors\",\n        ability: \"cha\",\n        dc: 12,\n        success: () => \"A cloth merchant mutters that smugglers have been paying double for night deliveries near the tide line.\",\n        failure: () => \"The merchants enjoy the performance but keep their real gossip tucked behind polite smiles.\"\n      },\n      {\n        id: \"sample_street_broth\",\n        label: \"Sample Street Broth\",\n        daily: true,\n        use: () => \"A paper cup of pepper broth warms your chest and takes the edge off the road.\",\n        repeat: () => \"You are still carrying the comfort of that broth and do not need another cup right now.\"\n      }\n    ]\n  },\n  hall_of_justice: {\n    sceneId: \"city\",\n    atmosphere: \"sacred calm threaded through military urgency\",\n    scent: \"incense ash, polished stone, old wax, and clean linen\",\n    sound: \"murmured prayer, echoing sandals, and low cathedral bells\",\n    detail: \"fresh candle drips near a side shrine and a healer's satchel left ready beside a bench\",\n    investigation: \"a prayer board crowded with petitions about missing caravans, fever, and ash-darkened skies\",\n    tags: [\"candle smoke\", \"echoed vows\", \"marble hush\"],\n    rest: \"You sit beneath a carved relief of old heroes and let the hall's quiet weight settle your nerves.\",\n    water: \"Temple acolytes leave a basin of clean water near the entry. You drink deeply and feel the tension loosen.\",\n    journal: \"You write that the Hall of Justice feels less like safety and more like people working very hard to preserve it.\",\n    prayer: \"Before the candlelight, your thoughts finally line up into something clean and usable.\",\n    perceptionReward: {\n      gold: 3,\n      text: \"You notice a donation tray knocked behind a bench. After returning most of it, the priests insist you keep 3 gold.\"\n    },\n    investigationReward: {\n      itemId: \"healing_potion\",\n      qty: 1,\n      text: \"A healer thanks you for finding a misplaced satchel and presses a healing potion into your hand.\"\n    },\n    specialActions: [\n      {\n        id: \"light_a_candle\",\n        label: \"Light A Candle\",\n        daily: true,\n        use: () => \"The tiny flame steadies you more than you expected.\",\n        repeat: () => \"You have already stood quietly with the candlelight today.\"\n      },\n      {\n        id: \"study_reliefs\",\n        label: \"Study The Stone Reliefs\",\n        ability: \"int\",\n        dc: 11,\n        success: () => \"The reliefs repeat one lesson over and over: walls matter, but people matter more.\",\n        failure: () => \"You admire the stonework, but the symbolism remains frustratingly broad.\"\n      }\n    ]\n  },\n  dockward: {\n    sceneId: \"docks\",\n    atmosphere: \"salt-slick nerves hidden under tavern noise\",\n    scent: \"brine, tar, fish scales, and cheap lamp smoke\",\n    sound: \"rope creak, gulls, muttered wagers, and waves thudding into pilings\",\n    detail: \"fresh scrape marks on a crate that was recently re-nailed shut\",\n    investigation: \"a chain of tide-stained bootprints leading from public cargo to a private warehouse door\",\n    tags: [\"black tide\", \"rope creak\", \"salt fog\"],\n    rest: \"You sit on a coiled rope and watch the harbor traffic argue with the tide.\",\n    water: \"You wash salt from your lips with a long drink from your waterskin and breathe a little easier.\",\n    journal: \"You write that Dockward wears its danger openly; the trick is learning which danger is for sale and which is hunting.\",\n    prayer: \"With the tide moving under the boards, your quiet prayer feels less like certainty and more like balance.\",\n    perceptionReward: {\n      gold: 4,\n      text: \"Wedged beneath a bollard, you find a loose payment chit worth 4 gold.\"\n    },\n    investigationReward: {\n      itemId: \"moonleaf\",\n      qty: 1,\n      text: \"Inside a torn smuggler wrap, you find a bundle of drying moonleaf.\"\n    },\n    specialActions: [\n      {\n        id: \"listen_to_sailors\",\n        label: \"Listen To Sailors\",\n        ability: \"cha\",\n        dc: 11,\n        success: () => \"Between boasts and curses, you hear that someone has been paying extra for ash-proof cargo wrappings.\",\n        failure: () => \"The sailors close ranks fast. You get noise, but not truth.\"\n      },\n      {\n        id: \"watch_the_tide\",\n        label: \"Watch The Tide\",\n        ability: \"wis\",\n        dc: 10,\n        success: () => \"The tide reveals which piers were used recently; the deeper wake points toward Sunken Pier.\",\n        failure: () => \"The chop is too messy to read clearly, and every broken piling starts to look the same.\"\n      }\n    ]\n  },\n  blacklake: {\n    sceneId: \"ruins\",\n    atmosphere: \"noble ruin hiding old grudges in ivy and ash\",\n    scent: \"wet stone, torn ivy, soot, and stagnant garden water\",\n    sound: \"loose shutters, distant crows, and the whisper of branches against masonry\",\n    detail: \"a half-hidden family crest carved into a gatepost and boot prints where no path should be\",\n    investigation: \"signs that someone has been moving through the old estates with purpose rather than scavenging\",\n    tags: [\"ivy walls\", \"moonlit glass\", \"old money\"],\n    rest: \"You sit on a broken balustrade and watch moonlight catch on shattered windows.\",\n    water: \"You take a careful sip, then another, washing ash grit from your mouth while the district watches in silence.\",\n    journal: \"You write that Blacklake feels like a place still pretending the catastrophe was temporary.\",\n    prayer: \"In the hush between ruined walls, even a quiet prayer sounds as though it belongs to someone else.\",\n    perceptionReward: {\n      itemId: \"moonleaf\",\n      qty: 1,\n      text: \"You spot moonleaf climbing where a garden once stood and gather a usable sprig.\"\n    },\n    investigationReward: {\n      gold: 6,\n      text: \"Behind a fallen stone panel, you uncover an old household coin box with 6 gold still inside.\"\n    },\n    specialActions: [\n      {\n        id: \"inspect_manor_gate\",\n        label: \"Inspect The Manor Gate\",\n        ability: \"int\",\n        dc: 12,\n        success: () => \"The ash scoring on the ironwork is recent. Somebody has been testing magical heat here.\",\n        failure: () => \"The gate yields only rust, ivy, and the feeling that it once mattered to somebody important.\"\n      },\n      {\n        id: \"trace_house_crests\",\n        label: \"Trace The House Crests\",\n        ability: \"dex\",\n        dc: 11,\n        success: () => \"Following carved crests from wall to wall shows you a clean route through the district's blind corners.\",\n        failure: () => \"The crests break off into too many shattered branches to give you anything useful.\"\n      }\n    ]\n  },\n  crafting_hall: {\n    sceneId: \"market\",\n    atmosphere: \"ordered workshop focus brightened by heat and metal song\",\n    scent: \"coal heat, ground herbs, machine oil, and hammered steel\",\n    sound: \"bellows breath, careful filing, and the ring of light strikes on the anvil\",\n    detail: \"filings sorted by color and a rune diagram weighted under a blackened wrench\",\n    investigation: \"a workbench sequence showing how the three sigils can be fixed into one stable ward\",\n    tags: [\"forge light\", \"herb racks\", \"rune dust\"],\n    rest: \"You lean against a warm stone wall and let the measured work sounds settle you.\",\n    water: \"Cool water from a copper jug cuts through the forge heat and wakes you back up.\",\n    journal: \"You write that the Crafting Hall is the one place in Neverwinter where chaos turns back into useful shape.\",\n    prayer: \"Even here, amid sparks and hammer-song, a quiet prayer feels like another kind of craft.\",\n    perceptionReward: {\n      itemId: \"iron_ore\",\n      qty: 1,\n      text: \"You notice a clean lump of iron tucked beneath the slag tray and set it aside.\"\n    },\n    investigationReward: {\n      itemId: \"ember_shard\",\n      qty: 1,\n      text: \"Working through the bench scraps, you recover a viable ember shard from a cracked crucible.\"\n    },\n    specialActions: [\n      {\n        id: \"sort_ingredients\",\n        label: \"Sort The Ingredients\",\n        ability: \"int\",\n        dc: 11,\n        success: () => \"Once sorted, the room's clutter reveals an elegant logic: every material here wants to become something greater.\",\n        failure: () => \"You tidy a few trays, then realize you have only moved the clutter into better-looking piles.\"\n      },\n      {\n        id: \"sketch_rune_pattern\",\n        label: \"Sketch A Rune Pattern\",\n        ability: \"wis\",\n        dc: 12,\n        success: () => \"Your sketch catches the rhythm of the sigils well enough that the final key no longer feels theoretical.\",\n        failure: () => \"The rune lines drift apart on the page before they resolve into anything stable.\"\n      }\n    ]\n  },\n  graveyard_road: {\n    sceneId: \"graves\",\n    atmosphere: \"cold vigilance stretched over old dead and newer fear\",\n    scent: \"wet earth, old stone dust, candle smoke, and cut yew\",\n    sound: \"wind through iron fencing, wingbeats, and your own steps sounding too loud\",\n    detail: \"new scratches on one mausoleum door and prayer strips tied where none should be\",\n    investigation: \"a patrol route interrupted by something that came and went through the graves without using the road\",\n    tags: [\"wet granite\", \"iron fence\", \"thin fog\"],\n    rest: \"You sit against a weathered angel statue and force your breathing back into a calm rhythm.\",\n    water: \"The water tastes flat in the cold air, but it clears the dryness fear leaves behind.\",\n    journal: \"You write that Neverdeath is not loud about danger. It simply lets you notice it a little too late.\",\n    prayer: \"You whisper a brief prayer for the living and the dead and feel your shoulders come down a fraction.\",\n    perceptionReward: {\n      gold: 4,\n      text: \"At the base of a cracked marker, you spot a coin-offering missed by the crows. It amounts to 4 gold.\"\n    },\n    investigationReward: {\n      itemId: \"healing_potion\",\n      qty: 1,\n      text: \"A sealed flask lies hidden in a caretaker niche. The cork is intact: a healing potion.\"\n    },\n    specialActions: [\n      {\n        id: \"read_epitaphs\",\n        label: \"Read The Epitaphs\",\n        ability: \"wis\",\n        dc: 10,\n        success: () => \"The repeated names and dates anchor you. Fear loses some of its teeth when you let the dead be people again.\",\n        failure: () => \"The words blur into stone, and the cold keeps leaning against the back of your neck.\"\n      },\n      {\n        id: \"steady_your_nerves\",\n        label: \"Steady Your Nerves\",\n        daily: true,\n        use: () => \"You plant your feet, count your breaths, and refuse to let the grave road rush you.\",\n        repeat: () => \"You have already forced yourself back to calm once today.\"\n      }\n    ]\n  },\n  sunken_pier: {\n    sceneId: \"docks\",\n    atmosphere: \"splintered structure and hidden movement under a skin of rot\",\n    scent: \"salt rot, wet rope, kelp, and old lamp fuel\",\n    sound: \"water slapping broken timber, chain taps, and the creak of boards deciding whether to hold\",\n    detail: \"a section of planks kept cleaner than the rest and tar rubbed fresh across a crate seam\",\n    investigation: \"a concealed stash point where smugglers swapped small valuable cargo rather than bulky freight\",\n    tags: [\"broken pilings\", \"slick planks\", \"contraband wakes\"],\n    rest: \"You take a careful seat on a dry crate and watch the water move beneath the broken boards.\",\n    water: \"You rinse the dock stink from your mouth with a long swallow and decide not to think about the water below you.\",\n    journal: \"You write that Sunken Pier feels one kick away from collapse, which makes it perfect for people who plan to leave in a hurry.\",\n    prayer: \"Your quiet prayer is half gratitude, half warning to yourself not to trust any plank you did not test.\",\n    perceptionReward: {\n      gold: 5,\n      text: \"Caught in a knot of rope, you find a smuggler's waterproof purse with 5 gold inside.\"\n    },\n    investigationReward: {\n      itemId: \"healing_potion\",\n      qty: 1,\n      text: \"Inside a tarred cache hidden under the boards, you recover a sealed healing potion.\"\n    },\n    specialActions: [\n      {\n        id: \"probe_waterline\",\n        label: \"Probe The Waterline\",\n        ability: \"int\",\n        dc: 11,\n        success: () => \"Marks on the pilings show where small boats were tied off for quick midnight transfers.\",\n        failure: () => \"The tide has blurred too much of the evidence into slime and guesswork.\"\n      },\n      {\n        id: \"test_the_planks\",\n        label: \"Test The Planks\",\n        ability: \"dex\",\n        dc: 10,\n        success: () => \"You find the safe path across the broken decking without a single bad step.\",\n        failure: () => \"One rotten plank gives way under your boot, and only a fast shift keeps you dry.\"\n      }\n    ]\n  },\n  mount_hotenow: {\n    sceneId: \"rift\",\n    atmosphere: \"heat-struck dread under a sky smeared with ember ash\",\n    scent: \"sulfur, hot stone, scorched cloth, and bitter mineral dust\",\n    sound: \"subterranean rumble, hissing vents, and sparks skittering in the wind\",\n    detail: \"runic scorch marks and a path where ash has fused into glass under repeated heat\",\n    investigation: \"ritual geometry carved into the stone around the rift, all of it designed to force the mountain to answer\",\n    tags: [\"sulfur wind\", \"glass-black ash\", \"ritual heat\"],\n    rest: \"You crouch behind a basalt shelf and wait until the shaking in your hands feels like readiness instead of fear.\",\n    water: \"The water in your skin tastes almost sweet after the ash. Even one swallow helps.\",\n    journal: \"You write that Mount Hotenow is less a place than an argument between stone and fire, and both sides are winning.\",\n    prayer: \"You speak a brief prayer into the hot wind and decide that courage does not need to be comfortable to count.\",\n    perceptionReward: {\n      itemId: \"ember_shard\",\n      qty: 1,\n      text: \"In a crack beside the path, you spot an ember shard still stable enough to pocket.\"\n    },\n    investigationReward: {\n      gold: 8,\n      text: \"You pry a heat-blackened coffer from a ritual niche and recover 8 gold fused inside.\"\n    },\n    specialActions: [\n      {\n        id: \"taste_the_ash\",\n        label: \"Taste The Ash In The Air\",\n        ability: \"con\",\n        dc: 11,\n        success: () => \"The ash is fresh, metallic, and directional. Something large moved through here only moments ago.\",\n        failure: () => \"The ash gets in your throat before it gives you anything useful.\"\n      },\n      {\n        id: \"read_the_rift\",\n        label: \"Read The Rift Lines\",\n        ability: \"int\",\n        dc: 13,\n        success: () => \"The carved channels make the truth plain: Vexira is not summoning chaos, she is disciplining it toward a single blow.\",\n        failure: () => \"The pattern writhes at the edge of comprehension, but never resolves before the heat drives you back.\"\n      }\n    ]\n  }\n};\n","src/data/items.js":"﻿export const ITEMS = {\n  iron_ore: { id: \"iron_ore\", name: \"Iron Ore\", type: \"material\", value: 8 },\n  moonleaf: { id: \"moonleaf\", name: \"Moonleaf\", type: \"material\", value: 10 },\n  ember_shard: { id: \"ember_shard\", name: \"Ember Shard\", type: \"material\", value: 14 },\n  sigil_tide: { id: \"sigil_tide\", name: \"Tidal Sigil\", type: \"quest\", value: 0 },\n  sigil_shadow: { id: \"sigil_shadow\", name: \"Shadow Sigil\", type: \"quest\", value: 0 },\n  sigil_flame: { id: \"sigil_flame\", name: \"Flame Sigil\", type: \"quest\", value: 0 },\n  warded_key: { id: \"warded_key\", name: \"Warded Key\", type: \"quest\", value: 0 },\n  healing_potion: { id: \"healing_potion\", name: \"Healing Potion\", type: \"consumable\", value: 18, heal: \"2d4+2\" },\n  revival_salt: { id: \"revival_salt\", name: \"Revival Salt\", type: \"consumable\", value: 30, revive: true },\n  steel_dagger: { id: \"steel_dagger\", name: \"Steel Dagger\", type: \"weapon\", value: 20 },\n  arcane_focus: { id: \"arcane_focus\", name: \"Arcane Focus\", type: \"gear\", value: 25 }\n};\n\nexport const SHOP_STOCK = [\n  { itemId: \"healing_potion\", cost: 18 },\n  { itemId: \"revival_salt\", cost: 30 },\n  { itemId: \"iron_ore\", cost: 8 },\n  { itemId: \"moonleaf\", cost: 10 },\n  { itemId: \"ember_shard\", cost: 14 }\n];\n","src/data/locations.js":"﻿export const LOCATIONS = [\n  {\n    id: \"protector_enclave\",\n    name: \"Protector's Enclave\",\n    description: \"The city center: banners, guards, and the pulse of high command.\",\n    travel: [\"market_square\", \"hall_of_justice\", \"dockward\", \"blacklake\"]\n  },\n  {\n    id: \"market_square\",\n    name: \"Market Square\",\n    description: \"Merchants shout prices over wagons of salvaged metal and herbs.\",\n    travel: [\"protector_enclave\", \"crafting_hall\"]\n  },\n  {\n    id: \"hall_of_justice\",\n    name: \"Hall of Justice\",\n    description: \"Marble halls where oaths, politics, and faith overlap.\",\n    travel: [\"protector_enclave\", \"graveyard_road\"]\n  },\n  {\n    id: \"dockward\",\n    name: \"Dockward\",\n    description: \"Salt spray, crooked lanterns, and eyes that never stop watching.\",\n    travel: [\"protector_enclave\", \"sunken_pier\"]\n  },\n  {\n    id: \"blacklake\",\n    name: \"Blacklake District\",\n    description: \"Ruined estates and hidden passageways haunted by old ambition.\",\n    travel: [\"protector_enclave\", \"graveyard_road\", \"mount_hotenow\"]\n  },\n  {\n    id: \"crafting_hall\",\n    name: \"Crafting Hall\",\n    description: \"An old smithy repurposed into a workshop for adventurers.\",\n    travel: [\"market_square\"]\n  },\n  {\n    id: \"graveyard_road\",\n    name: \"Neverdeath Approach\",\n    description: \"Fog and cracked stone mark the road to the city of graves.\",\n    travel: [\"hall_of_justice\", \"blacklake\", \"sunken_pier\"]\n  },\n  {\n    id: \"sun <body>
<div id="app">
  <div id="title-screen">
    <div class="title-main">Chronicles of the Sword Coast</div>
    <div class="title-sub">A Fantasy Browser RPG</div>
    <div class="title-divider"></div>
    <div class="title-buttons">
      <button class="btn btn-primary btn-lg" id="new-game-btn">New Adventure</button>
      <button class="btn btn-lg" id="load-btn" style="display:none">Continue Journey</button>
      <button class="btn btn-lg" id="title-help-btn">How To Play</button>
      <button class="btn btn-lg fullscreen-btn">Fullscreen (F)</button>
    </div>
    <div class="title-flavor">A modular rebuild from a recovered prototype snapshot.</div>
  </div>

  <div id="char-creation"></div>

  <div id="game-screen">
    <div class="game-header">
      <div class="location-display" id="location-name">Protector's Enclave, Neverwinter</div>
      <div class="char-brief" id="char-brief"></div>
      <div class="header-btns">
        <button class="btn btn-sm" id="toggle-sidebar-btn">Sheet</button>
        <button class="btn btn-sm" id="rest-btn">Rest</button>
        <button class="btn btn-sm" id="save-btn">Save</button>
        <button class="btn btn-sm" id="help-btn">Help</button>
        <button class="btn btn-sm fullscreen-btn">Fullscreen</button>
      </div>
    </div>

    <div class="game-body">
      <div class="game-main">
        <div class="scene-panel" id="scene-panel">
          <img class="scene-image" id="scene-image" alt="">
          <div class="scene-overlay">
            <div class="scene-kicker" id="scene-kicker"></div>
            <div class="scene-title" id="scene-title"></div>
            <div class="scene-caption" id="scene-caption"></div>
            <div class="scene-tags" id="scene-tags"></div>
          </div>
        </div>
        <div class="narrative-panel" id="narrative-panel">
          <div class="narrative-text" id="narrative"></div>
        </div>
        <div class="action-panel">
          <div class="actions" id="actions"></div>
        </div>
      </div>

      <aside class="game-sidebar" id="sidebar">
        <div class="sidebar-tabs" id="sidebar-tabs">
          <div class="sidebar-tab active" data-tab="character">Character</div>
          <div class="sidebar-tab" data-tab="inventory">Inventory</div>
          <div class="sidebar-tab" data-tab="quests">Quests</div>
          <div class="sidebar-tab" data-tab="spells">Spells</div>
          <div class="sidebar-tab" data-tab="log">Log</div>
          <div class="sidebar-tab" data-tab="help">Help</div>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-panel active" id="panel-character"></div>
          <div class="sidebar-panel" id="panel-inventory"></div>
          <div class="sidebar-panel" id="panel-quests"></div>
          <div class="sidebar-panel" id="panel-spells"></div>
          <div class="sidebar-panel" id="panel-log"></div>
          <div class="sidebar-panel" id="panel-help"></div>
        </div>
      </aside>
    </div>
  </div>
</div>

          return;

          creationModel.selected.notes = event.target.value;

      elements.actions.addEventListener("click", (event) => {

        if (!button) {
          return;
        }
        safeExecute(() => handleAction(button.dataset.actionId));
      });
      elements.saveBtn.addEventListener("click", () => {
        safeExecute(() => manualSave());

      elements.restBtn.addEventListener("click", () => {
        safeExecute(() => restParty());

      elements.helpBtn.addEventListener("click", () => {

        setSidebarTab("help");

      elements.toggleSidebarBtn.addEventListener("click", () => {
        elements.sidebar.classList.toggle("open");

          event.preventDefault();
          toggleFullscreen();
          return;
        }
        if (event.key === "s" && state) {
          event.preventDefault();
          manualSave();
          return;
        }
        if (event.key === "r" && state && !state.combat) {
          event.preventDefault();
          restParty();
          return;
        }
        if (!state && event.key === "l" && hasSave()) {

          const index = Number(event.key) - 1;

    function onSelectCreationOption(kind, id) {
      if (kind === "race") {

    function adjustAbility(ability, delta) {
      if (!ABILITY_KEYS2.includes(ability) || ![-1, 1].includes(delta)) {
        return;

      const current = creationModel.abilities[ability];
      const candidate = current + delta;
      if (candidate < 8 || candidate > 15) {
        return;
      }
      const currentRemaining = getCreationPointsRemaining();
      if (delta > 0 && currentRemaining <= 0) {
        return;

      creationModel.abilities[ability] = candidate;

    function normalizeState(loadedState) {

      if (!nextState.ui.activeSidebarTab) {

      if (!nextState.ui.mode) {
        nextState.ui.mode = "default";

      if (!Array.isArray(nextState.log)) {
        nextState.log = [];
      }
      if (!nextState.world.cooldowns || typeof nextState.world.cooldowns !== "object") {
        nextState.world.cooldowns = {};
      }
      if (!nextState.world.discoveries || typeof nextState.world.discoveries !== "object") {
        nextState.world.discoveries = {};
      }
      if (!nextState.player.status) {
        nextState.player.status = { markDice: null, markTurns: 0, acBoostTurns: 0 };
      }
      if (typeof nextState.player.tempHp !== "number") {

      );

    function buildActions() {
      if (!state) {
        return [];

      if (state.world.ending === "victory") {
        return [
          { id: "ending:return", label: "Return To Title", variant: "" },
          { id: "ending:continue", label: "Continue Exploring", variant: "" }
        ];
      }
      if (state.combat) {
        return buildCombatActions();
      }
      if (state.ui.mode === "shop") {
        return buildShopActions();
      }
      if (state.ui.mode === "craft") {
        return buildCraftActions();
      }

    function buildWorldActions() {
      const location = locationLookup[state.world.locationId];
      const actions = [];
      const npcsHere = NPCS.filter((npc) => npc.locationId === location.id);
      npcsHere.forEach((npc) => {
        actions.push({ id: `talk:${npc.id}`, label: `Talk: ${npc.name}` });
      });
      const encounter = ENCOUNTERS[location.id];
      if (encounter && !state.world.flags[encounter.flagReward]) {
        actions.push({ id: `encounter:${location.id}`, label: `Face Encounter: ${encounter.title}`, variant: " btn-danger" });
      }
      if (location.id === "mount_hotenow" && canChallengeBoss()) {
        actions.push({ id: "boss:start", label: "Confront Vexira", variant: " btn-primary" });
      }
      if (location.id === "mount_hotenow" && !canChallengeBoss() && !state.world.flags.defeatedVexira) {
        const needed = [];
        if (!state.world.flags.forgedWardedKey) {
          needed.push("Warded Key");
        }
        if (!allSigilsRecovered()) {
          needed.push("all three Sigils");
        }
        if (needed.length) {
          actions.push({
            id: "boss:locked",
            label: `Vexira's barrier requires ${needed.join(" and ")}`,
            disabled: true
          });
        }
      }
      if (location.id === "market_square") {
        actions.push({ id: "mode:shop", label: "Open Market", variant: "" });
      }
      if (location.id === "crafting_hall") {
        actions.push({ id: "mode:craft", label: "Use Crafting Bench", variant: "" });

      actions.push({ id: "quest:status", label: "Quest Status", variant: "" });

      return [...GLOBAL_AMBIENT_ACTIONS, ...locationActions].map((action) => ({
        id: `ambient:${action.id}`,

        variant: " btn-quiet",

    function findAmbientAction(locationId, actionId) {

    function performAmbientAction(actionId) {

      const action = findAmbientAction(location.id, actionId);

        return;

      const context = { action, ambience, location };
      const cooldownKey = `daily:${action.id}`;
      if (action.daily && state.world.cooldowns[cooldownKey] === state.world.day) {

      }
      if (action.id === "perception_sweep") {
        grantAmbientReward(context.ambience.perceptionReward, `perception:${context.location.id}`);

      }
      if (action.id === "investigate_area") {
        grantAmbientReward(context.ambience.investigationReward, `investigation:${context.location.id}`);
        return;
      }
      if (action.id === "sit_and_watch") {

        }

      if (reward.heal) {

    function buildCombatActions() {

    function handleAction(actionId) {

        return;

        handleCraftAction(actionId);

        return;

      if (actionId.startsWith("travel:")) {

      }
      if (actionId.startsWith("talk:")) {

        return;

    function handleShopAction(actionId) {
      if (actionId === "shop:exit") {
        state.ui.mode = "default";
        gameMessage("You leave the market stalls.", "system", true);
        return;
      }
      const itemId = actionId.replace("shop:buy:", "");
      const stock = SHOP_STOCK.find((entry) => entry.itemId === itemId);
      if (!stock) {
        return;
      }
      if (state.player.gold < stock.cost) {
        gameMessage("Not enough gold.", "failure", true);
        return;
      }
      state.player.gold -= stock.cost;
      addItem(state, itemId, 1);
      gameMessage(`Purchased ${ITEMS[itemId].name}.`, "loot", true);
    }
    function handleCraftAction(actionId) {
      if (actionId === "craft:exit") {
        state.ui.mode = "default";
        gameMessage("You step away from the crafting bench.", "system", true);
        return;
      }
      const recipeId = actionId.replace("craft:make:", "");
      const recipe = RECIPES.find((entry) => entry.id === recipeId);
      if (!recipe) {
        return;
      }
      if (!hasItems(state, recipe.requires)) {
        gameMessage("Missing ingredients.", "failure", true);
        return;
      }
      recipe.requires.forEach((req) => {
        removeItem(state, req.itemId, req.qty);
      });
      addItem(state, recipe.resultItemId, recipe.resultQty);
      if (recipe.resultItemId === "warded_key") {
        state.world.flags.forgedWardedKey = true;
        gameMessage("The Warded Key hums with layered sigil magic.", "success", true);
      } else {
        gameMessage(`Crafted ${ITEMS[recipe.resultItemId].name}.`, "success", true);
      }
    }
    function travelTo(destinationId) {
      const location = locationLookup[state.world.locationId];
      if (!location.travel.includes(destinationId)) {
        gameMessage("That route is unavailable from here.", "failure", true);
        return;
      }
      state.world.locationId = destinationId;
      state.ui.mode = "default";
      if (!state.world.discovered.includes(destinationId)) {
        state.world.discovered.push(destinationId);
      }
      const destination = locationLookup[destinationId];
      gameMessage(`You travel to ${destination.name}.`, "prose", true);
      gameMessage(destination.description, "system", true);
    }
    function talkToNpc(npcId) {
      const npc = npcLookup[npcId];
      if (!npc) {
        return;
      }
      gameMessage(`${npc.name}: ${npc.greeting}`, "dialogue", true);
      switch (npcId) {
        case "serra":
          if (!state.world.flags.acceptedMainQuest) {
            state.world.flags.acceptedMainQuest = true;
            activateQuest("main_quest");
            gameMessage(
              "Serra assigns you to recover three ward sigils before Vexira ignites the rift.",
              "system",
              true
            );
          } else if (state.world.flags.defeatedVexira) {
            gameMessage("Serra salutes: Neverwinter holds because you stood your ground.", "dialogue", true);
          } else {
            gameMessage(getMainQuestStageText(), "system", true);
          }
          break;
        case "tormund":
          if (!state.world.flags.smugglerBriefed) {
            state.world.flags.smugglerBriefed = true;
            activateQuest("smuggler_chain");
            gameMessage("Tormund marks a smuggler cache at Sunken Pier.", "system", true);
          } else {
            gameMessage(getSmugglerQuestText(), "system", true);
          }
          break;
        case "whisper":
        case "kael":
          if (state.quests.active.includes("smuggler_chain") && state.world.flags.smugglerCleared) {
            completeQuest("smuggler_chain");
            state.player.gold += 35;
            addItem(state, "healing_potion", 1);
            gameMessage("Your intel payment arrives: 35 gold and one potion.", "loot", true);
          }
          break;
        case "miri":
          if (!state.world.flags.miriGiftGiven) {
            state.world.flags.miriGiftGiven = true;
            addItem(state, "moonleaf", 1);
            gameMessage("Miri slips you fresh moonleaf for the road.", "loot", true);
          } else {
            gameMessage("Miri: If you have the sigils and materials, forge the Warded Key here.", "dialogue", true);
          }
          break;
        case "elira": {
          const healAmount = 4;
          const before = state.player.hp;
          state.player.hp = Math.min(state.player.maxHp, state.player.hp + healAmount);
          const restored = state.player.hp - before;
          if (restored > 0) {
            gameMessage(`Elira offers a blessing and restores ${restored} HP.`, "success", true);
          }
          break;
        }
        case "neverember":
          if (!state.world.flags.acceptedMainQuest) {
            gameMessage("Neverember: Serra will brief you. The city cannot wait.", "dialogue", true);
          } else {
            gameMessage("Neverember: Act quickly. Vexira's ritual grows stronger by the day.", "dialogue", true);
          }
          break;
        case "vexira":
          gameMessage("Vexira: Bring your key and your courage. Both will burn.", "dialogue", true);
          break;
        default:
          break;
      }
    }
    function beginEncounter(locationId) {
      const encounter = ENCOUNTERS[locationId];
      if (!encounter) {
        gameMessage("No encounter is available here.", "system", true);
        return;
      }
      if (state.world.flags[encounter.flagReward]) {
        gameMessage("This district has already been secured.", "system", true);
        return;
      }
      startCombat(encounter.enemy, {
        title: encounter.title,
        description: encounter.description,
        flagReward: encounter.flagReward,
        encounterId: encounter.id,
        isBoss: false
      });
    }
    function beginBossFight() {
      if (!canChallengeBoss()) {
        gameMessage("You are not ready to breach Vexira's barrier.", "failure", true);
        return;
      }
      startCombat(FINAL_BOSS, {
        title: "Final Battle",
        description: "Vexira tears open the ash storm and advances.",
        flagReward: null,
        encounterId: "vexira_boss",
        isBoss: true
      });
    }
    function canChallengeBoss() {
      return allSigilsRecovered() && state.world.flags.forgedWardedKey && !state.world.flags.defeatedVexira;
    }
    function allSigilsRecovered() {
      return state.world.flags.tide_sigil_won && state.world.flags.shadow_sigil_won && state.world.flags.flame_sigil_won;
    }
    function startCombat(enemyTemplate, meta) {
      state.ui.mode = "default";
      state.combat = {
        enemy: {
          ...enemyTemplate,
          maxHp: enemyTemplate.hp,
          hp: enemyTemplate.hp
        },
        meta
      };
      gameMessage(`${meta.title}: ${meta.description}`, "combat-msg", true);
    }
    function handleCombatAction(actionId) {
      if (!state.combat) {
        return;
      }
      if (actionId === "combat:attack") {
        playerWeaponAttack();
        return;
      }
      if (actionId === "combat:potion") {
        useHealingPotion();
        return;
      }
      if (actionId === "combat:flee") {
        attemptFlee();
        return;
      }
      if (actionId.startsWith("combat:spell:")) {
        castSpell(actionId.replace("combat:spell:", ""));
      }
    }
    function playerWeaponAttack() {
      const classDef = classLookup[state.player.classId];
      const enemy = state.combat.enemy;
      const attackRoll = rollDie(20);
      const attackBonus = abilityMod(state.player.abilities[classDef.primaryAbility]) + 2;
      const totalAttack = attackRoll + attackBonus;
      if (attackRoll === 1 || totalAttack < enemy.ac) {
        gameMessage(`Attack roll ${attackRoll} + ${attackBonus} = ${totalAttack}. Miss.`, "roll-result", true);
        enemyTurn();
        return;
      }
      let damage = rollExpr(classDef.weaponDamage).total;
      if (attackRoll === 20) {
        damage += rollExpr(classDef.weaponDamage).total;
      }
      damage += consumeMarkDamage();
      enemy.hp = Math.max(0, enemy.hp - damage);
      gameMessage(`Attack roll ${attackRoll} + ${attackBonus} = ${totalAttack}. Hit for ${damage}.`, "roll-result", true);
      if (enemy.hp <= 0) {
        resolveCombatVictory();
        return;
      }
      enemyTurn();
    }
    function castSpell(spellId) {
      const spell = spellLookup[spellId];
      if (!spell) {
        return;
      }
      if (spell.type === "slot") {
        if (state.player.spellSlots.current <= 0) {
          gameMessage("No spell slots available.", "failure", true);
          return;
        }
        state.player.spellSlots.current -= 1;
      }
      const enemy = state.combat.enemy;
      if (spell.damage) {
        let damage = 0;
        if (spell.id === "sacred_flame") {
          const saveRoll = rollDie(20) + 2;
          if (saveRoll < 13) {
            damage = rollExpr(spell.damage).total;
          }
          gameMessage(`Sacred Flame save check: ${saveRoll}.`, "roll-result", true);
        } else {
          damage = rollExpr(spell.damage).total;
        }
        damage += consumeMarkDamage();
        if (damage > 0) {
          enemy.hp = Math.max(0, enemy.hp - damage);
          gameMessage(`${spell.name} deals ${damage} damage.`, "success", true);
        } else {
          gameMessage(`${spell.name} fails to connect.`, "failure", true);
        }
      }
      if (spell.effect === "heal") {
        const heal = rollExpr(spell.amount).total;
        const before = state.player.hp;
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
        gameMessage(`${spell.name} restores ${state.player.hp - before} HP.`, "success", true);
      }
      if (spell.effect === "ac_boost") {
        state.player.status.acBoostTurns = 1;
        gameMessage("Arcane shield surrounds you until the next enemy turn.", "success", true);
      }
      if (spell.effect === "temp_hp") {
        state.player.tempHp = Math.max(state.player.tempHp, spell.amount);
        gameMessage(`You gain ${spell.amount} temporary HP.`, "success", true);
      }
      if (spell.effect === "mark") {
        state.player.status.markDice = spell.amount;
        state.player.status.markTurns = 3;
        gameMessage("Target is marked for extra damage on your next hits.", "success", true);
      }
      if (enemy.hp <= 0) {
        resolveCombatVictory();
        return;
      }
      enemyTurn();
    }
    function consumeMarkDamage() {
      if (!state.player.status.markDice || state.player.status.markTurns <= 0) {
        return 0;
      }
      state.player.status.markTurns -= 1;
      const bonus = rollExpr(state.player.status.markDice).total;
      if (state.player.status.markTurns <= 0) {
        state.player.status.markDice = null;
      }
      gameMessage(`Mark effect adds ${bonus} damage.`, "roll-result", true);
      return bonus;
    }
    function useHealingPotion() {
      const item = findInventoryItem(state, "healing_potion");
      if (!item || item.qty <= 0) {
        gameMessage("No healing potion available.", "failure", true);
        return;
      }
      removeItem(state, "healing_potion", 1);
      const heal = rollExpr(ITEMS.healing_potion.heal).total;
      const before = state.player.hp;
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
      gameMessage(`You drink a potion and recover ${state.player.hp - before} HP.`, "success", true);
      enemyTurn();
    }
    function attemptFlee() {
      const check = rollDie(20) + abilityMod(state.player.abilities.dex);
      if (check >= 13) {
        state.combat = null;
        gameMessage(`Escape check ${check}: success. You break away from combat.`, "system", true);
        return;
      }
      gameMessage(`Escape check ${check}: failed.`, "failure", true);
      enemyTurn();
    }
    function enemyTurn() {
      if (!state.combat) {
        return;
      }
      const enemy = state.combat.enemy;
      const defensiveBoost = state.player.status.acBoostTurns > 0 ? 3 : 0;
      const ac = state.player.ac + defensiveBoost;
      const roll = rollDie(20);
      const total = roll + enemy.attackBonus;
      if (roll === 1 || total < ac) {
        gameMessage(`${enemy.name} attack ${roll} + ${enemy.attackBonus} = ${total}. Miss.`, "roll-result", true);
      } else {
        const damage = rollExpr(enemy.damage).total;
        applyDamageToPlayer(damage);
        gameMessage(`${enemy.name} hits for ${damage} damage.`, "combat-msg", true);
      }
      if (state.player.status.acBoostTurns > 0) {
        state.player.status.acBoostTurns -= 1;
      }
      if (state.player.hp <= 0) {
        handlePlayerDefeat();
      }
    }
    function applyDamageToPlayer(damage) {
      let remaining = damage;
      if (state.player.tempHp > 0) {
        const absorbed = Math.min(state.player.tempHp, remaining);
        state.player.tempHp -= absorbed;
        remaining -= absorbed;
      }
      if (remaining > 0) {
        state.player.hp = Math.max(0, state.player.hp - remaining);
      }
    }
    function handlePlayerDefeat() {
      if (removeItem(state, "revival_salt", 1)) {
        state.player.hp = Math.max(1, Math.floor(state.player.maxHp / 3));
        state.combat = null;
        gameMessage("Revival Salt drags you back from death's edge.", "success", true);
        return;
      }
      state.combat = null;
      const lostGold = Math.min(15, state.player.gold);
      state.player.gold -= lostGold;
      state.player.hp = Math.max(1, Math.floor(state.player.maxHp / 2));
      state.player.spellSlots.current = Math.min(1, state.player.spellSlots.max);
      state.world.locationId = "hall_of_justice";
      state.world.day += 1;
      gameMessage(
        `You collapse and awaken in the Hall of Justice infirmary. Penalty: -${lostGold} gold and one lost day.`,
        "failure",
        true
      );
    }
    function resolveCombatVictory() {
      if (!state.combat) {
        return;
      }
      const enemy = state.combat.enemy;
      const meta = state.combat.meta;
      state.player.gold += enemy.gold;
      gameMessage(`Victory over ${enemy.name}.`, "success", true);
      gameMessage(`Looted ${enemy.gold} gold.`, "loot", true);
      enemy.loot.forEach((itemId) => {
        addItem(state, itemId, 1);
        const item = ITEMS[itemId];
        if (item) {
          gameMessage(`Loot: ${item.name}.`, "loot", true);
        }
      });
      const leveledUp = gainXp(state, enemy.xp);
      gameMessage(`XP gained: ${enemy.xp}.`, "xp-gain", true);
      if (leveledUp) {
        gameMessage(`Level up! You are now level ${state.player.level}.`, "success", true);
        state.player.spellSlots.current = state.player.spellSlots.max;
      }
      if (meta.flagReward) {
        state.world.flags[meta.flagReward] = true;
      }
      if (meta.encounterId === "sunken_pier_skirmish" && state.world.flags.smugglerBriefed) {
        state.world.flags.smugglerCleared = true;
      }
      if (meta.isBoss) {
        state.world.flags.defeatedVexira = true;
        state.world.ending = "victory";
        completeQuest("main_quest");
        gameMessage("Chapter Complete: Vexira falls and the rift stabilizes.", "chapter", true);
        gameMessage("You have secured a full victory path from start to ending.", "success", true);
      }
      state.combat = null;
      checkQuestMilestones();
    }
    function checkQuestMilestones() {
      if (allSigilsRecovered() && !state.world.flags.sigilsAnnounced) {
        state.world.flags.sigilsAnnounced = true;
        gameMessage("All three sigils are recovered. Forge the Warded Key in the Crafting Hall.", "system", true);
      }
      if (state.world.flags.forgedWardedKey && !state.world.flags.keyAnnounced) {
        state.world.flags.keyAnnounced = true;
        gameMessage("Warded Key forged. Travel to Mount Hotenow and challenge Vexira.", "system", true);
      }
    }
    function restParty() {
      if (!state || state.combat) {
        return;
      }
      const restCost = 8;
      if (state.player.gold < restCost) {
        gameMessage(`Rest costs ${restCost} gold. You do not have enough.`, "failure", true);
        renderGame();
        return;
      }
      state.player.gold -= restCost;
      state.player.hp = state.player.maxHp;
      state.player.tempHp = 0;
      state.player.spellSlots.current = state.player.spellSlots.max;
      state.world.day += 1;
      gameMessage(`You complete a long rest. -${restCost} gold.`, "success", true);
      renderGame();
    }
    function activateQuest(questId) {
      if (state.quests.completed.includes(questId)) {
        return;
      }
      if (!state.quests.active.includes(questId)) {
        state.quests.active.push(questId);
      }
    }
    function completeQuest(questId) {
      state.quests.active = state.quests.active.filter((id) => id !== questId);
      if (!state.quests.completed.includes(questId)) {
        state.quests.completed.push(questId);
      }
    }
    function getQuestStageTextMap() {
      const map = {};
      if (state.quests.active.includes("main_quest")) {
        map.main_quest = getMainQuestStageText();
      }
      if (state.quests.active.includes("smuggler_chain")) {
        map.smuggler_chain = getSmugglerQuestText();
      }
      return map;
    }
    function getMainQuestStageText() {
      if (!state.world.flags.acceptedMainQuest) {
        return "Speak with Captain Serra in Protector's Enclave.";
      }
      if (!allSigilsRecovered()) {
        const missing = [];
        if (!state.world.flags.tide_sigil_won) {
          missing.push("Tidal Sigil");
        }
        if (!state.world.flags.shadow_sigil_won) {
          missing.push("Shadow Sigil");
        }
        if (!state.world.flags.flame_sigil_won) {
          missing.push("Flame Sigil");
        }
        return `Recover remaining sigils: ${missing.join(", ")}.`;
      }
      if (!state.world.flags.forgedWardedKey) {
        return "Craft the Warded Key in the Crafting Hall.";
      }
      if (!state.world.flags.defeatedVexira) {
        return "Travel to Mount Hotenow and defeat Vexira.";
      }
      return "Return to Protector's Enclave and report success.";
    }
    function getSmugglerQuestText() {
      if (!state.world.flags.smugglerBriefed) {
        return "Speak with Tormund in Blacklake.";
      }
      if (!state.world.flags.smugglerCleared) {
        return "Defeat the smuggler cell at Sunken Pier.";
      }
      return "Collect your reward from Whisper or Kael.";
    }
    function gameMessage(text, type, includeInLog) {
      appendNarrative(text, type);
      if (includeInLog && state) {
        state.log.push(`[Day ${state.world.day}] ${text}`);
        if (state.log.length > 300) {
          state.log = state.log.slice(-300);
        }
      }
    }
    function applyRaceBonuses(baseAbilities, bonuses) {
      const result = { ...baseAbilities };
      Object.keys(bonuses).forEach((key) => {
        result[key] += bonuses[key];
      });
      return result;
    }
    function toLookup(list) {
      return list.reduce((acc, item) => {
        acc[item.id] = item;
        return acc;
      }, {});
    }
    window.render_game_to_text = renderGameToText;
    window.advanceTime = () => {
      if (state) renderGame();
      return renderGameToText();
    };
  }
});
export default require_main();
</script>
