A D&amp;D 5th Edition Adventure\u003c/div>\n  \u003cdiv class=\"title-divider\">\u003c/div>\n  \u003cdiv class=\"title-buttons\">\n    \u003cbutton class=\"btn btn-primary btn-lg\" onclick=\"startNewGame()\">⚔️ New Adventure\u003c/button>\n    \u003cbutton class=\"btn btn-lg\" onclick=\"loadGame()\" id=\"load-btn\" style=\"display:none\">📖 Continue Journey\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"title-flavor\">\"Not all who wander are lost — but in Neverwinter, it helps to keep your sword close.\"\u003c/div>\n\u003c/div>\n\n\u003c!-- ==================== CHARACTER CREATION ==================== -->\n\u003cdiv id=\"char-creation\">\u003c/div>\n\n\u003c!-- ==================== GAME SCREEN ==================== -->\n\u003cdiv id=\"game-screen\">\n  \u003cdiv class=\"game-header\">\n    \u003cdiv class=\"location-display\" id=\"location-name\">Protector's Enclave, Neverwinter\u003c/div>\n    \u003cdiv class=\"char-brief\" id=\"char-brief\">\u003c/div>\n    \u003cdiv class=\"header-btns\">\n      \u003cbutton class=\"btn btn-sm\" onclick=\"toggleSidebar()\">☰ Sheet\u003c/button>\n      \u003cbutton class=\"btn btn-sm\" onclick=\"showRestDialog()\">🏕️ Rest\u003c/button>\n      \u003cbutton class=\"btn btn-sm\" onclick=\"saveGame()\">💾 Save\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"game-body\">\n    \u003cdiv class=\"game-main\">\n      \u003cdiv class=\"narrative-panel\" id=\"narrative-panel\">\n        \u003cdiv class=\"narrative-text\" id=\"narrative\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"action-panel\">\n        \u003cdiv class=\"actions\" id=\"actions\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"game-sidebar\" id=\"sidebar\">\n      \u003cdiv class=\"sidebar-tabs\">\n        \u003cdiv class=\"sidebar-tab active\" onclick=\"switchSidebarTab('character')\">Character\u003c/div>\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('inventory')\">Inventory\u003c/div>\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('quests')\">Quests\u003c/div>\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('spells')\">Spells\u003c/div>\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('log')\">Log\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"sidebar-content\">\n        \u003cdiv class=\"sidebar-panel active\" id=\"panel-character\">\u003c/div>\n        \u003cdiv class","PLAN.md":"﻿# PLAN\n\n## Current status (2026-04-12)\n- Only source file found: `DNDGAME.txt`.\n- File contains narrative text + an opening ```html fence + partial HTML/CSS.\n- Snapshot is truncated mid-tag and does not include any JavaScript logic.\n\n## Checkpoint progress\n- Phase 1 complete: recovered assets, modular file structure created, legacy snapshot preserved.\n- Phase 2 complete: runnable baseline runtime implemented (state, save/load, exploration, dialogue, combat, crafting, boss path).\n\n## Goals\n1. Recover a runnable baseline from the available snapshot.\n2. Refactor into modular browser project files.\n3. Rebuild/complete missing systems and content in a data-driven way.\n4. Stabilize save/load, combat, quests, and UX for end-to-end playability.\n\n## Phases\n\n### Phase 1: Recovery + Structure\n- Extract recoverable CSS and HTML shell into project files.\n- Preserve a legacy snapshot for reference.\n- Create modular folders (`src/core`, `src/data`, `src/ui`, `styles`).\n- Produce `BUGS.md` with known blockers from the truncated source.\n\n### Phase 2: Core Runtime (safe baseline)\n- Implement a minimal game engine with explicit state object.\n- Implement robust save/load with versioned schema.\n- Implement title screen -> character creation -> game loop transitions.\n- Implement sidebar rendering and action routing with guardrails.\n\n### Phase 3: Content Completion\n- Add remaining NPCs (Whisper, Neverember, Vexira, Tormund, Miri) and existing core NPC set.\n- Add location encounters and complete quest progression path.\n- Add crafting recipes/materials and integration with quest progression.\n- Add final boss and ending states.\n\n### Phase 4: Hardening + UX\n- Dead-end prevention and fail/recovery path.\n- Synchronize quest flags, inventory deltas, combat/rest/spell state.\n- Improve prompts, feedback, and help panel.\n- Mobile-safe layout checks and keyboard-friendly controls where practical.\n\n### Phase 5: Verification + Documentation\n- Smoke test start-to-finish flow.\n- Document structure, save format, and content authoring in `README.md`.\n- Record known limitations and future enhancements.\n\n## Immediate checkpoint target\n- Complete Phase 1 and Phase 2 with a runnable modular baseline.\n","Pasted text.txt":"     ]\n   827       },\n   828       final_appeal: {\n   829         speech: \"*stops* ...I've walked too far down this road to turn bac\n       k. The dragon would kill me. I have no other path. *raises weapon, but wit\n       h less conviction* Forgive me.\",\n   830         choices: [\n   831           { text: \"Fight.\", next: \"fight\", triggerCombat: \"vexira_act3\" },\n   832           { text: \"[CHA 18] There is always another path.\", next: \"appeal\"\n       , skillCheck: {skill:\"cha\",dc:18} }\n   833         ]\n   834       },\n   835       appeal: {\n   836         speech: \"...*long silence* I... *the violet light dims slightly* Y\n       ou speak truth. I started this because I believed in something. Not... not\n        this. *her hands lower* But it's too late. The dragon will kill me whethe\n       r I complete the ritual or not now. I just wanted to matter.\",\n   837         choices: [\n   838           { text: \"Then help me face the dragon. Together.\", next: \"vexira\n       _ally\", morality: 8 },\n   839           { text: \"Tell me how to break the ritual.\", next: \"ritual_break_\n       info\" }\n   840         ]\n   841       },\n   842       vexira_ally: {\n   843         speech: \"*looks up with something fragile in her \",\"a\n       cid_breath\"], breathDC: 14, isBoss: true, isDragon: true, loot: [{item:\"dragon_scale\n       \",chance:1.0}] }\n   162 };\n   163\n   164 const LEVEL_THRESHOLDS = [0, 300, 900, 2700, 6500, 14000];\n   165\n   166 // NPC dialogue state tracking\n   167 const NPC_DATA = {\n   168   elara: {\n   169     name: \"Elara\", emoji: \"🍺\", title: \"Innkeeper of the Fallen Star\",\n   170     portrait: \"🍺\", faction: \"lords\",\n   171     states: {\n   172       initial: {\n   173         speech: \"Welcome to the Fallen Star, traveler! You look like you've had a lo\n       ng journey. I'm Elara — I've run this inn for twenty years. Pull up a chair and rest\n        your bones. Though I'll warn you... Neverwinter isn't as peaceful as it used to be.\n       \",\n   174         choices: [\n   175           { text: \"What's been happening in Neverwinter?\", next: \"trouble\" },\n   176           { text: \"Tell me about the sick children.\", next: \"sick_children\" },\n   177           { text: \"I'm looking for work.\", next: \"work\" },\n   178           { text: \"Just passing through.\", next: \"farewell\" }\n   179         ]\n   180       },\n   181       trouble: {\n   182         speech: \"Trouble, that's what. Three weeks ago, the children in the Blacklak\n       e Ward started falling ill. Strange sickness — high fever, black veins on their skin\n       . The healers are baffled. And then there's the smugglers at the docks. I've heard t\n       hings... dark things about what they're moving through Neverwinter.\",\n   183         choices: [\n   184           { text: \"Tell me more about the sick children.\", next: \"sick_children\" },\n   185           { text: \"Who are the smugglers?\", next: \"smugglers\" },\n   186           { text: \"I'll look into it.\", next: \"quest_accept\", questId: \"sick_childre\n       n\", morality: 5 }\n   187         ]\n   188       },\n   189       sick_children: {\n   190         speech: \"Twelve children, all under ten years old. Their parents are despera\n       te — they've tried every healer in the city. The symptoms are unlike any natural dis\n       ease: black lines spreading from the heart, and they whisper in their sleep... in a\n       language nobody recognizes. Miri, a field healer who camps in the Cloakwood, might k\n       now something. But getting to her means braving the forest.\",\n   191         choices: [\n   192           { text: \"I'll find Miri and get answers.\", next: \"miri_quest\", questId: \"f\n       ind_miri\", morality: 5 },\n   193           { text: \"What reward is offered?\", next: \"reward\" },\n   194           { text: \"This sounds too dangerous.\", next: \"farewell\" }\n   195         ]\n   196       },\n   197       miri_quest: {\n   198         speech: \"Bless you. Truly. I knew there was something good in you the moment\n        you walked through that door. Miri's camp is in the eastern Cloakwood, near the old\n        standing stones. She knows plants and curses both. If anyone can identify this ailm\n       ent, it's her. Take this purse — it's all I've saved. And please... hurry.\",\n   199         choices: [\n   200           { text: \"I'll leave immediately.\", next: \"farewell\", giveGold: 30 },\n   201           { text: \"Any other advice before I go?\", next: \"advice\" }\n   202         ]\n   203       },\n   204       smugglers: {\n   205         speech: \"I've seen men from the docks — rough types with the Black Network b\n       rand. The Zhentarim. They've been moving crates through the harbor at night. Ask Gar\n       rett the spice merchant; he has a stall near the pier. He's terrified of them but he\n       's seen things. Careful though — they have eyes everywhere.\",\n   206         choices: [\n   207           { text: \"I'll talk to Garrett.\", next: \"farewell\" },\n   208           { text: \"Tell me more.\", next: \"trouble\" }\n   209         ]\n   210       },\n   211       work: {\n   212         speech: \"Ha! Honest answer. Truth be told, the whole city needs help right n\n       ow. Lord Neverember's posted a bounty on Zhentarim agents — ten gold each. And there\n       's the matter of the sick children. Helping with either would earn you coin, friends\n       , and maybe a warm bed. What do you say?\",\n   213         choices: [\n   214           { text: \"Tell me about the sick children.\", next: \"sick_children\" },\n   215           { text: \"The Zhentarim bounty sounds good.\", next: \"smugglers\" },\n   216           { text: \"I'll think about it.\", next: \"farewell\" }\n   217         ]\n   218       },\n   219       reward: {\n   220         speech: \"The parents have pooled together fifty gold, and Lord Neverember hi\n       mself has offered an audience if the plague is stopped. An audience with the Lord of\n        Neverwinter — that's worth more than gold to some folk.\",\n   221         choices: [\n   222           { text: \"I'll do it.\", next: \"miri_quest\", questId: \"find_miri\", morality:\n        3 },\n   223           { text: \"I need more information first.\", next: \"trouble\" }\n   224         ]\n   225       },\n   226       advice: {\n   227         speech: \"Keep your wits about you. The Cloakwood isn't just dangerous from t\n       he undead — there are cultist patrols between here and there. And whatever you do, d\n       on't drink the black water. The streams near the ruins run dark these days.\",\n   228         choices: [\n   229           { text: \"Thank you, Elara.\", next: \"farewell\" }\n   230         ]\n   231       },\n   232       farewell: {\n   233         speech: \"Safe travels, friend. The gods watch over brave souls. Come back to\n        me alive — this inn could use more heroes and fewer corpses.\",\n   234         choices: []\n   235       }\n   236     }\n   237   },\n   238   garrett: {\n   239     name: \"Garrett\", emoji: \"💰\", title: \"Spice Merchant\",\n   240     portrait: \"💰\", faction: \"lords\",\n   241     states: {\n   242       initial: {\n   243         speech: \"Please, keep your voice down! I'm just a merchant, I don't want any\n        trouble. Whatever you've heard about me — it isn't true. I sell spices. Just spices\n       . Now please, buy something or move along.\",\n   244         choices: [\n   245           { text: \"I know about the Zhentarim shipments.\", next: \"zhentarim_approach\n       \" },\n   246           { text: \"I'm not here to cause trouble. Tell me what you've seen.\", next:\n       \"gentle_approach\" },\n   247           { text: \"[PERSUASION] You're scared. Let me help you.\", next: \"persuade\",\n       skillCheck: {skill:\"cha\", dc:13} },\n   248           { text: \"[COIN] Here's 20 gold for information.\", next: \"bribe\", cost: 20\n       }\n   249         ]\n   250       },\n   251       zhentarim_approach: {\n   252         speech: \"Keep your voice down! *looks around frantically* How do you know ab\n       out that? I... I've seen things I shouldn't have. Crates moving at night. Alchemical\n        ingredients — wolf's bane, void salts, black lotus. The kind of things used in dark\n        rituals. But if I tell you more, they'll kill me!\",\n   253         choices: [\n   254           { text: \"I can protect you. Tell me where the warehouse is.\", next: \"wareh\n       ouse_info\", morality: 3 },\n   255           { text: \"You're already in danger. Help me stop them.\", next: \"full_info\"\n       },\n   256           { text: \"The Zhentarim will come for you either way.\", next: \"full_info\" }\n   257         ]\n   258       },\n   259       gentle_approach: {\n   260         speech: \"... You have kind eyes. Not like theirs. *sighs* I've been watching\n        the docks for months. Men in black cloaks moving crates by night. I tracked one shi\n       pment — it went to the old ruins east of the city. But that's all I know. I swear it\n       .\",\n   261         choices: [\n   262           { text: \"That's more than enough. Thank you.\", next: \"warehouse_info\" },\n   263           { text: \"Can you show me on a map?\", next: \"map_info\" }\n   264         ]\n   265       },\n   266       persuade: {\n   267         speech: \"... You're right. I am scared. And it's eating me alive. They threa\n       tened my family. But what they're doing is monstrous. The ingredients... they're for\n        a ritual. The children's sickness isn't a plague — it's a curse. A binding curse. A\n       nd the cultists need twelve children as anchors for their ritual. TWELVE. The exact\n       number that are sick.\",\n   268         choices: [\n   269           { text: \"Gods. Where is their base?\", next: \"full_info\", questUpdate: \"rui\n       ns_location\" },\n   270           { text: \"We have to stop this immediately.\", next: \"full_info\", questUpdat\n       e: \"ruins_location\", morality: 5 }\n   271         ]\n   272       },\n   273       persuade_fail: {\n   274         speech: \"I don't know what you're talking about! Please, just leave me alone\n       . I have a family.\",\n   275         choices: [\n   276           { text: \"I understand. I'm sorry.\", next: \"farewell\" },\n   277           { text: \"[COIN] Perhaps this will change your mind.\", next: \"bribe\", cost:\n        20 }\n   278         ]\n   279       },\n   280       bribe: {\n   281         speech: \"... *takes the gold and pockets it quickly* The warehouse on Pier S\n       even. They use a green lamp signal. The leader is a woman called Vexira — she's no o\n       rdinary cultist. She commands them all. The ruins outside town are where she does he\n       r... work. I've said too much.\",\n   282         choices: [\n   283           { text: \"One more question: who hired them?\", next: \"neverember_hint\" },\n   284           { text: \"Thank you. I'll handle this.\", next: \"farewell\", questUpdate: \"ru\n       ins_location\" }\n   285         ]\n   286       },\n   287       warehouse_info: {\n   288         speech: \"The old ruins east of town — through the Pilgrim's Gate. That's whe\n       re they meet. Look for the black pentagram carved above the entrance. And be careful\n       . Vexira... she isn't just a cultist. She's something more now.\",\n   289         choices: [\n   290           { text: \"What do you mean?\", next: \"vexira_warning\" },\n   291           { text: \"I'll check it out.\", next: \"farewell\", questUpdate: \"ruins_locati\n       on\" }\n   292         ]\n   293       },\n   294       full_info: {\n   295         speech: \"The ruins east of town. But there's more — I overheard one of them\n       mention a noble. Someone inside the city's power structure is providing cover for th\n       e Zhentarim. I don't know who, but it goes high. Very high. Please... please stop th\n       em.\",\n   296         choices: [\n   297           { text: \"I will. And I'll make sure you're protected.\", next: \"farewell\",\n       questUpdate: \"ruins_location\", morality: 3 },\n   298           { text: \"Every man for himself, but thanks for the info.\", next: \"farewell\n       \", questUpdate: \"ruins_location\" }\n   299         ]\n   300       },\n   301       map_info: {\n   302         speech: \"Here — *sketches on a scrap of parchment* — east road, past the Pil\n       grim's Gate, follow the old aqueduct. You'll see the ruins. There's a black pentagra\n       m carved above the main entrance. Can't miss it.\",\n   303         choices: [\n   304           { text: \"Thank you, Garrett. Stay safe.\", next: \"farewell\", questUpdate: \"\n       ruins_location\" }\n   305         ]\n   306       },\n   307       neverember_hint: {\n   308         speech: \"I've said more than enough. But... look to power when you find evil\n       . That's all I'll say. *turns away*\",\n   309         choices: [\n   310           { text: \"Understood.\", next: \"farewell\" }\n   311         ]\n   312       },\n   313       vexira_warning: {\n   314         speech: \"She was just a cultist two months ago. Now the others treat her lik\n       e a goddess. I saw her stop a crossbow bolt mid-air with a gesture. Whatever ritual\n       she's performing... it's already working. She's drawing power from somewhere dark.\",\n   315         choices: [\n   316           { text: \"She'll be stopped. I promise.\", next: \"farewell\", morality: 3 }\n   317         ]\n   318       },\n   319       farewell: {\n   320         speech: \"Please be careful. And if you can... get my family out of Neverwint\n       er first. They're at the Blue Lantern Inn, Anvil Street.\",\n   321         choices: []\n   322       }\n   323     }\n   324   },\n   325   whisper: {\n   326     name: \"Whisper\", emoji: \"🐍\", title: \"Information Broker\",\n   327     portrait: \"🐍\", faction: null,\n   328     states: {\n   329       initial: {\n   330         speech: \"Ah. A new face with hungry eyes. That's my favorite kind. I'm calle\n       d Whisper, and information is my trade. What you seek, I likely know. But in my busi\n       ness, everything has a price. What would you like to know today?\",\n   331         choices: [\n   332           { text: \"What do you know about the Zhentarim?\", next: \"zhentarim_info\" },\n   333           { text: \"Tell me about Vexira.\", next: \"vexira_price\" },\n   334           { text: \"What do you know about Lord Neverember?\", next: \"neverember_price\n       \" },\n   335           { text: \"[FAVOR] I'll owe you one.\", next: \"favor_offer\" }\n   336         ]\n   337       },\n   338       zhentarim_info: {\n   339         speech: \"The Black Network? Now that's a topic worth discussing. For twenty\n       gold I can tell you the full extent of their operation in Neverwinter. For fifty, I'\n       ll tell you about their secret contact inside the city guard. What's it worth to you\n       ?\",\n   340         choices: [\n   341           { text: \"[20 GOLD] The basic information.\", next: \"zhentarim_basic\", cost:\n        20 },\n   342           { text: \"[50 GOLD] Everything you know.\", next: \"zhentarim_full\", cost: 50\n        },\n   343           { text: \"I'm not paying your prices.\", next: \"haggle\" }\n   344         ]\n   345       },\n   346       zhentarim_basic: {\n   347         speech: \"Smart investment. The Zhentarim have been using Neverwinter as a su\n       pply route for three months. They're shipping void salts and other alchemical compon\n       ents to a woman called Vexira, who's set up shop in the old ruins east of town. They\n        have twelve agents in the city, but most are just lookouts.\",\n   348         choices: [\n   349           { text: \"Who is Vexira?\", next: \"vexira_price\" },\n   350           { text: \"Thank you, Whisper.\", next: \"farewell\", questUpdate: \"zhentarim_i\n       nfo\" }\n   351         ]\n   352       },\n   353       zhentarim_full: {\n   354         speech: \"Now we're talking. The Zhentarim contact inside the guard is Sergea\n       nt Aldric — third watch, Eastern Gate. He's been paid to look the other way when shi\n       pments come through. But here's the real gem: their paymaster isn't the Zhentarim at\n        all. Someone far more powerful is bankrolling this. Someone with a lord's treasury.\n       \",\n   355         choices: [\n   356           { text: \"Lord Neverember?\", next: \"neverember_hint_whisper\" },\n   357           { text: \"This is bigger than I thought.\", next: \"farewell\", questUpdate: \"\n       full_zhentarim_info\" }\n   358         ]\n   359       },\n   360       vexira_price: {\n   361         speech: \"Vexira. *long pause* That name costs extra. Not because the informa\n       tion is rare — it's because people who ask about her tend to end up dead. I'll tell\n       you what I know for thirty gold and a promise that my name never reaches her ears.\",\n   362         choices: [\n   363           { text: \"[30 GOLD] Deal.\", next: \"vexira_info\", cost: 30 },\n   364           { text: \"I can't promise that.\", next: \"vexira_refuse\" },\n   365           { text: \"Too rich for me.\", next: \"farewell\" }\n   366         ]\n   367       },\n   368       vexira_info: {\n   369         speech: \"Vexira was a minor cult priestess three months ago. Then she found\n       something in the Cloakwood — a pact stone, they call it. A fragment of draconic powe\n       r. She used it to broker an arrangement with Szartharrax, a young black dragon who l\n       air beneath the Cloakwood. Now she draws power from the dragon, and the dragon gets.\n       .. well. Twelve souls. The children are the price.\",\n   370         choices: [\n   371           { text: \"We have to stop the ritual.\", next: \"ritual_info\", morality: 5, q\n       uestUpdate: \"vexira_known\" },\n   372           { text: \"So she's working with a dragon.\", next: \"dragon_info\" }\n   373         ]\n   374       },\n   375       ritual_info: {\n   376         speech: \"The ritual completes on the new moon — four days from now. When tho\n       se twelve souls are bound, Szartharrax gains the power to cast spells as a sorcerer.\n        A dragon with humanoid spellcasting... Neverwinter wouldn't survive the week. You n\n       eed to move quickly.\",\n   377         choices: [\n   378           { text: \"I'll stop it.\", next: \"farewell\" },\n   379           { text: \"Is there any way to break the ritual early?\", next: \"break_ritual\n       \" }\n   380         ]\n   381       },\n   382       break_ritual: {\n   383         speech: \"Kill Vexira before she completes the binding. The dragon's power fl\n       ows through her — cut that thread and the ritual unravels. But you'll need allies. A\n       nd you'll need to find the dragon's lair. Miri the healer knows the Cloakwood better\n        than anyone.\",\n   384         choices: [\n   385           { text: \"Understood. Thank you.\", next: \"farewell\" }\n   386         ]\n   387       },\n   388       dragon_info: {\n   389         speech: \"Szartharrax is young by dragon standards — only about forty years o\n       ld. But young dragons are reckless and ambitious. He sees this deal as an investment\n       . Once he has spell power, he plans to use Neverwinter as his base of operations. Ve\n       ry... entrepreneurial of him.\",\n   390         choices: [\n   391           { text: \"How do we stop him?\", next: \"ritual_info\" }\n   392         ]\n   393       },\n   394       neverember_price: {\n   395         speech: \"Lord Dagult Neverember. Now there's a name that sends a chill down\n       my spine. That information will cost you... nothing. Because some things are too imp\n       ortant to sell. *leans closer* He's been compromised. The Zhentarim have something o\n       n him — a secret that would end his lordship. They're using it to buy his silence wh\n       ile Vexira completes her work.\",\n   396         choices: [\n   397           { text: \"What secret?\", next: \"neverember_secret\" },\n   398           { text: \"He needs to be confronted.\", next: \"neverember_confront\", moralit\n       y: 3 }\n   399         ]\n   400       },\n   401       neverember_secret: {\n   402         speech: \"His 'legitimate son' — the heir — isn't legitimate at all. Neveremb\n       er has been secretly funding rebel groups in Waterdeep for years, playing both sides\n       . The Zhentarim found out. Now he does what they say or his reputation crumbles. The\n        man isn't evil — he's terrified and making terrible choices.\",\n   403         choices: [\n   404           { text: \"There might be a way to help him.\", next: \"farewell\", morality: 5\n        },\n   405           { text: \"He should face consequences.\", next: \"farewell\", morality: -5 }\n   406         ]\n   407       },\n   408       neverember_confront: {\n   409         speech: \"Brave words. Be careful — a cornered man is dangerous, especially o\n       ne with an army. Show him evidence of Vexira's work. If he sees the true scale of wh\n       at he's enabled, he might choose redemption over cowardice.\",\n   410         choices: [\n   411           { text: \"I'll find that evidence first.\", next: \"farewell\" }\n   412         ]\n   413       },\n   414       neverember_hint_whisper: {\n   415         speech: \"*smiles slowly* Now you're asking the right questions. Yes. The Lor\n       d of Neverwinter has been... persuaded to look away. But he isn't beyond saving. Fin\n       d proof of the ritual and confront him — publicly, where he can't deny it. His pride\n        might just outweigh his fear.\",\n   416         choices: [\n   417           { text: \"Thank you, Whisper. This changes things.\", next: \"farewell\" }\n   418         ]\n   419       },\n   420       favor_offer: {\n   421         speech: \"A favor? *laughs softly* I do love favors. They compound nicely. Ve\n       ry well. One favor, redeemable whenever I choose. In exchange: Vexira is in the ruin\n       s east of town, she's working with a dragon named Szartharrax who lairs beneath the\n       Cloakwood, and Lord Neverember is being blackmailed into cooperation. That's three t\n       ruths for one favor. A generous rate.\",\n   422         choices: [\n   423           { text: \"You have my word.\", next: \"farewell\", questUpdate: \"full_zhentari\n       m_info\", morality: -3 },\n   424           { text: \"Sounds like a trap. Never mind.\", next: \"farewell\" }\n   425         ]\n   426       },\n   427       haggle: {\n   428         speech: \"Haggling? How refreshingly common. Fine. Tell me something I don't\n       know, and we'll call it even. What have you learned in your travels?\",\n   429         choices: [\n   430           { text: \"The children's sickness is a binding curse.\", next: \"haggle_trade\n       \", questCheck: \"sick_children\" },\n   431           { text: \"I don't have anything worth trading.\", next: \"farewell\" }\n   432         ]\n   433       },\n   434       haggle_trade: {\n   435         speech: \"Hmm. That's... actually useful. Very well. The Zhentarim have twelv\n       e agents in town. They use Pier Seven as their entry point. Their leader is in the r\n       uins east of town — Vexira the cultist. That's my side of the trade.\",\n   436         choices: [\n   437           { text: \"We're square then.\", next: \"farewell\", questUpdate: \"zhentarim_in\n       fo\" }\n   438         ]\n   439       },\n   440       vexira_refuse: {\n   441         speech: \"Wise. She has ears everywhere — including, I suspect, inside the ci\n       ty watch. Be careful who you trust, stranger. Not everyone wearing a badge is on you\n       r side.\",\n   442         choices: [\n   443           { text: \"I'll keep that in mind.\", next: \"farewell\" }\n   444         ]\n   445       },\n   446       farewell: {\n   447         speech: \"Watch your back, friend. Neverwinter has teeth, and they're very sh\n       arp just now. Come back if you need anything else — my prices are always... negotiab\n       le.\",\n   448         choices: []\n   449       }\n   450     }\n   451   },\n   452   tormund: {\n   453     name: \"Tormund\", emoji: \"⚔️\", title: \"Veteran Warrior\",\n   454     portrait: \"⚔️\", faction: \"lords\",\n   455     states: {\n   456       initial: {\n   457         speech: \"*bleeding from a wound on his arm, back against a ruined wall* Ther\n       e's six of them! *sees you* About time someone came. Are you with the guard, or just\n        a fool wandering into an ambush?\",\n   458         choices: [\n   459           { text: \"Neither — I'm here to help!\", next: \"rescue\", morality: 5 },\n   460           { text: \"Looks like you could use a hand.\", next: \"rescue\" },\n   461           { text: \"What's going on here?\", next: \"explain\" }\n   462         ]\n   463       },\n   464       explain: {\n   465         speech: \"Zhentarim! Six of them jumped me when I got close to their warehous\n       e. I killed two but they winged me good. I'm Tormund Ironridge — used to serve with\n       the Neverwinter regulars. These bastards are everywhere now. Help me deal with the l\n       ast four and I'll owe you my life.\",\n   466         choices: [\n   467           { text: \"Let's take them down together!\", next: \"rescue\", morality: 3 },\n   468           { text: \"I'll help if you tell me what you know.\", next: \"deal\" }\n   469         ]\n   470       },\n   471       rescue: {\n   472         speech: \"*stands and draws his greatsword* Right then! On your left!\",\n   473         choices: [],\n   474         triggerCombat: \"tormund_ambush\",\n   475         isRescue: true\n   476       },\n   477       deal: {\n   478         speech: \"A deal in the middle of a fight?! You've got nerve, I'll give you t\n       hat. Fine — help me survive and I'll tell you everything I know about Vexira's opera\n       tion. Deal?\",\n   479         choices: [\n   480           { text: \"Deal. Let's fight!\", next: \"rescue\", morality: -2 },\n   481           { text: \"Good enough for me.\", next: \"rescue\" }\n   482         ]\n   483       },\n   484       rescued: {\n   485         speech: \"*breathing heavily* That was close. I owe you, and Tormund Ironridg\n       e pays his debts. I've been tracking the Zhentarim for two weeks. Vexira's cult is h\n       oled up in the ruins east of town, but there's something else — she's bound a dragon\n       . A young one, but still. They're planning something big for the new moon.\",\n   486         choices: [\n   487           { text: \"Will you join me? I could use your sword.\", next: \"join_party\", m\n       orality: 3 },\n   488           { text: \"What do you know about the cult's defenses?\", next: \"defenses\" },\n   489           { text: \"A dragon? That changes things.\", next: \"dragon_talk\" }\n   490         ]\n   491       },\n   492       join_party: {\n   493         speech: \"Ha! I was hoping you'd ask. An old soldier needs purpose, and this\n       cause is worth bleeding for. You'll have my sword, my shield, and my bad jokes. Fair\n        warning on the last one. *extends hand* Tormund Ironridge, at your service.\",\n   494         choices: [\n   495           { text: \"Welcome aboard, Tormund.\", next: \"farewell\", joinParty: true },\n   496           { text: \"We move at dawn.\", next: \"farewell\", joinParty: true }\n   497         ]\n   498       },\n   499       defenses: {\n   500         speech: \"Six guards at the main entrance, rotating in pairs. Inside, maybe t\n       wenty cultists and a half-dozen Zhentarim agents. Vexira herself is deeper in — ther\n       e's a ritual chamber below ground. She won't come up to fight; she'll let her people\n        die first.\",\n   501         choices: [\n   502           { text: \"I'll need to fight through them.\", next: \"join_party\" },\n   503           { text: \"Is there another way in?\", next: \"secret_entrance\" }\n   504         ]\n   505       },\n   506       dragon_talk: {\n   507         speech: \"Aye. Szartharrax. Young dragon, black — acid type. Nasty. But here'\n       s something interesting: I overheard a cultist say the dragon isn't fully committed\n       to the deal. He's using Vexira as much as she's using him. There might be a way to d\n       rive a wedge between them... if you're clever enough.\",\n   508         choices: [\n   509           { text: \"Will you help me figure that out?\", next: \"join_party\" }\n   510         ]\n   511       },\n   512       secret_entrance: {\n   513         speech: \"Actually... yes. There's a collapsed aqueduct on the north side. Ti\n       ght fit, but a determined person could get through. Leads right to the ritual chambe\n       r. Risky, but it bypasses most of the guards.\",\n   514         choices: [\n   515           { text: \"Good to know. Come with me?\", next: \"join_party\" }\n   516         ]\n   517       },\n   518       farewell: {\n   519         speech: \"Stay sharp. These cultists don't take prisoners — they take sacrifi\n       ces. We'll end this.\",\n   520         choices: []\n   521       }\n   522     }\n   523   },\n   524   miri: {\n   525     name: \"Miri\", emoji: \"💚\", title: \"Field Healer\",\n   526     portrait: \"💚\", faction: null,\n   527     states: {\n   528       initial: {\n   529         speech: \"Oh! A visitor — I don't get many of those out here. I'm Miri. I've\n       been studying the plants in the Cloakwood, though it's gotten terribly dangerous lat\n       ely. The undead... they're spreading further from the ruins every week. Is there som\n       ething I can help you with?\",\n   530         choices: [\n   531           { text: \"Elara sent me about the sick children.\", next: \"children_quest\" }\n       ,\n   532           { text: \"I'm looking for Nightshade Bloom.\", next: \"nightshade_info\" },\n   533           { text: \"Can you heal my wounds?\", next: \"healing_offer\" },\n   534           { text: \"I need crafting help.\", next: \"crafting_offer\" }\n   535         ]\n   536       },\n   537       children_quest: {\n   538         speech: \"The children with the black veins! I've been trying to get informat\n       ion to Elara for a week, but I couldn't leave my camp — the undead have me pinned. T\n       he illness is a binding curse, tied to a ritual. To break it, the ritual must be dis\n       rupted or the cultist maintaining it must die. But there's also a protective draught\n        I can make.\",\n   539         choices: [\n   540           { text: \"What do you need to make it?\", next: \"ingredients\" },\n   541           { text: \"I'll stop the ritual directly.\", next: \"direct_approach\", moralit\n       y: 3 },\n   542           { text: \"Tell me about the draught.\", next: \"draught_info\" }\n   543         ]\n   544       },\n   545       ingredients: {\n   546         speech: \"I need two things: a Nightshade Bloom — it grows near the standing\n       stones deeper in the Cloakwood — and a Dragon Scale. The dragon's essence in the sca\n       le counters the draconic magic in the curse. If you can bring me both, I can make a\n       draught that might save the children even if the ritual completes.\",\n   547         choices: [\n   548           { text: \"I'll find them both.\", next: \"ingredient_quest\", questUpdate: \"mi\n       ri_ingredients\" },\n   549           { text: \"I already have them!\", next: \"have_ingredients\", questCheck: \"mir\n       i_ingredients\" }\n   550         ]\n   551       },\n   552       have_ingredients: {\n   553         speech: \"You do?! Oh, this is wonderful! Let me get to work immediately. *be\n       gins mixing with practiced efficiency* This will take a few minutes, but when it's d\n       one... we'll have enough draught to protect a dozen children. Thank you. Truly.\",\n   554         choices: [\n   555           { text: \"Can you teach me the recipe too?\", next: \"teach_craft\", morality:\n        3 },\n   556           { text: \"Keep the extra. You may need it.\", next: \"farewell\", giveItem: \"e\n       lixir_of_health\" }\n   557         ]\n   558       },\n   559       ingredient_quest: {\n   560         speech: \"Be careful in the deeper wood. The Nightshade Bloom grows in rings\n       around the standing stones — it's distinctive, midnight-blue petals with silver vein\n       s. As for dragon scales... well. There's only one dragon in these woods. I'd suggest\n        finding another source if possible, but if not... good luck.\",\n   561         choices: [\n   562           { text: \"I'll be back soon.\", next: \"farewell\" }\n   563         ]\n   564       },\n   565       teach_craft: {\n   566         speech: \"Of course! It's a simple enough recipe once you understand the prin\n       ciple — draconic essence neutralizes draconic curses. The scale must be ground and t\n       he bloom steeped for exactly six hours. Here, I'll write it down for you. *scribbles\n        in a notebook* Take this. You might need it before this is over.\",\n   567         choices: [\n   568           { text: \"Thank you, Miri.\", next: \"farewell\", questUpdate: \"learned_crafti\n       ng\", unlockCrafting: true }\n   569         ]\n   570       },\n   571       healing_offer: {\n   572         speech: \"Of course! A healer's work is never done. *examines your wounds* Th\n       ese are serious. Here — hold still. *begins treating injuries* I can patch you up, b\n       ut you should rest. These wounds are from Zhentarim steel unless I miss my guess.\",\n   573         choices: [\n   574           { text: \"You're right. Can you tell me about them?\", next: \"children_quest\n       \", healParty: true },\n   575           { text: \"Thank you. I'll be careful.\", next: \"farewell\", healParty: true }\n   576         ]\n   577       },\n   578       crafting_offer: {\n   579         speech: \"Ah! You've learned something of the craft? I can work with ingredie\n       nts if you bring them to me. Dragon Scale and Nightshade Bloom can create a protecti\n       ve draught. I can also combine healing potions with rare materials for stronger effe\n       cts. What do you have?\",\n   580         choices: [\n   581           { text: \"Let me check my supplies.\", next: \"farewell\", openCrafting: true\n       },\n   582           { text: \"I'll gather ingredients first.\", next: \"farewell\" }\n   583         ]\n   584       },\n   585       nightshade_info: {\n   586         speech: \"The Nightshade Bloom grows in the deeper Cloakwood, near the standi\n       ng stones. Midnight-blue petals, silver veins. You'll know it when you see it — it s\n       eems to glow faintly in the dark. But the undead are thickest there. It's not a plea\n       sant walk.\",\n   587         choices: [\n   588           { text: \"Any advice for dealing with the undead?\", next: \"undead_advice\" }\n       ,\n   589           { text: \"I'll manage.\", next: \"farewell\" }\n   590         ]\n   591       },\n   592       undead_advice: {\n   593         speech: \"Radiant magic is best — light-based spells. Fire works too. Bludgeo\n       ning is more effective than slashing or piercing. And for the ghouls specifically: d\n       on't let them touch you bare skin. Their claws carry a paralyzing toxin. Keep your d\n       istance if you can.\",\n   594         choices: [\n   595           { text: \"Good to know. Thank you.\", next: \"farewell\" }\n   596         ]\n   597       },\n   598       draught_info: {\n   599         speech: \"The Draught of Dragon Resistance — it creates temporary magical res\n       istance to the curse's effects. If the children drink it, the curse will be weakened\n        enough that their own constitution can fight it off. It won't cure them permanently\n       , but it buys time until the ritual is disrupted.\",\n   600         choices: [\n   601           { text: \"What ingredients do you need?\", next: \"ingredients\" }\n   602         ]\n   603       },\n   604       direct_approach: {\n   605         speech: \"That's certainly effective. Kill Vexira, break the ritual, free the\n        children. Simple in principle, terrifying in execution. Be aware: if the ritual is\n       severed violently, there may be a magical backlash. The children will survive, but i\n       t won't be pleasant for them. Still — alive and scarred is better than bound forever\n       .\",\n   606         choices: [\n   607           { text: \"It'll have to be enough.\", next: \"farewell\" }\n   608         ]\n   609       },\n   610       farewell: {\n   611         speech: \"Come back to me if you're wounded. And please — be careful in the C\n       loakwood. I'd hate to lose a potential friend to an overeager ghoul.\",\n   612         choices: []\n   613       }\n   614     }\n   615   },\n   616   lord_neverember: {\n   617     name: \"Lord Neverember\", emoji: \"👑\", title: \"Lord Protector of Neverwinter\",\n   618     portrait: \"👑\", faction: \"lords\",\n   619     states: {\n   620       initial: {\n   621         speech: \"Ah, an adventurer. My city has need of capable hands. I've heard re\n       ports of... unrest in the ruins district. Cultists, they say. I want them dealt with\n        quietly. No proclamations, no panic. Handle it discreetly and you'll be well compen\n       sated.\",\n   622         choices: [\n   623           { text: \"I'll look into it.\", next: \"assignment\" },\n   624           { text: \"What do you know about Vexira?\", next: \"vexira_probe\" },\n   625           { text: \"I know you're being blackmailed.\", next: \"confrontation\", questCh\n       eck: \"neverember_secret\" }\n   626         ]\n   627       },\n   628       assignment: {\n   629         speech: \"Good. The ruins east of the Pilgrim's Gate — the Zhentarim have bee\n       n using them as a base. Clear them out. Bring me proof of their leader's identity, a\n       nd I'll pay you five hundred gold. *shuffles papers, not meeting your eyes* That wil\n       l be all.\",\n   630         choices: [\n   631           { text: \"Something tells me there's more to this.\", next: \"probe\" },\n   632           { text: \"Five hundred gold. I'll do it.\", next: \"farewell\", questUpdate: \"\n       neverember_quest\" }\n   633         ]\n   634       },\n   635       probe: {\n   636         speech: \"*pauses, something flashing in his eyes — guilt? fear?* The Zhentar\n       im are simply criminals operating in my city. Nothing more. *more firmly* Nothing. M\n       ore. I suggest you focus on your assignment.\",\n   637         choices: [\n   638           { text: \"As you say, my lord.\", next: \"farewell\" },\n   639           { text: \"I'll discover the truth myself.\", next: \"farewell\", morality: 3 }\n   640         ]\n   641       },\n   642       vexira_probe: {\n   643         speech: \"I don't... *swallows* I know the name. She's the cult leader in the\n        ruins. A dangerous woman. That's why I need her dealt with quickly.\",\n   644         choices: [\n   645           { text: \"You seem nervous about her.\", next: \"nervous\" },\n   646           { text: \"I'll handle it.\", next: \"farewell\" }\n   647         ]\n   648       },\n   649       nervous: {\n   650         speech: \"I am simply concerned for my city! Now please, focus on the task at\n       — *a messenger bursts in* What?! Not now! *looks at you* I think you should leave.\",\n   651         choices: [\n   652           { text: \"We'll speak again, my lord.\", next: \"farewell\" }\n   653         ]\n   654       },\n   655       confrontation: {\n   656         speech: \"*face goes white* Where did you hear— *long silence, then slumps* G\n       ods. You know. *quietly* Yes. They have letters. Documents that would end my lordshi\n       p. I've been... allowing their operations to continue in exchange for silence. I tol\n       d myself it was just smuggling. Petty crime. But the children...\",\n   657         choices: [\n   658           { text: \"You have to help me stop this. For the children.\", next: \"redempt\n       ion\", morality: 5 },\n   659           { text: \"I could turn you in right now.\", next: \"blackmail_him\", morality:\n        -10 },\n   660           { text: \"Help me and I'll keep your secret.\", next: \"deal_neverember\" }\n   661         ]\n   662       },\n   663       redemption: {\n   664         speech: \"*stands slowly* You're right. I've been a coward when my people nee\n       ded a lord. *removes signet ring* Take this. It opens the restricted armory and my p\n       ersonal vault. Use whatever you need. And when this is over... I'll face whatever ju\n       dgment the gods see fit to deliver.\",\n   665         choices: [\n   666           { text: \"That takes courage, my lord.\", next: \"farewell\", giveItem: \"never\n       bember_signet\", morality: 8, questUpdate: \"neverember_redeemed\" },\n   667           { text: \"The city needs you. Make it right.\", next: \"farewell\", giveItem:\n       \"neverbember_signet\", questUpdate: \"neverember_redeemed\" }\n   668         ]\n   669       },\n   670       blackmail_him: {\n   671         speech: \"*bristles with anger* You wouldn't dare— *looks at your expression*\n        ...You would. Fine. What do you want?\",\n   672         choices: [\n   673           { text: \"Your signet ring and access to the armory.\", next: \"forced_help\",\n        morality: -5 },\n   674           { text: \"Your full cooperation against Vexira.\", next: \"forced_help\" }\n   675         ]\n   676       },\n   677       forced_help: {\n   678         speech: \"*throws the signet ring at your feet* Take it. And when this city f\n       alls or when it's saved, remember that you helped create this moment.\",\n   679         choices: [\n   680           { text: \"*pick up the ring*\", next: \"farewell\", giveItem: \"neverbember_sig\n       net\", questUpdate: \"neverember_coerced\" }\n   681         ]\n   682       },\n   683       deal_neverember: {\n   684         speech: \"*studies you for a long moment* A pragmatist. I can respect that. *\n       hands over signet ring* Help me, and your silence is your reward. Along with whateve\n       r else I can offer. We clear Vexira out, and this whole business becomes... a secret\n        we share.\",\n   685         choices: [\n   686           { text: \"We have a deal.\", next: \"farewell\", giveItem: \"neverbember_signet\n       \", questUpdate: \"neverember_deal\", morality: -3 }\n   687         ]\n   688       },\n   689       farewell: {\n   690         speech: \"Go. Do what must be done. May the gods guide your blade.\",\n   691         choices: []\n   692       }\n   693     }\n   694   },\n   695   zara: {\n   696     name: \"Captain Zara\", emoji: \"🛡️\", title: \"Guard Captain\",\n   697     portrait: \"🛡️\", faction: \"lords\",\n   698     states: {\n   699       initial: {\n   700         speech: \"Halt. I'm Captain Zara, Neverwinter Watch. We've had reports of una\n       uthorized individuals entering restricted areas. State your business and show me you\n       r papers, if you have them.\",\n   701         choices: [\n   702           { text: \"I'm investigating the cult activity.\", next: \"investigation_claim\n       \" },\n   703           { text: \"[PERSUASION] Lord Neverember sent me.\", next: \"persuade_neverembe\n       r\", skillCheck: {skill:\"cha\",dc:12} },\n   704           { text: \"Show Neverember's signet.\", next: \"show_signet\", itemCheck: \"neve\n       rbember_signet\" },\n   705           { text: \"I don't answer to city guards.\", next: \"hostile\", morality: -3 }\n   706         ]\n   707       },\n   708       investigation_claim: {\n   709         speech: \"Cult activity. *crosses arms* Half the city claims to be investigat\n       ing something. What evidence do you have? What have you learned? Convince me you're\n       not just another glory seeker and I might actually help you.\",\n   710         choices: [\n   711           { text: \"The children's sickness is a binding curse.\", next: \"impressed\",\n       questCheck: \"sick_children\" },\n   712           { text: \"The Zhentarim are operating from the eastern ruins.\", next: \"impr\n       essed\", questCheck: \"ruins_location\" },\n   713           { text: \"I'm still gathering information.\", next: \"disappointed\" }\n   714         ]\n   715       },\n   716       impressed: {\n   717         speech: \"...That's more than I expected. You've been doing serious work. *lo\n       wers voice* Look — I have my orders, which say to maintain order and not cause a pan\n       ic. But I also have children in this city, and I'm not about to let them die for pol\n       itics. What do you need?\",\n   718         choices: [\n   719           { text: \"Access to the eastern gate without harassment.\", next: \"access_gr\n       anted\", morality: 3 },\n   720           { text: \"Information on Zhentarim agents in the watch.\", next: \"insider_in\n       fo\" },\n   721           { text: \"Military support for the final assault.\", next: \"military_support\n       \" }\n   722         ]\n   723       },\n   724       access_granted: {\n   725         speech: \"Done. You'll have a watch token — show it at any gate and you'll pa\n       ss without question. *presses a brass disc into your hand* Don't make me regret this\n       .\",\n   726         choices: [\n   727           { text: \"I won't. Thank you, Captain.\", next: \"farewell\", questUpdate: \"za\n       ra_allied\" }\n   728         ]\n   729       },\n   730       insider_info: {\n   731         speech: \"*jaw tightens* So you know about that. Yes. Sergeant Aldric. I've s\n       uspected him for weeks but couldn't prove it without tipping off his handlers. I'll\n       have him detained tonight — quietly. That should shut down one of their information\n       channels.\",\n   732         choices: [\n   733           { text: \"Good. Together we can end this.\", next: \"farewell\", morality: 3,\n       questUpdate: \"aldric_detained\" }\n   734         ]\n   735       },\n   736       military_support: {\n   737         speech: \"I want to. By the gods, I want to march on those ruins with my full\n        complement. But Lord Neverember has expressly forbidden military action without his\n        written order. Unless... you could get that order?\",\n   738         choices: [\n   739           { text: \"I'm working on Neverember.\", next: \"farewell\" },\n   740           { text: \"Show signet ring.\", next: \"military_granted\", itemCheck: \"neverbe\n       mber_signet\" }\n   741         ]\n   742       },\n   743       military_granted: {\n   744         speech: \"The Lord's signet! *stands to attention* Then you have his authoriz\n       ation. I'll have two dozen soldiers ready to march at your signal. Give the word whe\n       n you need us.\",\n   745         choices: [\n   746           { text: \"Be ready. It happens soon.\", next: \"farewell\", questUpdate: \"mili\n       tary_support\" }\n   747         ]\n   748       },\n   749       persuade_neverember: {\n   750         speech: \"*relaxes slightly* Lord Neverember, you say? I'll need more than wo\n       rds. What's your business with the ruins?\",\n   751         choices: [\n   752           { text: \"Investigating the cult that's cursing the children.\", next: \"inve\n       stigation_claim\" }\n   753         ]\n   754       },\n   755       persuade_fail: {\n   756         speech: \"Anyone can claim to work for the Lord. Move along before I have you\n        detained for loitering.\",\n   757         choices: [\n   758           { text: \"Fine. I'll handle this without the watch.\", next: \"farewell\", mor\n       ality: -2 }\n   759         ]\n   760       },\n   761       show_signet: {\n   762         speech: \"*eyes widen* The Lord's signet ring! Then you have his full authori\n       ty. Forgive me — I didn't know. What do you need, and it shall be done.\",\n   763         choices: [\n   764           { text: \"Military support for the ruins assault.\", next: \"military_granted\n       \" },\n   765           { text: \"Free passage through all gates.\", next: \"access_granted\" }\n   766         ]\n   767       },\n   768       hostile: {\n   769         speech: \"*hand goes to sword* Is that so? Then perhaps you'd like to explain\n        yourself to the magistrate. I can arrange that very easily.\",\n   770         choices: [\n   771           { text: \"I apologize. Let me start over.\", next: \"initial\", morality: 0 },\n   772           { text: \"*walk away*\", next: \"farewell\" }\n   773         ]\n   774       },\n   775       disappointed: {\n   776         speech: \"Come back when you have something concrete. I deal in facts, not th\n       eories. Until then, stay out of the restricted areas.\",\n   777         choices: [\n   778           { text: \"Understood.\", next: \"farewell\" }\n   779         ]\n   780       },\n   781       farewell: {\n   782         speech: \"Move with purpose, stranger. This city is counting on people like y\n       ou right now, whether it knows it or not.\",\n   783         choices: []\n   784       }\n   785     }\n   786   },\n   787   vexira: {\n   788     name: \"Vexira\", emoji: \"💀\", title: \"High Cultist of the Void\",\n   789     portrait: \"💀\", faction: null,\n   790     states: {\n   791       first_encounter: {\n   792         speech: \"*turns slowly, eyes glowing violet* You've come further than I expe\n       cted. Most heroes die at the gate. *regards you with genuine curiosity* What are you\n       ? Just another sword arm hired to clean up the mess? Or something more interesting?\"\n       ,\n   793         choices: [\n   794           { text: \"I'm here to stop your ritual.\", next: \"defiant\", morality: 5 },\n   795           { text: \"I'm here to kill you.\", next: \"violent\" },\n   796           { text: \"I want to understand what you're doing.\", next: \"parley\" },\n   797           { text: \"[CHA] You don't have to do this.\", next: \"appeal\", skillCheck: {s\n       kill:\"cha\",dc:18} }\n   798         ]\n   799       },\n   800       defiant: {\n   801         speech: \"Stop it? *laughs* The ritual is already half-complete. The children\n       's essence feeds the stone even now. Kill me if you must — my death will merely acce\n       lerate the binding. The only way to save them is to break the pact stone, which Szar\n       tharrax guards with his life. *draws her weapon* But you're welcome to try.\",\n   802         choices: [\n   803           { text: \"Then I'll fight you here.\", next: \"fight\", triggerCombat: \"vexira\n       _act3\" },\n   804           { text: \"Where is the pact stone?\", next: \"pact_stone_info\" }\n   805         ]\n   806       },\n   807       violent: {\n   808         speech: \"Direct. I respect that. *violet fire coils around her hands* Most w\n       aste time with words. Let's not.\",\n   809         choices: [\n   810           { text: \"*FIGHT!*\", next: \"fight\", triggerCombat: \"vexira_act3\" }\n   811         ]\n   812       },\n   813       parley: {\n   814         speech: \"Understanding? *surprised pause* Now that's unexpected. Very well.\n       I serve Szartharrax willingly. Not out of fear — out of vision. A dragon-mage ruling\n        Neverwinter would bring order. Real order. The kind that doesn't depend on corrupt\n       lords and frightened merchants. I am creating something better.\",\n   815         choices: [\n   816           { text: \"By enslaving children?\", next: \"children_challenge\", morality: 5\n       },\n   817           { text: \"Your 'order' sounds like tyranny.\", next: \"defiant\" },\n   818           { text: \"What would you gain from this arrangement?\", next: \"her_motivatio\n       n\" }\n   819         ]\n   820       },\n   821       children_challenge: {\n   822         speech: \"Sacrifice. Not slavery. *a flicker of something — doubt? — crosses\n       her face* The children sleep. They'll wake when the ritual is complete. They won't r\n       emember. Most of them. *quieter* The few who don't... they serve a greater purpose.\"\n       ,\n   823         choices: [\n   824           { text: \"You know that's wrong. I can see it in your face.\", next: \"final_\n       appeal\", morality: 5 },\n   825           { text: \"That's monstrous.\", next: \"fight\", triggerCombat: \"vexira_act3\" }\n   826         ]\n   827       },\n   828       final_appeal: {\n   829         speech: \"*stops* ...I've walked too far down this road to turn back. The dra\n       gon would kill me. I have no other path. *raises weapon, but with less conviction* F\n       orgive me.\",\n   830         choices: [\n   831           { text: \"Fight.\", next: \"fight\", triggerCombat: \"vexira_act3\" },\n   832           { text: \"[CHA 18] There is always another path.\", next: \"appeal\", skillChe\n       ck: {s          Now using extra usage\n                                  Update available! Run: winget upgrade Anthropic.ClaudeCode\n                                                                                              ","README.md":"﻿# Chronicles of the Sword Coast\n\nA modular browser RPG rebuilt from a truncated legacy snapshot.\n\n## Run locally\n1. Open a terminal in this folder.\n2. Start a local server:\n   - `python -m http.server 8765`\n3. Open `http://127.0.0.1:8765/index.html` in a browser.\n\n## Run tests\n- Install dependencies: `npm install`\n- Install browser once: `npx playwright install chromium`\n- Run smoke suite: `npm run test:e2e`\n- Run all Playwright tests: `npm test`\n\n## Player and test controls\n\n- Press `F` or use a Fullscreen button to toggle fullscreen.\n- Press `S` to save, `R` to rest outside combat, `L` to load from the title, and `1`-`9` to choose visible actions.\n- `window.render_game_to_text()` returns a concise JSON summary of the current screen, player, world, combat, and visible choices.\n- `window.advanceTime(ms)` deterministically refreshes the turn-based view and returns the same summary.\n\n## Project structure\n- `index.html`: app shell and UI containers.\n- `styles/main.css`: core styling (recovered + patch updates).\n- `src/main.js`: gameplay loop, UI actions, dialogue, encounters, crafting, boss flow.\n- `src/core/*`: dice, save/load, state helpers.\n- `src/data/*`: races, classes, spells, items, recipes, NPCs, locations, quests.\n- `src/ui/render.js`: screen rendering and sidebar/action panel rendering.\n- `legacy/DNDGAME_snapshot_truncated.html`: preserved legacy extraction.\n- `PLAN.md`: phased roadmap.\n- `BUGS.md`: source integrity issues from the legacy snapshot.\n\n## Save data\n- Save key: `chronicles_sword_coast_save`\n- Schema version: `1`\n- Save payload includes `version`, `savedAt`, and serialized `state`.\n\n## Content authoring\nAdd or edit content in `src/data/*`:\n- New NPCs: `src/data/npcs.js`\n- New locations/encounters/boss tuning: `src/data/locations.js`\n- New quests: `src/data/quests.js`\n- New items/shop entries: `src/data/items.js`\n- New crafting recipes: `src/data/recipes.js`\n- New spells/classes/races: corresponding data files\n\n## Current gameplay coverage\n- Title screen, new game, load game, help prompt\n- Character creation\n- Exploration and travel\n- NPC interactions\n- Turn-based combat with attacks, spells, potion, flee\n- Side quest and main quest progression\n- Crafting Warded Key\n- Final boss fight and victory ending state\n- Death/recovery path\n\n## Known limitations\n- Encounter and dialogue depth is intentionally compact for this checkpoint.\n- Balance tuning is baseline only and may need iteration.\n","assets/scenes/city-gates.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 420\" role=\"img\" aria-labelledby=\"title desc\">\n  \u003ctitle id=\"title\">City Gates at Dusk\u003c/title>\n  \u003cdesc id=\"desc\">A stylized fantasy city skyline with banners, towers, and warm lamps.\u003c/desc>\n  \u003cdefs>\n    \u003clinearGradient id=\"sky\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n      \u003cstop offset=\"0%\" stop-color=\"#112449\"/>\n      \u003cstop offset=\"52%\" stop-color=\"#314d78\"/>\n      \u003cstop offset=\"100%\" stop-color=\"#d08a48\"/>\n    \u003c/linearGradient>\n    \u003clinearGradient id=\"stone\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"1\">\n      \u003cstop offset=\"0%\" stop-color=\"#243449\"/>\n      \u003cstop offset=\"100%\" stop-color=\"#111822\"/>\n    \u003c/linearGradient>\n  \u003c/defs>\n  \u003crect width=\"900\" height=\"420\" fill=\"url(#sky)\"/>\n  \u003ccircle cx=\"716\" cy=\"92\" r=\"34\" fill=\"#f4ddb2\" opacity=\"0.9\"/>\n  \u003crect y=\"300\" width=\"900\" height=\"120\" fill=\"#131a25\"/>\n  \u003cpath d=\"M0 295L120 236L190 264L288 206L382 238L468 172L556 212L642 164L720 210L812 180L900 220V420H0Z\" fill=\"#1a2432\"/>\n  \u003cpath d=\"M145 186H250V312H145Z\" fill=\"url(#stone)\
