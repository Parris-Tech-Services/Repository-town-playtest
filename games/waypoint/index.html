<!DOCTYPE html>
<html lang="en">
<head><script>// Injected first into every packed game (tools/pack_games.mjs). Lets games built for a
// web server run from a folder, including from file:// in the offline zip.
// The packer fills in the game's small text files (F) and optional images as data URIs (IMG).
(function () {
  var F = {"README.md":"# 🧭 Waypoint — Personal Decision Navigator\n\nA small, grounded tool for moving from overwhelm to **one clear next step**. It walks you\nthrough five honest questions, then saves the decision as a card you can revisit. It never\ndecides for you and never pretends certainty.\n\n## The five steps\n\n1. What are you deciding or avoiding?\n2. What matters most here?\n3. What are the real options?\n4. What is the smallest reversible next step?\n5. What would wisdom, kindness, and courage look like?\n\n## Features\n\n- Five-step guided flow with progress bar and back/next.\n- Tag each decision: `work`, `family`, `health`, `money`, `project`, `faith`.\n- Decisions saved to **localStorage** as revisitable cards.\n- **Export** all decisions as JSON or Markdown.\n- Clear empty state until you save your first decision.\n\n## Run\n\nStatic, single file:\n\n```bash\nstart index.html        # Windows — or\npython -m http.server 8000\n```\n\n## Status\n\nSee [STATUS.md](STATUS.md). **Working MVP.**\n\n## Screenshots\n\n_Add screenshots to `docs/` and link them here._\n\n## Privacy\n\nEverything stays in your browser (localStorage). Nothing is sent anywhere. No AI calls.\n","STATUS.md":"# Status — Waypoint\n\n## What works now\n- Five-step decision flow with progress bar, back/next, and validation.\n- Tagging (work/family/health/money/project/faith).\n- Saved decision cards in localStorage (last 100).\n- Export to JSON and Markdown.\n- Empty state before first decision.\n\n## Next steps\n- Filter/search saved decisions by tag or text.\n- \"Revisit\" reminders (e.g. check back in a week).\n- Edit/delete individual decisions.\n- Optional import from JSON.\n","podcasttodo.md":"# Podcast Integration TODO\n\n**Decision:** Add.\n**Topic bank:** decision-making, values, behavioural science, wisdom, psychology, courage, practical next steps.\n\n## TODO\n- [ ] Curate about 25 high-quality Spotify episodes on decision-making and values.\n- [ ] Add a collapsed bottom dock: **🧭 Listen to a different decision podcast**.\n- [ ] One tap selects/loads another episode; persist recent choices and avoid immediate repeats.\n- [ ] Use Spotify embed/deep links without assuming autoplay.\n- [ ] Tag episodes by uncertainty, values, habits, courage, reversible decisions and reflection.\n- [ ] Keep the five-step decision flow primary and never let audio imply the app has decided for the user.\n- [ ] Add mobile/a11y and selection/persistence tests.\n\n## Shared direction\nUse the reusable **Josh Podcast Dock** pattern with a data-driven episode bank.\n"};
  var IMG = {};
  var fileMode = location.protocol === 'file:';
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  // Cross-app integration widgets are stripped; games that call them get a silent stand-in.
  var noop = function () { return undefined; };
  var adapter = { init: noop, trigger: noop, getRoutes: function () { return []; }, on: noop, emit: noop, track: noop };
  if (!window.PortalAdapter) window.PortalAdapter = typeof Proxy === 'function' ? new Proxy(adapter, { get: function (t, k) { return k in t ? t[k] : noop; } }) : adapter;

  // Maps a request URL to a packed file: first relative to the game folder, then, for
  // root-absolute paths ("/seed/x.md", "/src/data/map.json"), by its longest matching tail.
  function lookup(map, u) {
    try {
      var url = new URL(u, location.href);
      if (!fileMode && url.origin !== location.origin) return null;
      var base = new URL('.', location.href).pathname;
      var p = decodeURIComponent(url.pathname);
      if (p.indexOf(base) === 0 && has(map, p.slice(base.length))) return p.slice(base.length);
      var parts = p.split('/').filter(Boolean);
      for (var i = 0; i < parts.length; i++) { var k = parts.slice(i).join('/'); if (has(map, k)) return k; }
    } catch (e) { /* not a URL */ }
    return null;
  }
  var typeOf = function (k) { return /\.json$/i.test(k) ? 'application/json' : /\.svg$/i.test(k) ? 'image/svg+xml' : /\.html?$/i.test(k) ? 'text/html' : 'text/plain'; };

  var realFetch = window.fetch && window.fetch.bind(window);
  window.fetch = function (input, init) {
    var u = typeof input === 'string' ? input : input && input.url;
    var k = u && lookup(F, u);
    // Online the real server answers relative requests; packed copies cover file:// and
    // root-absolute paths that no longer exist on the host.
    if (k !== null && k !== undefined && (fileMode || /^\//.test(u) || !realFetch)) return Promise.resolve(new Response(F[k], { status: 200, headers: { 'content-type': typeOf(k) } }));
    return realFetch ? realFetch(input, init) : Promise.reject(new TypeError('fetch unavailable'));
  };

  // XMLHttpRequest for packed text files (older games, some loaders).
  var RealXHR = window.XMLHttpRequest;
  if (RealXHR) {
    var open = RealXHR.prototype.open, send = RealXHR.prototype.send;
    RealXHR.prototype.open = function (method, u) { this.__town = (fileMode || /^\//.test(u)) ? lookup(F, u) : null; return open.apply(this, arguments); };
    RealXHR.prototype.send = function () {
      var k = this.__town;
      if (k === null || k === undefined) return send.apply(this, arguments);
      var xhr = this, text = F[k];
      var define = function (n, v) { try { Object.defineProperty(xhr, n, { configurable: true, value: v }); } catch (e) { /* read-only */ } };
      define('readyState', 4); define('status', 200); define('statusText', 'OK'); define('responseURL', k);
      define('responseText', text); define('response', xhr.responseType === 'json' ? JSON.parse(text) : text);
      setTimeout(function () {
        if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
        xhr.dispatchEvent(new Event('readystatechange'));
        if (typeof xhr.onload === 'function') xhr.onload(new ProgressEvent('load'));
        xhr.dispatchEvent(new ProgressEvent('load'));
        xhr.dispatchEvent(new ProgressEvent('loadend'));
      }, 0);
    };
  }

  // file:// images are cross-origin to the page, so WebGL cannot use them as textures.
  // Games that need that ship their images as data URIs, swapped in on assignment.
  if (fileMode && Object.keys(IMG).length) {
    var desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
      configurable: true, enumerable: true, get: function () { return desc.get.call(this); },
      set: function (v) { var k = typeof v === 'string' && !/^(data|blob):/.test(v) ? lookup(IMG, v) : null; desc.set.call(this, k ? IMG[k] : v); },
    });
    var co = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'crossOrigin');
    Object.defineProperty(HTMLImageElement.prototype, 'crossOrigin', { configurable: true, get: function () { return co.get.call(this); }, set: function (v) { if (!fileMode) co.set.call(this, v); } });
  }

  // A page opened from a file cannot rewrite its URL; routers that try would crash.
  if (fileMode) {
    ['pushState', 'replaceState'].forEach(function (m) {
      var real = history[m];
      history[m] = function () { try { return real.apply(history, arguments); } catch (e) { return undefined; } };
    });
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — from overwhelm to one next step</title>
<style>
  :root { --bg:#0e1117; --card:#161b26; --line:#28303f; --text:#e8edf6; --muted:#8b96aa; --accent:#e0a458; --accent2:#6aa0ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:24px; line-height:1.6; }
  .app { max-width:560px; width:100%; }
  header { text-align:center; margin-bottom:22px; }
  header h1 { font-size:1.9rem; }
  header p { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px; }
  .q { font-size:.74rem; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); margin-bottom:8px; }
  h2 { font-size:1.12rem; margin-bottom:10px; }
  textarea,input[type=text] { width:100%; background:#0f1420; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-family:inherit; font-size:1rem; resize:vertical; }
  textarea { min-height:60px; }
  .btn { background:var(--accent); color:#1a1206; border:none; border-radius:10px; padding:12px 18px; font-size:1rem; font-weight:700; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .tags { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 14px; }
  .tag { background:#0f1420; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:.85rem; }
  .tag.active { background:var(--accent2); border-color:var(--accent2); color:#03102b; }
  .prog { height:5px; background:#0f1420; border-radius:999px; overflow:hidden; margin-bottom:18px; }
  .prog > div { height:100%; background:var(--accent); transition:width .3s; }
  .hide { display:none; }
  .saved { font-size:.9rem; }
  .ditem { border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .ditem h3 { font-size:1rem; margin-bottom:4px; }
  .ditem .meta { color:var(--muted); font-size:.76rem; margin-bottom:8px; }
  .ditem .step { font-size:.86rem; margin:3px 0; }
  .ditem .step b { color:var(--accent); }
  .empty { color:var(--muted); text-align:center; padding:16px; }
  .pill { display:inline-block; background:#0f1420; border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:.72rem; color:var(--muted); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧭 Waypoint</h1>
    <p>From overwhelm to one clear, kind next step.</p>
  </header>

  <div class="card" id="flow">
    <div class="prog"><div id="bar" style="width:20%"></div></div>
    <div id="qbox"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="btn ghost" id="back">← Back</button>
      <button class="btn" id="next">Next →</button>
    </div>
  </div>

  <div class="card saved">
    <div class="toolbar">
      <strong style="flex:1">Your decisions</strong>
      <button class="btn ghost" id="expJson">Export JSON</button>
      <button class="btn ghost" id="expMd">Export Markdown</button>
    </div>
    <div class="tags" id="filterRow" style="margin-bottom:10px"></div>
    <div id="list"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='waypoint_decisions';
const TAGS=['work','family','health','money','project','faith'];
const STEPS=[
  {key:'decision', q:'Step 1', t:'What are you deciding or avoiding?', ph:'Name the thing plainly…', tags:true},
  {key:'matters', q:'Step 2', t:'What matters most here?', ph:'The value, person, or outcome that really counts…'},
  {key:'options', q:'Step 3', t:'What are the real options?', ph:'List them — even the ones you dislike…'},
  {key:'step', q:'Step 4', t:'What is the smallest reversible next step?', ph:'Something you could do today and undo if needed…'},
  {key:'wisdom', q:'Step 5', t:'What would wisdom, kindness, and courage look like?', ph:'Not the perfect answer — just an honest one…'}
];
let i=0, draft={tags:[]};

function renderStep(){
  const s=STEPS[i];
  $('bar').style.width=((i+1)/STEPS.length*100)+'%';
  let html=`<div class="q">${s.q}</div><h2>${s.t}</h2>`;
  if(s.tags){ html+=`<div class="tags" id="tagRow">${TAGS.map(t=>`<span class="tag${draft.tags.includes(t)?' active':''}" data-t="${t}">${t}</span>`).join('')}</div>`; }
  html+=`<textarea id="ans" placeholder="${s.ph}">${draft[s.key]||''}</textarea>`;
  $('qbox').innerHTML=html;
  if(s.tags){ document.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{ const t=el.dataset.t; draft.tags.includes(t)?draft.tags=draft.tags.filter(x=>x!==t):draft.tags.push(t); el.classList.toggle('active'); }); }
  $('back').style.visibility=i===0?'hidden':'visible';
  $('next').textContent=i===STEPS.length-1?'Save decision ✓':'Next →';
  $('ans').focus();
}
$('next').onclick=()=>{ draft[STEPS[i].key]=$('ans').value.trim(); if(i<STEPS.length-1){ i++; renderStep(); } else { save(); } };
$('back').onclick=()=>{ draft[STEPS[i].key]=$('ans').value.trim(); if(i>0){ i--; renderStep(); } };

function save(){
  if(!draft.decision){ alert('Add at least the decision (Step 1) before saving.'); i=0; renderStep(); return; }
  const list=load();
  list.unshift({...draft, at:new Date().toISOString()});
  localStorage.setItem(KEY,JSON.stringify(list.slice(0,100)));
  draft={tags:[]}; i=0; renderStep(); renderFilters(); renderList();
}
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function persist(list){ localStorage.setItem(KEY,JSON.stringify(list)); }
let activeFilter='all';
function renderFilters(){
  const used=Array.from(new Set(load().flatMap(d=>d.tags||[])));
  const row=$('filterRow');
  if(!used.length){ row.innerHTML=''; return; }
  row.innerHTML=[['all','All'],...used.map(t=>[t,t])].map(([id,label])=>`<span class="tag ${activeFilter===id?'active':''}" data-f="${id}">${label}</span>`).join('');
  row.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{ activeFilter=el.dataset.f; renderFilters(); renderList(); });
}
function renderList(){
  let list=load().map((d,i)=>({...d,_i:i}));
  const L=$('list');
  if(!list.length){ L.innerHTML='<div class="empty">No decisions saved yet. Walk the five steps above and your first waypoint will appear here.</div>'; return; }
  if(activeFilter!=='all') list=list.filter(d=>(d.tags||[]).includes(activeFilter));
  if(!list.length){ L.innerHTML='<div class="empty">No decisions with that tag.</div>'; return; }
  L.innerHTML=list.map(d=>`<div class="ditem" style="${d.revisit?'border-color:var(--accent)':''}">
    <h3>${d.revisit?'🔖 ':''}${esc(d.decision)}</h3>
    <div class="meta">${new Date(d.at).toLocaleString()} ${(d.tags||[]).map(t=>`<span class="pill">${t}</span>`).join(' ')}</div>
    ${d.matters?`<div class="step"><b>Matters:</b> ${esc(d.matters)}</div>`:''}
    ${d.options?`<div class="step"><b>Options:</b> ${esc(d.options)}</div>`:''}
    ${d.step?`<div class="step"><b>Next step:</b> ${esc(d.step)}</div>`:''}
    ${d.wisdom?`<div class="step"><b>Wisdom:</b> ${esc(d.wisdom)}</div>`:''}
    <div class="row" style="margin-top:8px">
      <button class="pill" style="cursor:pointer;background:none" data-rev="${d._i}">${d.revisit?'✓ Revisiting':'🔖 Revisit later'}</button>
      <button class="pill" style="cursor:pointer;background:none;color:var(--bad,#e0857a)" data-del="${d._i}">🗑 Delete</button>
    </div>
  </div>`).join('');
  L.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ const all=load(); all[+b.dataset.rev].revisit=!all[+b.dataset.rev].revisit; persist(all); renderList(); });
  L.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this decision?')){ const all=load(); all.splice(+b.dataset.del,1); persist(all); renderFilters(); renderList(); } });
}
function esc(s){ return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
$('expJson').onclick=()=>download('waypoint-decisions.json',JSON.stringify(load(),null,2),'application/json');
$('expMd').onclick=()=>{ const md=load().map(d=>`## ${d.decision}\n_${new Date(d.at).toLocaleString()}_ ${(d.tags||[]).map(t=>'#'+t).join(' ')}\n\n- **Matters most:** ${d.matters||''}\n- **Options:** ${d.options||''}\n- **Smallest next step:** ${d.step||''}\n- **Wisdom/kindness/courage:** ${d.wisdom||''}\n`).join('\n---\n\n')||'_No decisions yet._'; download('waypoint-decisions.md','# Waypoint decisions\n\n'+md,'text/markdown'); };
renderStep(); renderFilters(); renderList();
</script>

</body>
</html>
