(function () {

moke test so CI proves `index.html` + app + engine actually work together, not just the engine module.\n3. Test PWA/service-worker update behaviour if offline use matters.\n4. Add dependency/security checks if dependencies grow; do not add a large toolchain merely for appearances.\n5. Preserve the current app/engine separation unless a real new concept requires another module.\n\n## Bottom line\n\n**TextGame is already pleasantly boring. Add one real browser check and resist unnecessary architecture.**\n","package.json":"{\"name\":\"textgame\",\"private\":true,\"type\":\"module\",\"scripts\":{\"check\":\"node --check src/engine.mjs && node --check src/app.mjs && node --check service-worker.js\",\"test\":\"npm run check && node --test tests/*.test.mjs\"}}\n"};

  // Games that need that ship their images as data URIs, swapped in on assignment.
  if (fileMode && Object.keys(IMG).length) {

</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>TextGame — Signal at Black Ridge</title>
  <meta name="description" content="A small, deterministic browser text adventure and reusable command-engine demo.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">TEXTGAME ENGINE v1</p>
        <h1>Signal at Black Ridge</h1>
        <p>Explore, collect what you need, and restore the emergency beacon. No account. No server. Your save stays on this device.</p>
      </div>
      <div class="status" aria-label="Game status">
        <span id="location-chip">Base Camp</span>
        <span id="health-chip">Health 5/5</span>
        <span id="stamina-chip">Stamina 5/5</span>
        <span id="turns-chip">Turns 0</span>
      </div>
    </header>

    <section class="game-grid">
      <div class="terminal-card">
        <div id="output" class="output" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form id="command-form" class="command-bar" autocomplete="off">
          <label class="sr-only" for="command">Command</label>
          <span aria-hidden="true">&gt;</span>
          <input id="command" name="command" inputmode="text" autocapitalize="none" spellcheck="false" placeholder="try: look, north, take lantern…">
          <button type="submit">Run</button>
        </form>
      </div>

      <aside class="side-card" aria-label="Game controls and discovered locations">
        <h2>Quick commands</h2>
        <div id="quick-actions" class="quick-actions">
          <button data-command="look">Look</button>
          <button data-command="north">North</button>
          <button data-command="east">East</button>
          <button data-command="south">South</button>
          <button data-command="west">West</button>
          <button data-command="inventory">Inventory</button>
          <button data-command="status">Status</button>
          <button data-command="goal">Goal</button>
          <button data-command="rest">Rest</button>
          <button data-command="help">Help</button>
        </div>
        <div class="utility-actions">
          <button id="undo" type="button" disabled>Undo</button>
          <button id="reset" type="button">New game</button>
        </div>
        <h2>Discovered</h2>
        <ul id="discovered-list" class="discovered"></ul>
        <p class="privacy-note">Autosave uses <code>localStorage</code>. Nothing is uploaded.</p>
      </aside>
    </section>
  </main>
  <script type="module">// src/engine.mjs
var MAX_HEALTH = 5;
var MAX_STAMINA = 5;
var WORLD = Object.freeze({
  camp: {
    name: "Base Camp",
    description: "A canvas shelter, a cold fire ring and a trail marker pointing into the hills.",
    exits: { north: "ridge", east: "creek" }
  },
  creek: {
    name: "Ironbark Creek",
    description: "Shallow water slips over red stone. A maintenance crate sits beneath a leaning gum.",
    exits: { west: "camp", north: "tower" }
  },
  ridge: {
    name: "Black Ridge",
    description: "Wind combs through dry grass. The old radio tower stands to the east.",
    exits: { south: "camp", east: "tower" }
  },
  tower: {
    name: "Signal Tower",
    description: "The emergency beacon is dark. Its fuse housing is open and empty.",
    exits: { west: "ridge", south: "creek" }
  }
});
var ITEM_NAMES = Object.freeze({
  lantern: "storm lantern",
  fuse: "copper fuse",
  bandage: "field bandage"
});
var normalise = (value) => value.trim().toLowerCase().replace(/\s+/g, " ");
var clone = (state2) => ({
  ...state2,
  inventory: [...state2.inventory],
  discovered: [...state2.discovered],
  items: Object.fromEntries(Object.entries(state2.items).map(([key, value]) => [key, [...value]])),
  flags: { ...state2.flags }
});
function createInitialState() {
  return {
    version: 1,
    location: "camp",
    health: MAX_HEALTH,
    stamina: MAX_STAMINA,
    turns: 0,
    inventory: [],
    discovered: ["camp"],
    items: {
      camp: ["lantern"],
      creek: ["fuse", "bandage"],
      ridge: [],
      tower: []
    },
    flags: {
      beaconLit: false,
      ridgeHazardTriggered: false
    }
  };
}
function isValidState(value) {
  return Boolean(
    value && value.version === 1 && WORLD[value.location] && Number.isInteger(value.health) && value.health >= 0 && value.health <= MAX_HEALTH && Number.isInteger(value.stamina) && value.stamina >= 0 && value.stamina <= MAX_STAMINA && Number.isInteger(value.turns) && value.turns >= 0 && Array.isArray(value.inventory) && value.inventory.every((item) => ITEM_NAMES[item]) && Array.isArray(value.discovered) && value.discovered.every((location) => WORLD[location]) && value.items && typeof value.items === "object" && value.flags && typeof value.flags.beaconLit === "boolean" && typeof value.flags.ridgeHazardTriggered === "boolean"
  );
}
function describeLocation(state2) {
  const place = WORLD[state2.location];
  const here = state2.items[state2.location] || [];
  const exits = Object.keys(place.exits).join(", ");
  const itemText = here.length ? ` You can see ${here.map((item) => `a ${ITEM_NAMES[item]}`).join(" and ")}.` : "";
  return `${place.name}. ${place.description}${itemText} Exits: ${exits}.`;
}
function getStatus(state2) {
  return {
    location: WORLD[state2.location].name,
    health: state2.health,
    stamina: state2.stamina,
    turns: state2.turns,
    won: state2.flags.beaconLit,
    inventory: state2.inventory.map((item) => ITEM_NAMES[item]),
    discovered: state2.discovered.map((location) => WORLD[location].name)
  };
}
var aliases = Object.freeze({
  n: "go north",
  s: "go south",
  e: "go east",
  w: "go west",
  north: "go north",
  south: "go south",
  east: "go east",
  west: "go west",
  i: "inventory",
  inv: "inventory",
  l: "look",
  h: "help",
  "?": "help"
});
function resolveItem(text) {
  const cleaned = normalise(text).replace(/^(the|a|an) /, "");
  return Object.keys(ITEM_NAMES).find((key) => key === cleaned || ITEM_NAMES[key] === cleaned || ITEM_NAMES[key].includes(cleaned));
}
function response(state2, output2, { changed = false, tone = "normal" } = {}) {
  return { state: state2, output: output2, changed, tone };
}
function executeCommand(currentState, rawInput) {
  if (!isValidState(currentState)) return response(createInitialState(), "Saved game data was invalid, so a fresh game was started.", { changed: true, tone: "warning" });
  const original = currentState;
  const input2 = aliases[normalise(rawInput)] || normalise(rawInput);
  if (!input2) return response(original, "Type a command, or use \u201Chelp\u201D.");
  if (input2 === "help") {
    return response(original, "Commands: look, go north/east/south/west (or n/e/s/w), take <item>, use <item>, inventory, status, rest, goal, help.");
  }
  if (input2 === "look") return response(original, describeLocation(original));
  if (input2 === "goal") return response(original, original.flags.beaconLit ? "Goal complete: the emergency beacon is broadcasting." : "Goal: restore the emergency beacon at the Signal Tower.");
  if (input2 === "inventory") {
    return response(original, original.inventory.length ? `You carry: ${original.inventory.map((item) => ITEM_NAMES[item]).join(", ")}.` : "Your pack is empty.");
  }
  if (input2 === "status") {
    return response(original, `Health ${original.health}/${MAX_HEALTH}. Stamina ${original.stamina}/${MAX_STAMINA}. Turns ${original.turns}.`);
  }
  if (input2 === "rest") {
    if (!["camp", "creek"].includes(original.location)) return response(original, "This is not a safe place to stop and recover.");
    const next = clone(original);
    next.stamina = MAX_STAMINA;
    next.health = Math.min(MAX_HEALTH, next.health + 1);
    next.turns += 1;
    return response(next, "You rest, drink some water and recover your stamina.", { changed: true, tone: "good" });
  }
  const [verb, ...rest] = input2.split(" ");
  const argument = rest.join(" ");
  if (verb === "go") {
    const direction = argument;
    const target = WORLD[original.location].exits[direction];
    if (!target) return response(original, `You cannot go ${direction || "that way"} from here.`);
    if (original.stamina <= 0) return response(original, "You are too exhausted to travel. Rest at camp or the creek first.", { tone: "warning" });
    const next = clone(original);
    next.location = target;
    next.stamina -= 1;
    next.turns += 1;
    if (!next.discovered.includes(target)) next.discovered.push(target);
    let prefix = `You go ${direction}. `;
    if (target === "ridge" && !next.inventory.includes("lantern") && !next.flags.ridgeHazardTriggered) {
      next.flags.ridgeHazardTriggered = true;
      next.health = Math.max(0, next.health - 1);
      prefix += "In the fading light you stumble on loose rock and lose 1 health. ";
    }
    return response(next, `${prefix}${describeLocation(next)}`, { changed: true, tone: next.health === 0 ? "warning" : "normal" });
  }
  if (verb === "take") {
    const item = resolveItem(argument);
    if (!item) return response(original, `There is no item called \u201C${argument || "that"}\u201D here.`);
    const here = original.items[original.location] || [];
    if (!here.includes(item)) return response(original, `There is no ${ITEM_NAMES[item]} here to take.`);
    const next = clone(original);
    next.items[next.location] = next.items[next.location].filter((value) => value !== item);
    next.inventory.push(item);
    next.turns += 1;
    return response(next, `You take the ${ITEM_NAMES[item]}.`, { changed: true, tone: "good" });
  }
  if (verb === "use") {
    const item = resolveItem(argument);
    if (!item || !original.inventory.includes(item)) return response(original, `You are not carrying ${argument ? `the ${argument}` : "that item"}.`);
    if (item === "bandage") {
      if (original.health >= MAX_HEALTH) return response(original, "You are already at full health. Save the bandage.");
      const next = clone(original);
      next.inventory = next.inventory.filter((value) => value !== "bandage");
      next.health = Math.min(MAX_HEALTH, next.health + 2);
      next.turns += 1;
      return response(next, "You use the field bandage and recover 2 health.", { changed: true, tone: "good" });
    }
    if (item === "lantern") {
      return response(original, original.location === "ridge" ? "The lantern throws a steady pool of light across the ridge." : "You check the lantern. It is ready when you need it.");
    }
    if (item === "fuse") {
      if (original.location !== "tower") return response(original, "The copper fuse belongs in the emergency beacon at the Signal Tower.");
      if (original.flags.beaconLit) return response(original, "The beacon is already repaired and broadcasting.");
      const next = clone(original);
      next.inventory = next.inventory.filter((value) => value !== "fuse");
      next.flags.beaconLit = true;
      next.turns += 1;
      return response(next, "You seat the copper fuse. The beacon wakes, pulses green, and begins broadcasting your location. You win.", { changed: true, tone: "win" });
    }
  }
  return response(original, `I do not understand \u201C${rawInput.trim()}\u201D. Type \u201Chelp\u201D for commands.`);
}

// src/app.mjs
var STORAGE_KEY = "textgame-save-v1";
var output = document.querySelector("#output");
var form = document.querySelector("#command-form");
var input = document.querySelector("#command");
var quick = document.querySelector("#quick-actions");
var undoButton = document.querySelector("#undo");
var resetButton = document.querySelector("#reset");
var chips = {
  location: document.querySelector("#location-chip"),
  health: document.querySelector("#health-chip"),
  stamina: document.querySelector("#stamina-chip"),
  turns: document.querySelector("#turns-chip")
};
var discoveredList = document.querySelector("#discovered-list");
var state = loadState();
var history = [];
function loadState() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    return isValidState(parsed) ? parsed : createInitialState();
  } catch {
    return createInitialState();
  }
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function print(message, type = "system") {
  const line = document.createElement("p");
  line.className = `line line-${type}`;
  line.textContent = message;
  output.append(line);
  output.scrollTop = output.scrollHeight;
}
function renderStatus() {
  const status = getStatus(state);
  chips.location.textContent = status.location;
  chips.health.textContent = `Health ${status.health}/5`;
  chips.stamina.textContent = `Stamina ${status.stamina}/5`;
  chips.turns.textContent = `Turns ${status.turns}`;
  discoveredList.innerHTML = "";
  status.discovered.forEach((place) => {
    const item = document.createElement("li");
    item.textContent = place;
    discoveredList.append(item);
  });
  undoButton.disabled = history.length === 0;
  document.body.dataset.won = status.won ? "true" : "false";
}
function run(command, echo = true) {
  const trimmed = command.trim();
  if (!trimmed) return;
  if (echo) print(`> ${trimmed}`, "command");
  const result = executeCommand(state, trimmed);
  if (result.changed) history.push(state);
  state = result.state;
  if (result.changed) persist();
  print(result.output, result.tone === "win" ? "win" : result.tone === "warning" ? "warning" : "system");
  renderStatus();
}
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const command = input.value;
  input.value = "";
  run(command);
  input.focus();
});
quick.addEventListener("click", (event) => {
  const button = event.target.closest("[data-command]");
  if (button) run(button.dataset.command);
});
undoButton.addEventListener("click", () => {
  const previous = history.pop();
  if (!previous) return;
  state = previous;
  persist();
  print("> undo", "command");
  print("The last state-changing action was undone.", "good");
  renderStatus();
});
resetButton.addEventListener("click", () => {
  const confirmed = window.confirm("Start a fresh game? Your current local save will be replaced.");
  if (!confirmed) return;
  state = createInitialState();
  history = [];
  persist();
  output.innerHTML = "";
  print("Fresh game started.", "good");
  print(describeLocation(state));
  renderStatus();
  input.focus();
});
print("TEXTGAME // Signal at Black Ridge", "title");
print("Goal: restore the emergency beacon. Type \u201Chelp\u201D or tap a quick command. Progress saves automatically on this device.");
print(describeLocation(state));
renderStatus();
input.focus();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
</script>
