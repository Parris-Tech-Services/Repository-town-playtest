// web server run from a folder, including from file:// in the offline zip.
// The packer fills in the game's small text files (F) and optional images as data URIs (IMG).
(function () {

  // Maps a request URL to a packed file: first relative to the game folder, then, for
  // root-absolute paths ("/seed/x.md", "/src/data/map.json"), by its longest matching tail.
  function lookup(map, u) {
    try {
      var url = new URL(u, location.href);
      if (!fileMode && url.origin !== location.origin) return null;
      var base = new URL('.', location.href).pathname;
      var p = decodeURIComponent(url.pathname);
      if (p.indexOf(base) === 0 && has(map, p.slice(base.length))) return p.slice(base.length);
      var parts = p.split('/').filter(Boolean);
      for (var i = 0; i < parts.length; i++) { var k = parts.slice(i).join('/'); if (has(map, k)) return k; }
    } catch (e) { /* not a URL */ }
    return null;
  }
  var typeOf = function (k) { return /\.json$/i.test(k) ? 'application/json' : /\.svg$/i.test(k) ? 'image/svg+xml' : /\.html?$/i.test(k) ? 'text/html' : 'text/plain'; };

  var realFetch = window.fetch && window.fetch.bind(window);
  window.fetch = function (input, init) {
    var u = typeof input === 'string' ? input : input && input.url;
    var k = u && lookup(F, u);
    // Online the real server answers relative requests; packed copies cover file:// and
    // root-absolute paths that no longer exist on the host.
    if (k !== null && k !== undefined && (fileMode || /^\//.test(u) || !realFetch)) return Promise.resolve(new Response(F[k], { status: 200, headers: { 'content-type': typeOf(k) } }));
    return realFetch ? realFetch(input, init) : Promise.reject(new TypeError('fetch unavailable'));
  };

  // XMLHttpRequest for packed text files (older games, some loaders).
  var RealXHR = window.XMLHttpRequest;
  if (RealXHR) {

    RealXHR.prototype.open = function (method, u) { this.__town = (fileMode || /^\//.test(u)) ? lookup(F, u) : null; return open.apply(this, arguments); };
    RealXHR.prototype.send = function () {

  }

  // file:// images are cross-origin to the page, so WebGL cannot use them as textures.
  // Games that need that ship their images as data URIs, swapped in on assignment.
  if (fileMode && Object.keys(IMG).length) {

    Object.defineProperty(HTMLImageElement.prototype, 'src', {

    });

</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boundary Road Panos</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #161922;
      --border: #252a36;
      --accent: #7cd2ff;
      --text: #e7e9ee;
      --muted: #9aa3b5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 320px 1fr; }
    aside { padding: 20px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0 0 4px; font-size: 20px; color: var(--accent); }
    p { margin: 0; color: var(--muted); }
    select, button { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0c0f17; color: var(--text); font-size: 14px; }
    button { cursor: pointer; transition: transform 120ms ease, border-color 120ms ease; }
    button:hover { transform: translateY(-1px); border-color: var(--accent); }
    .viewer { position: relative; }
    #pano { width: 100%; height: 100vh; }
    .meta { font-size: 13px; line-height: 1.5; }
    .pill { display: inline-block; background: #1f2533; border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; margin-right: 6px; margin-bottom: 6px; color: var(--muted); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.105.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.0/build/panolens.min.js"></script>
  <link rel="stylesheet" href="/css/joshhub-header.css">
  <script src="/js/joshhub-header.js" defer></script>
</head>

<body>
  <aside>
    <h1>Boundary Road Panos</h1>
    <p>Explore the key rooms with the Panolens viewer.</p>
    <label>
      <span class="meta">Choose a room</span>
      <select id="pano-select"></select>
    </label>
    <div class="meta">
      <div id="label" style="font-weight:600; margin-bottom:6px;"></div>
      <div id="notes"></div>
      <div style="margin-top:8px;" id="tags"></div>
    </div>
    <div class="meta" style="margin-top:auto;">
      <p>Files live in <code>/public/panos/</code>. Want more fidelity? Drop higher-res JPGs with the same names and reload.</p>
    </div>
  </aside>
  <div class="viewer">
    <div id="pano"></div>
  </div>
  <script>
    (async function(){
      const panos = [
        { file: "6a9dcc02-8f31-401c-b140-481c54d993f7.jpg", label: "Kitchen / Living", notes: "Start here; central space.", tags: ["kitchen", "living", "entry"] },
        { file: "0e48e5c2-439f-4498-ade0-7d6771a41307.jpg", label: "Hallway (Kitchen side)", notes: "Looking toward kitchen/living.", tags: ["hallway"] },
        { file: "3c7dca77-cefc-4249-9a2e-c6cff36b1f14.jpg", label: "Hallway (Entry side)", notes: "Entry-side view of the hall.", tags: ["hallway", "entry"] },
        { file: "0dc837e6-fee6-4243-aa83-f5a0eb175f86.jpg", label: "Bathroom", notes: "", tags: ["bathroom"] },
        { file: "1c47c819-169c-4929-bda6-624ecabaf169.jpg", label: "Tiled Room", notes: "Tiled room off the hall.", tags: ["room", "tiled"] },
        { file: "5ac9a54245563e00644b3efdee0bb113.jpg", label: "Patio Door", notes: "Inside view toward patio.", tags: ["patio", "door"] },
        { file: "7d1d626e-5b6e-485c-b763-b30873df15ac.jpg", label: "Patio Ramp", notes: "Ramp/outdoor approach.", tags: ["patio", "ramp", "outdoor"] },
        { file: "7d88da36-6f7e-498e-acdb-5aadcceb621f.jpg", label: "Garage / Workshop", notes: "Workshop/garage view.", tags: ["garage", "workshop"] },
        { file: "2f7547c2-aaab-42df-a031-7c6e1e13fc82.jpg", label: "Backyard", notes: "Backyard pano.", tags: ["backyard", "outdoor"] },
      ];

      const selectEl = document.getElementById("pano-select");
      const labelEl = document.getElementById("label");
      const notesEl = document.getElementById("notes");
      const tagsEl = document.getElementById("tags");

      panos.forEach((p, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = p.label;
        selectEl.appendChild(opt);
      });

      if(window.JoshHubHeader && window.JoshHubHeader.ensure) window.JoshHubHeader.ensure();

      const viewer = new PANOLENS.Viewer({ container: document.getElementById("pano"), autoHideInfospot: false });

      async function resolveUrl(filename){
        const url = `/panos/${filename}`;
        try{
          const res = await fetch(url, { method: 'HEAD' });
          if(res.ok) return url;
        }catch(e){}
        return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024"><rect width="100%" height="100%" fill="#161922"/><text x="50%" y="50%" fill="#7cd2ff" font-family="sans-serif" font-size="48" text-anchor="middle">Boundary Road Panorama</text></svg>');
      }

      const scenes = await Promise.all(panos.map(async (p) => {
        const u = await resolveUrl(p.file);
        return new PANOLENS.ImagePanorama(u);
      }));

      scenes.forEach((scene) => viewer.add(scene));

      let current = 0;
      function show(idx) {
        current = (idx + panos.length) % panos.length;
        selectEl.value = String(current);
        viewer.setPanorama(scenes[current]);
        const meta = panos[current];
        labelEl.textContent = meta.label;
        notesEl.textContent = meta.notes || " ";
        tagsEl.innerHTML = meta.tags.map((t) => `<span class="pill">${t}</span>`).join("");
      }

      selectEl.addEventListener("change", (e) => show(parseInt(e.target.value, 10)));
      document.getElementById("prev")?.addEventListener("click", () => show(current - 1));
      document.getElementById("next")?.addEventListener("click", () => show(current + 1));

      show(0);
    })();
  </script>
</body>

</html>
